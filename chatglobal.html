<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YUNA · Chat Global</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #f472b6; --secondary: #a78bfa; --bg: #0a0e1a;
  --card: rgba(18,24,42,0.8); --text: #f1f5f9; --text-muted: #94a3b8; --border: rgba(255,255,255,0.1);
}
.theme-padrao { --primary: #f472b6; --secondary: #a78bfa; }
.theme-azul { --primary: #38bdf8; --secondary: #2dd4bf; }
.theme-amarelo { --primary: #facc15; --secondary: #f97316; }
.theme-branco { --primary: #cbd5e1; --secondary: #94a3b8; }

* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header { background: rgba(10,14,26,0.95); padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); z-index: 10; }
.header a { color: var(--text); font-size: 20px; text-decoration: none; }
.header h1 { font-size: 18px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px;}
.msg { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.eu { align-self: flex-end; align-items: flex-end; }
.msg.outro { align-self: flex-start; align-items: flex-start; }

.msg-info { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.msg-info img { width: 20px; height: 20px; border-radius: 50%; }
.msg-info strong { color: var(--primary); }

.balao { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; max-width: 100%; position: relative; cursor: pointer; transition: 0.3s; }
.msg.eu .balao { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-bottom-right-radius: 4px; }
.msg.outro .balao { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

/* DESTAQUE PARA QUEM FOI RESPONDIDO */
.msg.destaque-notificacao .balao { animation: brilho 1.5s infinite; border: 2px solid var(--primary); box-shadow: 0 0 15px var(--primary); }
@keyframes brilho { 0% { box-shadow: 0 0 5px var(--primary); } 50% { box-shadow: 0 0 20px var(--primary); } 100% { box-shadow: 0 0 5px var(--primary); } }

/* CITAÇÃO */
.citacao { background: rgba(0,0,0,0.2); border-left: 3px solid rgba(255,255,255,0.5); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
.msg.outro .citacao { background: rgba(255,255,255,0.1); border-left-color: var(--primary); }
.citacao strong { display: block; margin-bottom: 2px; opacity: 0.8; }

/* MENU DE OPÇÕES */
.menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
.menu-box { background: var(--card); border: 1px solid var(--border); border-radius: 15px; width: 80%; max-width: 300px; overflow: hidden; animation: scaleUp 0.2s ease; }
@keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.menu-box button { width: 100%; background: none; border: none; color: var(--text); padding: 15px; text-align: left; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.menu-box button:last-child { border-bottom: none; }
.menu-box button:hover { background: rgba(255,255,255,0.05); }
.menu-box button.apagar { color: #ef4444; }

/* INPUT */
.input-wrapper { display: flex; flex-direction: column; background: rgba(10,14,26,0.95); border-top: 1px solid var(--border); }
.barra-resposta { display: none; padding: 10px 20px; background: var(--card); border-left: 4px solid var(--primary); align-items: center; justify-content: space-between; font-size: 13px; }
.barra-resposta div { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-resposta strong { color: var(--primary); margin-right: 5px; }
.barra-resposta button { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 5px; }

.input-area { padding: 15px 20px calc(15px + env(safe-area-inset-bottom,0px)); display: flex; gap: 10px; }
.input-area input { flex: 1; padding: 14px 20px; border-radius: 25px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; outline: none; }
.input-area button { width: 50px; height: 50px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.editando { border: 2px solid var(--primary) !important; }
</style>
</head>
<body>

<header class="header">
  <a href="home.html"><i class="fas fa-arrow-left"></i></a>
  <h1>💬 Chat Global YUNA</h1>
</header>

<div class="chat-container" id="chatContainer"></div>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu(event)">
  <div class="menu-box" onclick="event.stopPropagation()">
    <button onclick="prepararResposta()"><i class="fas fa-reply"></i> Responder</button>
    <button id="btnMenuEditar" onclick="editarMsg()"><i class="fas fa-pen"></i> Editar</button>
    <button class="apagar" id="btnMenuApagar" onclick="apagarMsg()"><i class="fas fa-trash"></i> Apagar</button>
  </div>
</div>

<div class="input-wrapper">
  <div class="barra-resposta" id="barraResposta">
    <div id="textoResposta"><strong>A responder:</strong> <span>Mensagem original...</span></div>
    <button onclick="cancelarResposta()"><i class="fas fa-times"></i></button>
  </div>
  
  <div class="input-area">
    <input type="text" id="inputMsg" placeholder="Escreve uma mensagem..." onkeypress="if(event.key==='Enter') enviarMensagem()">
    <button id="btnEnviar" onclick="enviarMensagem()"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function() {
  const temaSalvo = localStorage.getItem('yuna_theme') || 'padrao';
  document.body.className = 'theme-' + temaSalvo;
})();

const firebaseConfig = {
    apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
    authDomain: "yuna-8fe24.firebaseapp.com",
    projectId: "yuna-8fe24",
    storageBucket: "yuna-8fe24.firebasestorage.app",
    messagingSenderId: "531340097112",
    appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
const db = firebase.firestore();

let utilizadorAtual = null;
let mensagemEditandoId = null;
let mensagemRespondendo = null;
let msgSelecionada = null;
let primeiraCarga = true; // Para não notificar as mensagens antigas ao abrir o chat

// SOM DE NOTIFICAÇÃO (Base64 para não precisar de ficheiro externo)
const somNotificacao = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"+ "123123"); 

auth.onAuthStateChanged((user) => {
    if (user) {
        utilizadorAtual = user;
        carregarMensagens();
    } else {
        document.getElementById('chatContainer').innerHTML = `<div style="text-align:center; margin-top:50px; color:var(--text-muted);"><i class="fas fa-lock" style="font-size:40px; margin-bottom:15px;"></i><p>Precisas de fazer login para entrar no chat.</p><a href="login.html" style="display:inline-block; margin-top:15px; padding:10px 20px; background:var(--primary); color:#fff; text-decoration:none; border-radius:8px;">Fazer Login</a></div>`;
        document.querySelector('.input-wrapper').style.display = 'none';
    }
});

function enviarMensagem() {
    const input = document.getElementById('inputMsg');
    const texto = input.value.trim();
    if (!texto || !utilizadorAtual) return;

    if (mensagemEditandoId) {
        db.collection("chat_global").doc(mensagemEditandoId).update({
            texto: texto, editado: true
        }).then(() => {
            input.value = "";
            mensagemEditandoId = null;
            document.getElementById('btnEnviar').innerHTML = '<i class="fas fa-paper-plane"></i>';
            input.classList.remove('editando');
        });
    } else {
        const novaMsg = {
            texto: texto,
            uid: utilizadorAtual.uid,
            nome: utilizadorAtual.displayName || "Membro YUNA",
            foto: utilizadorAtual.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
            data: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (mensagemRespondendo) {
            novaMsg.respostaA = {
                nome: mensagemRespondendo.nome,
                texto: mensagemRespondendo.texto
            };
            // AQUI GUARDAMOS QUEM É O DONO DA MENSAGEM ORIGINAL
            novaMsg.respondido_uid = mensagemRespondendo.uid; 
        }

        db.collection("chat_global").add(novaMsg).then(() => {
            input.value = "";
            cancelarResposta();
        });
    }
}

function carregarMensagens() {
    const container = document.getElementById('chatContainer');
    
    // OUVINTE EM TEMPO REAL
    db.collection("chat_global").orderBy("data", "asc").limitToLast(50)
    .onSnapshot((snapshot) => {
        
        // --- SISTEMA DE NOTIFICAÇÃO ---
        if (!primeiraCarga) {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const msg = change.doc.data();
                    // Se a mensagem for nova, for uma resposta E for para o utilizador atual
                    if (msg.respondido_uid === utilizadorAtual.uid && msg.uid !== utilizadorAtual.uid) {
                        tocarSom();
                        // O telemóvel pode bloquear o alert() se não houver interação, 
                        // mas vamos tentar.
                        setTimeout(() => {
                            alert(`💬 ${msg.nome} respondeu-te:\n"${msg.texto}"`);
                        }, 100);
                    }
                }
            });
        }
        primeiraCarga = false; // Depois da primeira carga, ativamos as notificações

        // --- DESENHAR AS MENSAGENS ---
        container.innerHTML = "";
        snapshot.forEach((doc) => {
            const msg = doc.data();
            const isEu = msg.uid === utilizadorAtual.uid;
            const id = doc.id;
            
            let htmlCitacao = "";
            if (msg.respostaA) {
                htmlCitacao = `<div class="citacao"><strong>${msg.respostaA.nome}</strong>${msg.respostaA.texto}</div>`;
            }

            const div = document.createElement('div');
            // Adiciona a classe de destaque se a mensagem for a resposta para mim
            const isRespostaParaMim = msg.respondido_uid === utilizadorAtual.uid && !isEu;
            div.className = `msg ${isEu ? 'eu' : 'outro'} ${isRespostaParaMim ? 'destaque-notificacao' : ''}`;
            
            div.innerHTML = `
                <div class="msg-info">
                    <img src="${msg.foto}" alt="">
                    <strong>${isEu ? 'Tu' : msg.nome}</strong>
                </div>
                <div class="balao" oncontextmenu="abrirMenu(event, '${id}')">
                    ${htmlCitacao}
                    ${msg.texto} ${msg.editado ? '<span style="font-size:10px;opacity:0.6;">(editado)</span>' : ''}
                </div>
            `;
            container.appendChild(div);
        });
        
        // Remove o destaque após 3 segundos
        setTimeout(() => {
            document.querySelectorAll('.destaque-notificacao').forEach(el => el.classList.remove('destaque-notificacao'));
        }, 3000);

        const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 100;
        if (isScrolledToBottom) container.scrollTop = container.scrollHeight;
    });
}

function tocarSom() {
    // Cria um som de "plim" usando a Web Audio API (sem precisar de ficheiros)
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) { console.log("Áudio bloqueado pelo browser"); }
}

function abrirMenu(event, id) {
    event.preventDefault();
    msgSelecionada = id;
    
    db.collection("chat_global").doc(id).get().then(doc => {
        const msg = doc.data();
        if (msg.uid === utilizadorAtual.uid) {
            document.getElementById('btnMenuEditar').style.display = 'flex';
            document.getElementById('btnMenuApagar').style.display = 'flex';
        } else {
            document.getElementById('btnMenuEditar').style.display = 'none';
            document.getElementById('btnMenuApagar').style.display = 'none';
        }
        
        // GUARDAR O UID DO DONO DA MENSAGEM PARA A NOTIFICAÇÃO
        mensagemRespondendo = { id: id, uid: msg.uid, nome: msg.nome, texto: msg.texto };
        
        document.getElementById('menuOverlay').style.display = 'flex';
    });
}

function fecharMenu(e) { if(e) e.stopPropagation(); document.getElementById('menuOverlay').style.display = 'none'; }

function prepararResposta() {
    document.getElementById('barraResposta').style.display = 'flex';
    document.getElementById('textoResposta').innerHTML = `<strong>${mensagemRespondendo.nome}:</strong> ${mensagemRespondendo.texto}`;
    document.getElementById('inputMsg').focus();
    fecharMenu();
}

function cancelarResposta() {
    mensagemRespondendo = null;
    document.getElementById('barraResposta').style.display = 'none';
}

function editarMsg() {
    mensagemEditandoId = msgSelecionada;
    document.getElementById('inputMsg').value = mensagemRespondendo.texto;
    document.getElementById('inputMsg').classList.add('editando');
    document.getElementById('btnEnviar').innerHTML = '<i class="fas fa-check"></i>';
    document.getElementById('inputMsg').focus();
    fecharMenu();
}

function apagarMsg() {
    if (confirm("Tens a certeza que queres apagar esta mensagem?")) {
        db.collection("chat_global").doc(msgSelecionada).delete();
    }
    fecharMenu();
}
</script>
</body>
</html>
