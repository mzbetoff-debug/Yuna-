<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNA - Perfil</title>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== VARIÁVEIS DOS TEMAS (Global) ===== */
        :root {
            --fundo: #0f0a1f; --fundo-card: #1a1033; --texto: #ffffff; --texto-suave: #b8b0d0;
            --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #2d1b4e; --sombra: rgba(139, 92, 246, 0.3);
        }
        body.tema-roxo { --fundo: #0f0a1f; --fundo-card: #1a1033; --texto: #ffffff; --texto-suave: #b8b0d0; --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #2d1b4e; --sombra: rgba(139, 92, 246, 0.3); }
        body.tema-branco { --fundo: #f5f5f7; --fundo-card: #ffffff; --texto: #1a1a1a; --texto-suave: #555555; --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #e0e0e0; --sombra: rgba(0, 0, 0, 0.1); }
        body.tema-azul { --fundo: #0a1428; --fundo-card: #0f1f3d; --texto: #ffffff; --texto-suave: #a0b8d8; --primaria: #3b82f6; --primaria-hover: #2563eb; --borda: #1e3a6f; --sombra: rgba(59, 130, 246, 0.3); }
        body.tema-amarelo { --fundo: #1a1500; --fundo-card: #2a2000; --texto: #ffffff; --texto-suave: #d0c890; --primaria: #fbbf24; --primaria-hover: #f59e0b; --borda: #4a3a00; --sombra: rgba(251, 191, 36, 0.3); }

        /* ===== ESTILOS GERAIS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--fundo); color: var(--texto); transition: background 0.3s, color 0.3s; padding-bottom: 80px; }
        
        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--borda); background: var(--fundo); }
        .btn-header { background: transparent; border: 1px solid var(--borda); color: var(--texto); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .logo-header { color: var(--primaria); font-weight: bold; font-size: 20px; letter-spacing: 1px; }
        
        /* SELETOR DE TEMAS */
        .seletor-temas { position: fixed; top: 70px; right: 15px; display: flex; gap: 8px; z-index: 999; background: var(--fundo-card); padding: 8px; border-radius: 30px; border: 1px solid var(--borda); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .cor-btn { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .cor-btn:hover { transform: scale(1.2); }
        .cor-btn[data-tema="roxo"] { background: #8b5cf6; }
        .cor-btn[data-tema="branco"] { background: #ffffff; border-color: #ccc; }
        .cor-btn[data-tema="azul"] { background: #3b82f6; }
        .cor-btn[data-tema="amarelo"] { background: #fbbf24; }
        .cor-btn.ativo { border-color: var(--texto); transform: scale(1.1); }

        /* CONTEÚDO */
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* CARTÃO DE PERFIL */
        .card-perfil { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; padding: 30px 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px var(--sombra); }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #d8b4fe; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; border: 3px solid var(--primaria); font-size: 50px; color: #000; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .nome-user { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .email-user { color: var(--texto-suave); font-size: 14px; margin-bottom: 15px; }
        .badge { background: var(--borda); color: var(--primaria); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }

        /* CONFIGURAÇÕES */
        .card-config { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; }
        .card-config h3 { padding: 15px 20px; font-size: 14px; color: var(--primaria); border-bottom: 1px solid var(--borda); text-transform: uppercase; letter-spacing: 1px; }
        .opcao { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--borda); cursor: pointer; transition: background 0.2s; }
        .opcao:last-child { border-bottom: none; }
        .opcao:hover { background: rgba(255,255,255,0.05); }
        .icone-opcao { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 15px; color: white; }
        .icone-opcao.azul { background: #3b82f6; }
        .icone-opcao.vermelho { background: #ef4444; }
        .texto-opcao { flex: 1; text-align: left; }
        .texto-opcao h4 { font-size: 16px; margin-bottom: 3px; color: var(--texto); }
        .texto-opcao p { font-size: 12px; color: var(--texto-suave); }
        .seta { color: var(--primaria); font-size: 18px; }

        /* NAVEGAÇÃO INFERIOR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--fundo-card); border-top: 1px solid var(--borda); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--texto-suave); font-size: 12px; gap: 5px; transition: color 0.2s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primaria); }

        /* MODAL DE TROCA DE NOME */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: var(--fundo-card); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--borda); }
        .modal-content h3 { margin-bottom: 15px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); margin-bottom: 20px; font-size: 16px; outline: none; }
        .modal-botoes { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-cancelar { background: transparent; border: 1px solid var(--borda); color: var(--texto); }
        .btn-salvar { background: var(--primaria); color: #fff; }
        .btn-salvar:hover { background: var(--primaria-hover); }
    </style>
</head>
<body class="tema-amarelo"> <!-- Tema inicial padrão -->

    <!-- HEADER -->
    <header>
        <button class="btn-header" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i></button>
        <div class="logo-header">YUNA PERFIL</div>
        <button class="btn-header"><i class="fas fa-bars"></i></button>
    </header>

    <!-- SELETOR DE TEMAS -->
    <div class="seletor-temas" id="seletorTemas">
        <button class="cor-btn" data-tema="roxo" title="Roxo"></button>
        <button class="cor-btn" data-tema="branco" title="Branco"></button>
        <button class="cor-btn" data-tema="azul" title="Azul"></button>
        <button class="cor-btn" data-tema="amarelo" title="Amarelo"></button>
    </div>

    <!-- CONTEÚDO -->
    <div class="container">
        
        <!-- CARTÃO DO UTILIZADOR -->
        <div class="card-perfil">
            <div class="avatar">
                <i class="fas fa-compass"></i> <!-- Ícone provisório, podes colocar <img> se tiveres foto -->
            </div>
            <div class="nome-user" id="displayName">A carregar...</div>
            <div class="email-user" id="displayEmail">A carregar...</div>
            <div class="badge">Membro YUNA</div>
        </div>

        <!-- CONFIGURAÇÕES -->
        <div class="card-config">
            <h3>Configurações</h3>
            
            <div class="opcao" id="btnMudarNome">
                <div class="icone-opcao azul"><i class="fas fa-pen"></i></div>
                <div class="texto-opcao">
                    <h4>Mudar Nome</h4>
                    <p>Editar o teu nome de exibição</p>
                </div>
                <div class="seta"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="opcao" id="btnSair">
                <div class="icone-opcao vermelho"><i class="fas fa-sign-out-alt"></i></div>
                <div class="texto-opcao">
                    <h4>Sair da Conta</h4>
                    <p>Terminar sessão no dispositivo</p>
                </div>
                <div class="seta"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="musica.html" class="nav-item"><i class="fas fa-music"></i><span>Música</span></a>
        <a href="animes.html" class="nav-item"><i class="fas fa-mask"></i><span>Animes</span></a>
        <a href="educacao.html" class="nav-item"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
        <a href="perfil.html" class="nav-item active"><i class="fas fa-user"></i><span>Perfil</span></a>
    </nav>

    <!-- MODAL PARA MUDAR DE NOME -->
    <div class="modal" id="modalNome">
        <div class="modal-content">
            <h3>Mudar Nome</h3>
            <input type="text" id="inputNovoNome" placeholder="Digita o teu novo nome...">
            <div class="modal-botoes">
                <button class="btn-modal btn-cancelar" id="btnCancelarNome">Cancelar</button>
                <button class="btn-modal btn-salvar" id="btnSalvarNome">Guardar</button>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ SUBSTITUI PELA TUA CONFIGURAÇÃO DO FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "A_TUA_API_KEY",
            authDomain: "O_TEU_AUTH_DOMAIN",
            projectId: "O_TEU_PROJECT_ID",
            storageBucket: "O_TEU_STORAGE_BUCKET",
            messagingSenderId: "O_TEU_MESSAGING_SENDER_ID",
            appId: "O_TEU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Elementos do DOM
        const elNome = document.getElementById('displayName');
        const elEmail = document.getElementById('displayEmail');
        const modalNome = document.getElementById('modalNome');
        const inputNovoNome = document.getElementById('inputNovoNome');

        // 1. OUVIR O ESTADO DE AUTENTICAÇÃO (Resolve o problema de não carregar os dados)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Utilizador logado - atualiza os dados no ecrã
                elNome.innerText = user.displayName || "Sem Nome"; // Se não tiver nome, mostra "Sem Nome"
                elEmail.innerText = user.email;
            } else {
                // Utilizador não logado - manda para o login
                window.location.href = "login.html";
            }
        });

        // 2. LÓGICA DE MUDAR O NOME
        document.getElementById('btnMudarNome').addEventListener('click', () => {
            if(auth.currentUser) {
                inputNovoNome.value = auth.currentUser.displayName || ""; // Preenche com o nome atual
            }
            modalNome.style.display = 'flex';
        });

        document.getElementById('btnCancelarNome').addEventListener('click', () => {
            modalNome.style.display = 'none';
        });

        document.getElementById('btnSalvarNome').addEventListener('click', async () => {
            const novoNome = inputNovoNome.value.trim();
            const user = auth.currentUser;

            if (!novoNome) {
                alert("O nome não pode estar vazio!");
                return;
            }

            if (user) {
                try {
                    // Atualiza o nome no Firebase
                    await updateProfile(user, { displayName: novoNome });
                    
                    // Atualiza o ecrã imediatamente para o utilizador ver
                    elNome.innerText = novoNome;
                    
                    // Fecha o modal
                    modalNome.style.display = 'none';
                    alert("Nome atualizado com sucesso!");
                } catch (error) {
                    console.error("Erro ao atualizar nome:", error);
                    alert("Erro ao atualizar o nome. Tenta novamente.");
                }
            }
        });

        // 3. LÓGICA DE SAIR DA CONTA
        document.getElementById('btnSair').addEventListener('click', () => {
            if(confirm("Tens a certeza que queres sair?")) {
                signOut(auth).then(() => {
                    window.location.href = "login.html";
                }).catch((error) => {
                    console.error("Erro ao sair:", error);
                    alert("Erro ao terminar sessão.");
                });
            }
        });
    </script>

    <!-- Script do Sistema de Temas Global (JavaScript Normal) -->
    <script>
        (function() {
            const TEMAS = ['roxo', 'branco', 'azul', 'amarelo'];
            const temaGuardado = localStorage.getItem('yuna-tema') || 'amarelo'; // Padrão amarelo como na imagem

            function aplicarTema(tema) {
                TEMAS.forEach(t => document.body.classList.remove('tema-' + t));
                document.body.classList.add('tema-' + tema);
                localStorage.setItem('yuna-tema', tema);

                document.querySelectorAll('.cor-btn').forEach(btn => {
                    btn.classList.toggle('ativo', btn.dataset.tema === tema);
                });
            }

            // Aplicar imediatamente ao carregar
            aplicarTema(temaGuardado);

            // Event listeners
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.cor-btn').forEach(btn => {
                    btn.addEventListener('click', () => aplicarTema(btn.dataset.tema));
                });
            });
        })();
    </script>
</body>
</html>
