<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YUNA · Perfil</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* 🎨 SISTEMA DE TEMAS GLOBAL */
:root { --bg: #0a0e1a; --card-bg: rgba(18,24,42,.7); --text-main: #f1f5f9; --text-sub: #94a3b8; --accent: #f472b6; --accent-gradient: linear-gradient(135deg,#f472b6,#a78bfa); --nav-bg: rgba(10,14,26,.98); --border: rgba(255,255,255,.06); }
body.theme-branco { --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --accent: #8b5cf6; --accent-gradient: linear-gradient(135deg,#8b5cf6,#ec4899); --nav-bg: #ffffff; --border: rgba(0,0,0,.1); }
body.theme-azul { --bg: #0f172a; --card-bg: rgba(30,41,59,.8); --text-main: #f8fafc; --text-sub: #94a3b8; --accent: #38bdf8; --accent-gradient: linear-gradient(135deg,#38bdf8,#0ea5e9); --nav-bg: #0f172a; --border: rgba(56,189,248,.2); }
body.theme-amarelo { --bg: #000000; --card-bg: rgba(20,20,20,.9); --text-main: #fef08a; --text-sub: #ca8a04; --accent: #facc15; --accent-gradient: linear-gradient(135deg,#facc15,#eab308); --nav-bg: #000000; --border: rgba(250,204,21,.2); }

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition: background 0.3s, color 0.3s;}
body{background:var(--bg);color:var(--text-main);min-height:100vh;padding-bottom:80px}

.header{position:sticky;top:0;z-index:100;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.back-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text-main);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.logo-text{font-size:20px;font-weight:900;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.menu-btn{width:40px;height:40px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-main);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* PERFIL */
.container{padding:20px}
.perfil-card{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:30px 20px;text-align:center;margin-bottom:20px}
.foto-perfil{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid var(--border)}
.foto-perfil img{width:100%;height:100%;object-fit:cover}
.foto-perfil i{font-size:40px;color:#fff}
.nome-user{font-size:22px;font-weight:800;color:var(--text-main);margin-bottom:4px}
.email-user{font-size:14px;color:var(--text-sub);margin-bottom:16px}
.badge-user{background:rgba(167,139,250,.2);color:var(--accent);padding:6px 16px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}

/* CONFIGURAÇÕES */
.config-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.config-title{padding:16px;font-size:13px;font-weight:bold;color:var(--text-sub);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:1px}
.config-item{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none;color:var(--text-main)}
.config-item:last-child{border-bottom:none}
.config-item-left{display:flex;align-items:center;gap:14px}
.config-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.config-text h4{font-size:15px;font-weight:600;color:var(--text-main)}
.config-text p{font-size:12px;color:var(--text-sub)}

/* MENUS */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:997}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-sub);font-size:10px;text-decoration:none;flex:1}
.nav-item i{font-size:20px}
.nav-item.active{color:var(--accent)}

.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:998;opacity:0;pointer-events:none;transition:.3s}
.menu-overlay.aberto{opacity:1;pointer-events:auto}
.menu-lateral{position:fixed;top:0;left:0;bottom:0;width:290px;background:var(--bg);z-index:999;transform:translateX(-100%);transition:.35s;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.menu-lateral.aberto{transform:translateX(0)}
.menu-topo{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.menu-lista{flex:1;padding:16px 12px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text-main);text-decoration:none;font-size:15px;font-weight:600;cursor:pointer}
.menu-item i{width:24px;text-align:center;color:var(--text-sub)}
.temas-grid{display:flex;gap:12px;padding:10px 16px;justify-content:space-around}
.tema-btn{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.tema-btn.padrao{background:linear-gradient(135deg,#f472b6,#a78bfa)}
.tema-btn.branco{background:#fff;border-color:#cbd5e1}
.tema-btn.azul{background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
.tema-btn.amarelo{background:linear-gradient(135deg,#facc15,#eab308)}
.tema-btn.ativo{border-color:var(--text-main);transform:scale(1.1)}
</style>
</head>
<body class="theme-padrao">

<header class="header">
  <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
  <div class="logo-text">YUNA PERFIL</div>
  <button class="menu-btn" onclick="abrirMenu()"><i class="fas fa-bars"></i></button>
</header>

<div class="container">
  <!-- CARTÃO DE PERFIL -->
  <div class="perfil-card">
    <div class="foto-perfil" id="fotoPerfil">
      <i class="fas fa-user"></i>
    </div>
    <div class="nome-user" id="nomePerfil">Carregando...</div>
    <div class="email-user" id="emailPerfil">...</div>
    <div class="badge-user">Membro YUNA</div>
  </div>

  <!-- CONFIGURAÇÕES -->
  <div class="config-card">
    <div class="config-title">Configurações</div>
    
    <a href="#" class="config-item">
      <div class="config-item-left">
        <div class="config-icon" style="background:#38bdf8"><i class="fas fa-pen"></i></div>
        <div class="config-text">
          <h4>Mudar Nome</h4>
          <p>Editar o teu nome de exibição</p>
        </div>
      </div>
      <i class="fas fa-chevron-right" style="color:var(--text-sub)"></i>
    </a>

    <a href="#" class="config-item" onclick="sairConta(event)">
      <div class="config-item-left">
        <div class="config-icon" style="background:#ef4444"><i class="fas fa-sign-out-alt"></i></div>
        <div class="config-text">
          <h4>Sair da Conta</h4>
          <p>Terminar sessão no dispositivo</p>
        </div>
      </div>
      <i class="fas fa-chevron-right" style="color:var(--text-sub)"></i>
    </a>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="home.html"><i class="fas fa-home"></i><span>Início</span></a>
  <a class="nav-item" href="musica.html"><i class="fas fa-music"></i><span>Música</span></a>
  <a class="nav-item" href="animes.html"><i class="fas fa-dragon"></i><span>Animes</span></a>
  <a class="nav-item" href="educacao.html"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
  <a class="nav-item active" href="perfil.html"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<aside class="menu-lateral" id="menuLateral">
  <div class="menu-topo"><div class="logo-text">YUNA</div><button class="menu-btn" onclick="fecharMenu()"><i class="fas fa-times"></i></button></div>
  <div style="padding:10px 16px 0;font-size:12px;color:var(--text-sub);font-weight:bold">COR DO APP:</div>
  <div class="temas-grid">
    <div class="tema-btn padrao ativo" onclick="mudarTemaGlobal('padrao', this)"></div>
    <div class="tema-btn branco" onclick="mudarTemaGlobal('branco', this)"></div>
    <div class="tema-btn azul" onclick="mudarTemaGlobal('azul', this)"></div>
    <div class="tema-btn amarelo" onclick="mudarTemaGlobal('amarelo', this)"></div>
  </div>
  <nav class="menu-lista">
    <a class="menu-item" href="home.html"><i class="fas fa-home"></i> Início</a>
    <a class="menu-item" href="musica.html"><i class="fas fa-music"></i> Música</a>
    <a class="menu-item" href="educacao.html"><i class="fas fa-book"></i> Livros</a>
    <a class="menu-item" href="perfil.html"><i class="fas fa-user"></i> Perfil</a>
  </nav>
</aside>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
    authDomain: "yuna-8fe24.firebaseapp.com",
    projectId: "yuna-8fe24",
    storageBucket: "yuna-8fe24.firebasestorage.app",
    messagingSenderId: "531340097112",
    appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('nomePerfil').textContent = user.displayName || 'Utilizador YUNA';
      document.getElementById('emailPerfil').textContent = user.email;
      
      if (user.photoURL) {
        document.getElementById('fotoPerfil').innerHTML = `<img src="${user.photoURL}">`;
      }
    } else {
      window.location.replace('login.html');
    }
  });

  window.sairConta = (e) => {
    e.preventDefault();
    if(confirm('Tens a certeza que queres sair?')) {
      signOut(auth).then(() => {
        window.location.replace('login.html');
      });
    }
  };
</script>

<script>
// ================= SISTEMA DE TEMAS GLOBAL =================
(function() {
  const temaSalvo = localStorage.getItem('yuna_theme') || 'padrao';
  document.body.className = 'theme-' + temaSalvo;
})();

function mudarTemaGlobal(tema, el) { 
  document.body.className = 'theme-' + tema; 
  localStorage.setItem('yuna_theme', tema); 
  document.querySelectorAll('.tema-btn').forEach(b => b.classList.remove('ativo')); 
  el.classList.add('ativo'); 
}

setTimeout(() => {
  const temaSalvo = localStorage.getItem('yuna_theme') || 'padrao';
  document.querySelectorAll('.tema-btn').forEach(b => {
    if(b.classList.contains(temaSalvo)) b.classList.add('ativo');
  });
}, 100);

function abrirMenu(){document.getElementById('menuLateral').classList.add('aberto');document.getElementById('menuOverlay').classList.add('aberto')}
function fecharMenu(){document.getElementById('menuLateral').classList.remove('aberto');document.getElementById('menuOverlay').classList.remove('aberto')}
</script>
</body>
</html>
