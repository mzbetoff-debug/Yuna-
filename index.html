<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="google-site-verification" content="gnqohyB-zOT5bPS_ilfULPk0wE5e5gEid8A7EKLOxoA" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YUNA · Plataforma Multimídia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo i {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .logo span {
      font-size: 0.8rem;
      color: #94a3b8;
      display: block;
      -webkit-text-fill-color: #94a3b8;
      letter-spacing: 1px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .nav-menu a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-menu a:hover, .nav-menu a.active {
      background: rgba(167, 139, 250, 0.1);
      color: #c4b5fd;
    }

    .nav-menu a i {
      font-size: 0.9rem;
    }

    .dropdown-container {
      position: relative;
      display: inline-block;
    }

    .dropdown-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    .dropdown-btn:hover {
      background: rgba(167, 139, 250, 0.1);
      border-color: rgba(167, 139, 250, 0.3);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      background: rgba(18, 24, 42, 0.95);
      backdrop-filter: blur(20px);
      min-width: 220px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      padding: 0.5rem 0;
      z-index: 1000;
    }

    .dropdown-content.show {
      display: block;
    }

    .dropdown-content a {
      color: #e2e8f0;
      padding: 0.7rem 1.5rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .dropdown-content a:hover {
      background: rgba(167, 139, 250, 0.08);
      color: #c4b5fd;
    }

    .dropdown-content a i {
      width: 20px;
      color: #94a3b8;
    }

    .dropdown-content .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 0.3rem 0;
    }

    .auth-buttons {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .btn-login {
      background: transparent;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #64748b;
    }

    .btn-signup {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .btn-signup:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      background: rgba(18, 24, 42, 0.5);
      border-radius: 16px;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .tab-btn {
      padding: 0.8rem 1.8rem;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: center;
    }

    .tab-btn:hover {
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(139, 92, 246, 0.2));
      color: #c4b5fd;
      border: 1px solid rgba(167, 139, 250, 0.2);
    }

    .tab-btn i {
      font-size: 1rem;
    }

    /* ===== CONTEÚDO DAS TABS ===== */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===== GRID PRINCIPAL ===== */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 1.8rem;
      }
      .nav-menu a {
        font-size: 0.8rem;
        padding: 0.3rem 0.7rem;
      }
      .header {
        justify-content: center;
      }
      .tab-btn {
        font-size: 0.8rem;
        padding: 0.6rem 1rem;
      }
    }

    /* ===== CARDS ===== */
    .upload-card {
      background: rgba(18, 24, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 2rem 2rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .upload-card h2 {
      color: #f1f5f9;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upload-card h2 i {
      color: #a78bfa;
    }

    .upload-card .sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
      padding-left: 1rem;
      border-left: 3px solid #a78bfa;
    }

    .drop-zone {
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed #334155;
      border-radius: 20px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .drop-zone:hover {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.05);
    }

    .drop-zone i {
      font-size: 3.5rem;
      color: #64748b;
      margin-bottom: 0.8rem;
      transition: 0.3s;
    }

    .drop-zone:hover i {
      color: #a78bfa;
      transform: scale(1.05);
    }

    .drop-zone p {
      color: #cbd5e1;
      font-size: 1rem;
    }

    .drop-zone .small {
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    #file-input {
      display: none;
    }

    .action-buttons {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.6);
      color: #e2e8f0;
      border: 1px solid #475569;
    }

    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.7);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .status-box {
      background: #0f172a;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-top: 1.2rem;
      border-left: 4px solid #475569;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: 0.9rem;
      min-height: 3.5rem;
    }

    .status-box i {
      font-size: 1.2rem;
      color: #64748b;
    }

    #previewImg {
      margin-top: 0.8rem;
      max-width: 100%;
      max-height: 150px;
      border-radius: 16px;
      display: none;
      border: 1px solid #334155;
    }

    /* ===== RESULTADO ===== */
    .result-card {
      background: rgba(18, 24, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 2rem 2rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .result-card h3 {
      color: #f1f5f9;
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .result-card h3 i {
      color: #f472b6;
    }

    .item-info {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      padding: 1.2rem 1.5rem;
      border: 1px solid #293241;
      margin-bottom: 1.5rem;
    }

    .item-info .title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.3rem;
    }

    .item-info .details {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      color: #94a3b8;
      font-size: 0.85rem;
      margin: 0.4rem 0 0.6rem;
    }

    .item-info .details i {
      margin-right: 4px;
      color: #64748b;
    }

    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      background: #1e293b;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .music-section {
      border-top: 1px solid #293241;
      padding-top: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .music-section h4 {
      color: #e2e8f0;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.6rem;
    }

    .music-section h4 i {
      color: #f472b6;
    }

    .music-item {
      background: #0f172a;
      border-radius: 14px;
      padding: 0.7rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #8b5cf6;
    }

    .music-item .name {
      color: #e2e8f0;
      font-weight: 450;
    }

    .music-item .artist {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .recommend-section h4 {
      color: #e2e8f0;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.6rem;
    }

    .recommend-section h4 i {
      color: #a78bfa;
    }

    .rec-item {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      margin: 0.4rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2d3748;
    }

    .rec-item .rec-title {
      color: #e2e8f0;
      font-weight: 450;
    }

    .rec-item .rec-score {
      background: #2d3748;
      padding: 0.15rem 0.8rem;
      border-radius: 40px;
      font-size: 0.75rem;
      color: #a78bfa;
      font-weight: 600;
    }

    .footer {
      margin-top: 2.5rem;
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
      border-top: 1px solid #1e293b;
      padding-top: 1.8rem;
    }

    .footer i {
      color: #ec4899;
      margin: 0 4px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading {
      animation: pulse 1.2s ease-in-out infinite;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: rgba(22, 28, 46, 0.95);
      border-radius: 32px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from { transform: scale(0.9) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .modal-header h2 {
      color: #f1f5f9;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      transition: 0.3s;
    }

    .modal-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .modal-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 0.9rem 1.2rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      transition: 0.3s;
      width: 100%;
    }

    .modal-input:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(0, 0, 0, 0.4);
    }

    .modal-input::placeholder {
      color: #64748b;
    }

    .modal-btn-primary {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none;
      color: white;
      padding: 0.9rem;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .modal-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }

    .social-login {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }

    .social-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 0.8rem;
      color: #e2e8f0;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #475569;
    }

    .social-btn.google i { color: #ea4335; font-size: 1.2rem; }
    .social-btn.facebook i { color: #1877f2; font-size: 1.2rem; }
    .social-btn.github i { color: #f1f5f9; font-size: 1.2rem; }

    .modal-footer {
      margin-top: 1rem;
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .modal-footer a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
    }

    .modal-footer a:hover {
      text-decoration: underline;
    }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #64748b;
      font-size: 0.85rem;
      margin: 0.3rem 0;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #293241;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="logo">
      <i class="fas fa-compass"></i>
      <div>
        <h1>YUNA</h1>
        <span>Reconhecimento · Música · Séries · Filmes</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a href="#" class="active"><i class="fas fa-home"></i> Início</a>
      <a href="#"><i class="fas fa-film"></i> Filmes</a>
      <a href="#"><i class="fas fa-tv"></i> Séries</a>
      <a href="#"><i class="fas fa-music"></i> Música</a>
      
      <div class="dropdown-container">
        <button class="dropdown-btn" id="dropdownBtn">
          <i class="fas fa-ellipsis-h"></i>
        </button>
        <div class="dropdown-content" id="dropdownContent">
          <a href="#"><i class="fas fa-user"></i> Meu Perfil</a>
          <a href="#"><i class="fas fa-history"></i> Histórico</a>
          <a href="#"><i class="fas fa-heart"></i> Favoritos</a>
          <a href="#"><i class="fas fa-cog"></i> Configurações</a>
          <div class="divider"></div>
          <a href="#"><i class="fas fa-question-circle"></i> Ajuda</a>
          <a href="#"><i class="fas fa-info-circle"></i> Sobre</a>
          <div class="divider"></div>
          <a href="#" id="logoutBtn" style="color: #f87171;"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
      </div>
    </nav>

    <div class="auth-buttons">
      <button class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
      <button class="btn-signup" id="signupBtn"><i class="fas fa-user-plus"></i> Criar Conta</button>
    </div>
  </header>

  <!-- ===== TABS ===== -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="anime"><i class="fas fa-japan"></i> Anime</button>
    <button class="tab-btn" data-tab="filmes"><i class="fas fa-film"></i> Filmes</button>
    <button class="tab-btn" data-tab="series"><i class="fas fa-tv"></i> Séries</button>
    <button class="tab-btn" data-tab="musica"><i class="fas fa-music"></i> Música</button>
    <button class="tab-btn" data-tab="recomendacoes"><i class="fas fa-star"></i> Recomendações</button>
  </div>

  <!-- ===== TAB: ANIME ===== -->
  <div class="tab-content active" id="tab-anime">
    <div class="main-grid">
      <div class="upload-card">
        <h2><i class="fas fa-upload"></i> Reconhecer Anime</h2>
        <div class="sub">Envie uma imagem ou capa de anime</div>
        <div class="drop-zone" id="dropZoneAnime">
          <i class="fas fa-image"></i>
          <p><strong>Clique aqui</strong> ou arraste uma imagem</p>
          <div class="small">PNG, JPG, WebP • até 5MB</div>
        </div>
        <input type="file" id="file-input-anime" accept="image/*" />
        <div class="action-buttons">
          <button class="btn btn-primary" id="recognizeAnimeBtn"><i class="fas fa-robot"></i> Reconhecer</button>
          <button class="btn btn-secondary" id="resetAnimeBtn"><i class="fas fa-undo-alt"></i> Limpar</button>
        </div>
        <div class="status-box" id="statusBoxAnime">
          <i class="fas fa-circle-info"></i>
          <span id="statusTextAnime">Pronto para reconhecer</span>
        </div>
        <img id="previewImgAnime" src="#" alt="Prévia" style="margin-top:0.8rem; max-width:100%; max-height:150px; border-radius:16px; display:none; border:1px solid #334155;" />
