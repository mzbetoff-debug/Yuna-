<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YUNA · Música</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="/Yuna-/manifest.json">
<style>
/* =========================================
   1. SISTEMA DE TEMAS (Baseado no teu código)
   ========================================= */
:root {
  --primary: #f472b6;
  --secondary: #a78bfa;
  --bg: #0a0e1a;
  --card: rgba(18,24,42,0.6);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: rgba(255,255,255,0.1);
}
.theme-padrao { --primary: #f472b6; --secondary: #a78bfa; }
.theme-azul { --primary: #38bdf8; --secondary: #2dd4bf; }
.theme-amarelo { --primary: #facc15; --secondary: #f97316; }
.theme-branco { --primary: #cbd5e1; --secondary: #94a3b8; }

* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); padding-bottom: 160px; transition: background 0.3s; overflow-x: hidden; }

/* HEADER E PESQUISA */
.header { position: sticky; top: 0; z-index: 100; background: rgba(10,14,26,0.9); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 22px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--card); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.search-box { padding: 20px; display: flex; gap: 10px; }
.search-box input { flex: 1; padding: 14px 20px; border-radius: 15px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; outline: none; }
.search-box button { width: 50px; border-radius: 15px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 18px; cursor: pointer; }

/* LISTA DE MÚSICAS */
.musica-card { display: flex; align-items: center; gap: 15px; padding: 12px 20px; margin-bottom: 8px; border-radius: 16px; transition: 0.2s; cursor: pointer; }
.musica-card:active { background: var(--card); transform: scale(0.98); }
.musica-capa { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
.musica-info { flex: 1; min-width: 0; }
.musica-info h4 { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.musica-info p { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.musica-acoes { display: flex; align-items: center; gap: 10px; }
.btn-like { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; transition: 0.2s; padding: 5px; }
.btn-like.liked { color: #ef4444; animation: pop 0.3s; }
@keyframes pop { 50% { transform: scale(1.3); } }
.btn-play-musica { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* =========================================
   2. MINI-PLAYER (A PÍLULA FLUTUANTE)
   ========================================= */
.mini-player { 
  position: fixed; bottom: 85px; left: 15px; right: 15px; 
  background: rgba(255, 255, 255, 0.15); /* Cor transparente igual à imagem */
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 40px; 
  padding: 8px 15px 8px 8px; display: none; align-items: center; gap: 15px; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 9999; 
  transform: translateY(100px); transition: transform 0.3s ease;
}
.mini-player.active { display: flex; transform: translateY(0); }
.mini-player img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.5); }
.mini-info { flex: 1; min-width: 0; }
.mini-info h4 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.mini-info p { font-size: 13px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-controls { display: flex; gap: 15px; align-items: center; padding-right: 5px; }
.mini-controls button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
.mini-controls .btn-close { font-size: 18px; color: rgba(255,255,255,0.6); }

/* =========================================
   3. ECRÃ INTEIRO DO PLAYER (2ª IMAGEM)
   ========================================= */
.full-player { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; padding: 30px 24px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.full-player.active { transform: translateY(0); }
.fp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.fp-header-btn { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
.fp-art { width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto 30px auto; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.fp-art img { width: 100%; height: 100%; object-fit: cover; }
.fp-info { text-align: left; margin-bottom: 30px; width: 100%; max-width: 320px; margin: 0 auto 30px auto; }
.fp-info h2 { font-size: 24px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-info p { font-size: 16px; color: var(--text-muted); }
.fp-progress { width: 100%; max-width: 320px; margin: 0 auto 20px auto; }
.fp-time { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
input[type=range].fp-range { -webkit-appearance: none; width: 100%; background: transparent; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); outline: none; }
input[type=range].fp-range::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -4px; }
.fp-controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 40px; }
.fp-controls button { background: none; border: none; color: var(--text); font-size: 28px; cursor: pointer; }
.fp-play-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; }

/* NAV */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,14,26,0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--border); padding: 10px 0 calc(10px + env(safe-area-inset-bottom,0px)); display: flex; justify-content: space-around; z-index: 9998; }
.nav { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10px; text-decoration: none; flex: 1; }
.nav i { font-size: 18px; }
.nav.active { color: var(--primary); }
.nav.active i { color: var(--primary); }
.audio-player { display: none; }
</style>
</head>
<body>

<header class="header">
  <h1>YUNA MÚSICA</h1>
  <div class="user-avatar" id="userAvatar"><i class="fas fa-user"></i></div>
</header>

<div class="search-box">
  <input type="text" id="inputPesquisaMusica" placeholder="Pesquisar música ou artista..." onkeypress="if(event.key==='Enter') pesquisarMusica()">
  <button onclick="pesquisarMusica()"><i class="fas fa-search"></i></button>
</div>

<div style="padding: 0 20px 10px 20px;">
  <h3 id="tituloPlaylist" style="font-size: 18px;"><i class="fas fa-fire" style="color: var(--primary);"></i> Tendências na YUNA</h3>
</div>

<div id="listaMusicas"></div>

<!-- MINI-PLAYER (A PÍLULA) -->
<div class="mini-player" id="miniPlayer" onclick="abrirEcraInteiro(event)">
  <img id="miniCapa" src="" alt="">
  <div class="mini-info">
    <h4 id="miniTitulo">Música</h4>
    <p id="miniArtista">Artista</p>
  </div>
  <div class="mini-controls" onclick="event.stopPropagation()">
    <button onclick="togglePlay()"><i class="fas fa-pause" id="miniIconePlay"></i></button>
    <button class="btn-close" onclick="fecharPlayer()"><i class="fas fa-times"></i></button>
  </div>
</div>

<!-- ECRÃ INTEIRO DO PLAYER -->
<div class="full-player" id="fullPlayer">
  <div class="fp-header">
    <button class="fp-header-btn" onclick="fecharEcraInteiro()"><i class="fas fa-chevron-down"></i></button>
    <button class="fp-header-btn"><i class="fas fa-ellipsis-v"></i></button>
  </div>
  
  <div class="fp-art"><img id="fpCapa" src="" alt=""></div>
  
  <div class="fp-info">
    <h2 id="fpTitulo">Música</h2>
    <p id="fpArtista">Artista</p>
  </div>

  <div class="fp-progress">
    <div class="fp-time"><span id="fpAtual">0:00</span><span id="fpTotal">0:00</span></div>
    <input type="range" class="fp-range" id="fpRange" value="0" min="0" max="100" step="0.1" oninput="mudarProgresso(this.value)">
  </div>

  <div class="fp-controls">
    <button><i class="fas fa-random"></i></button>
    <button><i class="fas fa-step-backward"></i></button>
    <button class="fp-play-btn" onclick="togglePlay()"><i class="fas fa-pause" id="fpIconePlay"></i></button>
    <button><i class="fas fa-step-forward"></i></button>
    <button><i class="fas fa-redo"></i></button>
  </div>
</div>

<audio id="audioPlayer" class="audio-player"></audio>

<nav class="bottom-nav">
  <a class="nav" href="home.html"><i class="fas fa-home"></i><span>Início</span></a>
  <a class="nav" href="animes.html"><i class="fas fa-dragon"></i><span>Animes</span></a>
  <a class="nav active" href="musica.html"><i class="fas fa-music"></i><span>Música</span></a>
  <a class="nav" href="educacao.html"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
  <a class="nav" href="perfil.html"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
// 1. SISTEMA DE CORES E FIREBASE
(function() {
  const temaSalvo = localStorage.getItem('yuna_theme') || 'padrao';
  document.body.className = 'theme-' + temaSalvo;
})();

const firebaseConfig = {
    apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
    authDomain: "yuna-8fe24.firebaseapp.com",
    projectId: "yuna-8fe24",
    storageBucket: "yuna-8fe24.firebasestorage.app",
    messagingSenderId: "531340097112",
    appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
auth.onAuthStateChanged((user) => {
    if (user) {
        const foto = user.photoURL || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
        document.getElementById('userAvatar').innerHTML = `<img src="${foto}">`;
    }
});

// 2. LÓGICA DO PLAYER E RANKING
const audio = document.getElementById('audioPlayer');
const miniPlayer = document.getElementById('miniPlayer');
const fullPlayer = document.getElementById('fullPlayer');
let aTocar = false;
let musicaAtual = null;
let curtidas = JSON.parse(localStorage.getItem('yuna_musicas_curtidas')) || [];
let ranking = JSON.parse(localStorage.getItem('yuna_ranking_musicas')) || {}; 
// Ranking guarda: { "id_musica": numero_de_vezes_ouvida }

// Iniciar
window.addEventListener('DOMContentLoaded', () => {
    const estadoGuardado = localStorage.getItem('yuna_musica_estado');
    if (estadoGuardado) {
        const estado = JSON.parse(estadoGuardado);
        if (estado.url) {
            audio.src = estado.url;
            audio.currentTime = estado.tempo || 0;
            document.getElementById('miniCapa').src = estado.capa;
            document.getElementById('fpCapa').src = estado.capa;
            document.getElementById('miniTitulo').innerText = estado.titulo;
            document.getElementById('fpTitulo').innerText = estado.titulo;
            document.getElementById('miniArtista').innerText = estado.artista;
            document.getElementById('fpArtista').innerText = estado.artista;
            miniPlayer.classList.add('active');
            musicaAtual = estado;
            
            if (estado.aTocar) {
                audio.play().then(() => {
                    aTocar = true;
                    document.getElementById('miniIconePlay').className = 'fas fa-pause';
                    document.getElementById('fpIconePlay').className = 'fas fa-pause';
                }).catch(() => {
                    aTocar = false;
                });
            }
        }
    }
    carregarMusicasAudius();
});

window.addEventListener('beforeunload', guardarEstado);

async function carregarMusicasAudius() {
    const lista = document.getElementById('listaMusicas');
    lista.innerHTML = '<p style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> A ligar...</p>';
    try {
        const res = await fetch('https://api.audius.co/v1/tracks/trending?app_name=YUNA&limit=20');
        const data = await res.json();
        if (data.data) renderizarLista(data.data);
    } catch(e) { lista.innerHTML = 'Erro ao carregar.'; }
}

async function pesquisarMusica() {
    const termo = document.getElementById('inputPesquisaMusica').value.trim();
    if (!termo) return carregarMusicasAudius();
    const lista = document.getElementById('listaMusicas');
    document.getElementById('tituloPlaylist').innerHTML = `<i class="fas fa-search"></i> Resultados: ${termo}`;
    lista.innerHTML = '<p style="text-align:center; padding:20px;">A procurar...</p>';
    try {
        const res = await fetch(`https://api.audius.co/v1/tracks/search?query=${encodeURIComponent(termo)}&app_name=YUNA&limit=20`);
        const data = await res.json();
        if (data.data) renderizarLista(data.data);
    } catch(e) { lista.innerHTML = 'Erro na pesquisa.'; }
}

function renderizarLista(musicas) {
    const lista = document.getElementById('listaMusicas');
    lista.innerHTML = '';
    
    // ORDENAR PELO RANKING (Mais ouvidas primeiro)
    musicas.sort((a, b) => {
        const playsA = ranking[a.id] || 0;
        const playsB = ranking[b.id] || 0;
        return playsB - playsA;
    });

    musicas.forEach(musica => {
        const capa = musica.artwork ? musica.artwork['480x480'] : '';
        const isLiked = curtidas.includes(musica.id);
        const plays = ranking[musica.id] || 0;
        
        lista.innerHTML += `
            <div class="musica-card">
                <img src="${capa}" class="musica-capa" onclick="tocarMusica('${musica.id}', '${musica.title.replace(/'/g, "\\'")}', '${musica.user.name.replace(/'/g, "\\'")}', '${capa}', 'https://api.audius.co/v1/tracks/${musica.id}/stream?app_name=YUNA')">
                <div class="musica-info" onclick="tocarMusica('${musica.id}', '${musica.title.replace(/'/g, "\\'")}', '${musica.user.name.replace(/'/g, "\\'")}', '${capa}', 'https://api.audius.co/v1/tracks/${musica.id}/stream?app_name=YUNA')">
                    <h4>${musica.title}</h4>
                    <p>${musica.user.name} ${plays > 0 ? `• ${plays} plays` : ''}</p>
                </div>
                <div class="musica-acoes">
                    <button class="btn-like ${isLiked ? 'liked' : ''}" onclick="toggleLike('${musica.id}', this)">
                        <i class="fas fa-heart"></i>
                    </button>
                    <button class="btn-play-musica" onclick="tocarMusica('${musica.id}', '${musica.title.replace(/'/g, "\\'")}', '${musica.user.name.replace(/'/g, "\\'")}', '${capa}', 'https://api.audius.co/v1/tracks/${musica.id}/stream?app_name=YUNA')">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
        `;
    });
}

function toggleLike(id, btn) {
    if (curtidas.includes(id)) {
        curtidas = curtidas.filter(x => x !== id);
        btn.classList.remove('liked');
    } else {
        curtidas.push(id);
        btn.classList.add('liked');
    }
    localStorage.setItem('yuna_musicas_curtidas', JSON.stringify(curtidas));
}

function tocarMusica(id, titulo, artista, capa, url) {
    musicaAtual = { id, titulo, artista, capa, url };
    audio.src = url;
    audio.play().then(() => {
        aTocar = true;
        document.getElementById('miniIconePlay').className = 'fas fa-pause';
        document.getElementById('fpIconePlay').className = 'fas fa-pause';
    });
    
    // ATUALIZAR RANKING
    ranking[id] = (ranking[id] || 0) + 1;
    localStorage.setItem('yuna_ranking_musicas', JSON.stringify(ranking));

    miniPlayer.classList.add('active');
    document.getElementById('miniCapa').src = capa;
    document.getElementById('miniTitulo').innerText = titulo;
    document.getElementById('miniArtista').innerText = artista;
    
    document.getElementById('fpCapa').src = capa;
    document.getElementById('fpTitulo').innerText = titulo;
    document.getElementById('fpArtista').innerText = artista;
    
    guardarEstado();
    // Recarrega a lista para atualizar o número de plays (se estiver na tela)
    if(document.getElementById('inputPesquisaMusica').value === '') carregarMusicasAudius();
}

function togglePlay() {
    if (!audio.src) return;
    if (aTocar) {
        audio.pause(); aTocar = false;
        document.getElementById('miniIconePlay').className = 'fas fa-play';
        document.getElementById('fpIconePlay').className = 'fas fa-play';
    } else {
        audio.play().then(() => {
            aTocar = true;
            document.getElementById('miniIconePlay').className = 'fas fa-pause';
            document.getElementById('fpIconePlay').className = 'fas fa-pause';
        });
    }
    guardarEstado();
}

function abrirEcraInteiro(e) {
    if(e) e.stopPropagation();
    fullPlayer.classList.add('active');
}
function fecharEcraInteiro() { fullPlayer.classList.remove('active'); }
function fecharPlayer() {
    audio.pause(); audio.src = ''; aTocar = false;
    miniPlayer.classList.remove('active'); fullPlayer.classList.remove('active');
    musicaAtual = null; localStorage.removeItem('yuna_musica_estado');
}

function formatarTempo(s) { if(!s) return "0:00"; const m=Math.floor(s/60); const sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
        document.getElementById('fpAtual').textContent = formatarTempo(audio.currentTime);
        document.getElementById('fpRange').value = (audio.currentTime / audio.duration) * 100;
    }
});
audio.addEventListener('loadedmetadata', () => { document.getElementById('fpTotal').textContent = formatarTempo(audio.duration); });
audio.addEventListener('ended', () => { aTocar = false; document.getElementById('miniIconePlay').className = 'fas fa-play'; document.getElementById('fpIconePlay').className = 'fas fa-play'; });
function mudarProgresso(val) { if (audio.duration) audio.currentTime = (val / 100) * audio.duration; }

function guardarEstado() {
    if (musicaAtual && audio.src) {
        localStorage.setItem('yuna_musica_estado', JSON.stringify({
            id: musicaAtual.id, url: audio.src, tempo: audio.currentTime, capa: musicaAtual.capa,
            titulo: musicaAtual.titulo, artista: musicaAtual.artista, aTocar: aTocar
        }));
    }
}
setInterval(() => { if (aTocar) guardarEstado(); }, 2000);
</script>
</body>
</html>
