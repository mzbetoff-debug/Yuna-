<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUNA · Música</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
html,body {background:#0a0e1a;color:#e2e8f0;min-height:100vh;overflow-x:hidden;}
body {padding-bottom:90px;}

.header {position:sticky;top:0;z-index:100;background:rgba(10,14,26,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);padding:12px 16px;}
.header-top {display:flex;justify-content:space-between;align-items:center;}
.back {background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#f1f5f9;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
.logo {display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;}
.logo-img {width:32px;height:32px;border-radius:50%;object-fit:cover;}
.logo h1 {font-size:22px;font-weight:800;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.hero {padding:24px 20px;margin:16px;border-radius:24px;background:linear-gradient(135deg,rgba(236,72,153,.2),rgba(167,139,250,.15));border:1px solid rgba(236,72,153,.25);position:relative;overflow:hidden;}
.hero h2 {font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:8px;}
.hero p {font-size:13px;color:#cbd5e1;}
.hero i.sh {position:absolute;right:-10px;bottom:-10px;font-size:100px;opacity:.1;color:#ec4899;}

.busca {position:relative;padding:0 16px;margin-bottom:20px;}
.busca input {width:100%;padding:14px 16px 14px 44px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#e2e8f0;font-size:14px;outline:none;}
.busca input:focus {border-color:#f472b6;}
.busca i {position:absolute;left:30px;top:50%;transform:translateY(-50%);color:#64748b;}

.section {padding:0 16px;margin-bottom:20px;}
.section-title {font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title i {color:#f472b6;}

.track {display:flex;gap:12px;background:rgba(18,24,42,.7);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px;margin-bottom:10px;align-items:center;transition:.2s;}
.track:active {transform:scale(.98);}
.track img {width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#1a1f2e;}
.track-info {flex:1;min-width:0;}
.track-info h4 {font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.track-info p {font-size:12px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.track-acoes {display:flex;gap:6px;flex-shrink:0;}
.btn-track {width:38px;height:38px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;text-decoration:none;background:none;}
.btn-play {background:rgba(167,139,250,.2);color:#a78bfa;}
.btn-down {background:rgba(236,72,153,.2);color:#f472b6;}
.btn-down:disabled {opacity:.3;cursor:not-allowed;}

.loading, .vazio {text-align:center;padding:40px 20px;color:#64748b;font-size:13px;}
.loading i, .vazio i {font-size:32px;display:block;margin-bottom:12px;color:#a78bfa;}

/* PLAYER FIXO */
.player-fixo {position:fixed;bottom:70px;left:12px;right:12px;background:linear-gradient(135deg,#1a1f2e,#0f1420);border:1px solid rgba(236,72,153,.3);border-radius:16px;padding:10px;display:none;gap:10px;align-items:center;z-index:999;box-shadow:0 10px 40px rgba(0,0,0,.7);}
.player-fixo img {width:44px;height:44px;border-radius:10px;object-fit:cover;}
.player-fixo .info {flex:1;min-width:0;}
.player-fixo .info h4 {font-size:13px;font-weight:700;color:#f1f5f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-fixo .info p {font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-fixo .controles {display:flex;gap:6px;}
.player-fixo button {width:36px;height:36px;border-radius:10px;border:none;background:rgba(236,72,153,.2);color:#f472b6;font-size:14px;cursor:pointer;}
.audio-player {display:none;}

.bottom-nav {position:fixed;bottom:0;left:0;right:0;background:#0a0e1a;border-top:1px solid rgba(255,255,255,.06);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:9999;}
.nav {display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;color:#64748b;font-size:10px;text-decoration:none;flex:1;}
.nav i {font-size:18px;}
.nav.active {color:#f472b6;}
.nav.active i {color:#f472b6;}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="back" href="home.html"><i class="fas fa-arrow-left"></i></a>
    <a class="logo" href="home.html">
      <img src="favicon.png" alt="YUNA" class="logo-img" onerror="this.style.display='none'">
      <h1>YUNA</h1>
    </a>
    <div style="width:40px"></div>
  </div>
</header>

<div class="hero">
  <i class="fas fa-music sh"></i>
  <h2>🎵 Música</h2>
  <p>Busque, ouça e baixe suas músicas favoritas.</p>
</div>

<div class="busca">
  <i class="fas fa-search"></i>
  <input type="text" id="buscaInput" placeholder="Buscar música, artista ou gênero..." onkeypress="if(event.key==='Enter') buscar()">
</div>

<div class="section">
  <div class="section-title"><i class="fas fa-fire"></i> <span id="tituloLista">Em alta</span></div>
  <div id="listaTracks">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i>Carregando músicas...</div>
  </div>
</div>

<!-- PLAYER FIXO -->
<div class="player-fixo" id="playerFixo">
  <img id="playerImg" src="" alt="">
  <div class="info">
    <h4 id="playerTitulo">Música</h4>
    <p id="playerArtista">Artista</p>
  </div>
  <div class="controles">
    <button onclick="togglePlay()"><i class="fas fa-pause" id="iconePlay"></i></button>
    <button onclick="fecharPlayer()"><i class="fas fa-times"></i></button>
  </div>
</div>

<audio id="audioPlayer" class="audio-player"></audio>

<nav class="bottom-nav">
  <a class="nav" href="home.html"><i class="fas fa-home"></i><span>Início</span></a>
  <a class="nav" href="animes.html"><i class="fas fa-dragon"></i><span>Animes</span></a>
  <a class="nav active" href="musica.html"><i class="fas fa-music"></i><span>Música</span></a>
  <a class="nav" href="educacao.html"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
  <a class="nav" href="perfil.html"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<script>
const API_KEY = '0x815cff235d2d8b3338d412653da2b8497b4913e8';
const APP_NAME = 'YUNA';
const BASE = 'https://api.audius.co/v1';

let tracksAtuais = [];
let audioAtual = null;

// CARREGAR MÚSICAS EM ALTA
async function carregarEmAlta() {
  try {
    const r = await fetch(`${BASE}/tracks/trending?app_name=${APP_NAME}&limit=20`);
    const d = await r.json();
    renderizar(d.data || []);
  } catch(e) {
    document.getElementById('listaTracks').innerHTML = '<div class="vazio">Erro ao carregar. Tente de novo.</div>';
  }
}

// BUSCAR
async function buscar() {
  const q = document.getElementById('buscaInput').value.trim();
  if (!q) { carregarEmAlta(); return; }
  document.getElementById('tituloLista').textContent = `Resultados: "${q}"`;
  document.getElementById('listaTracks').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i>Buscando...</div>';
  try {
    const r = await fetch(`${BASE}/tracks/search?query=${encodeURIComponent(q)}&app_name=${APP_NAME}&limit=20`);
    const d = await r.json();
    renderizar(d.data || []);
  } catch(e) {
    document.getElementById('listaTracks').innerHTML = '<div class="vazio">Erro ao buscar.</div>';
  }
}

// RENDERIZAR
function renderizar(tracks) {
  tracksAtuais = tracks;
  const lista = document.getElementById('listaTracks');
  if (!tracks.length) {
    lista.innerHTML = '<div class="vazio"><i class="fas fa-music"></i>Nenhuma música encontrada.</div>';
    return;
  }
  lista.innerHTML = '';
  tracks.forEach((t, i) => {
    const capa = t.artwork ? t.artwork['150x150'] : '';
    const artista = t.user ? t.user.name : 'Desconhecido';
    const podeBaixar = t.is_downloadable === true;
    const div = document.createElement('div');
    div.className = 'track';
    div.innerHTML = `
      <img src="${capa}" alt="" onerror="this.style.background='#1a1f2e'">
      <div class="track-info">
        <h4>${t.title}</h4>
        <p>${artista}</p>
      </div>
      <div class="track-acoes">
        <button class="btn-track btn-play" onclick="tocar(${i})"><i class="fas fa-play"></i></button>
        ${podeBaixar 
          ? `<a class="btn-track btn-down" href="${BASE}/tracks/${t.id}/download?app_name=${APP_NAME}" target="_blank"><i class="fas fa-download"></i></a>`
          : `<button class="btn-track btn-down" disabled title="Este artista não permite download"><i class="fas fa-download"></i></button>`
        }
      </div>
    `;
    lista.appendChild(div);
  });
}

// TOCAR
function tocar(i) {
  const t = tracksAtuais[i];
  if (!t) return;
  const audio = document.getElementById('audioPlayer');
  const url = `${BASE}/tracks/${t.id}/stream?app_name=${APP_NAME}`;
  audio.src = url;
  audio.play();
  
  document.getElementById('playerFixo').style.display = 'flex';
  document.getElementById('playerImg').src = t.artwork ? t.artwork['150x150'] : '';
  document.getElementById('playerTitulo').textContent = t.title;
  document.getElementById('playerArtista').textContent = t.user ? t.user.name : '';
  document.getElementById('iconePlay').className = 'fas fa-pause';
  audioAtual = audio;
}

function togglePlay() {
  const audio = document.getElementById('audioPlayer');
  if (audio.paused) { audio.play(); document.getElementById('iconePlay').className = 'fas fa-pause'; }
  else { audio.pause(); document.getElementById('iconePlay').className = 'fas fa-play'; }
}

function fecharPlayer() {
  const audio = document.getElementById('audioPlayer');
  audio.pause();
  audio.src = '';
  document.getElementById('playerFixo').style.display = 'none';
}

carregarEmAlta();
</script>

</body>
  </html>
