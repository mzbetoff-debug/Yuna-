<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNA - Início</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== TEMAS ===== */
        :root { --fundo: #0a1428; --fundo-card: #0f1f3d; --texto: #ffffff; --texto-suave: #a0b8d8; --primaria: #3b82f6; --primaria-hover: #2563eb; --borda: #1e3a6f; }
        body.tema-azul { --fundo: #0a1428; --fundo-card: #0f1f3d; --texto: #ffffff; --texto-suave: #a0b8d8; --primaria: #3b82f6; --primaria-hover: #2563eb; --borda: #1e3a6f; }
        body.tema-roxo { --fundo: #0f0a1f; --fundo-card: #1a1033; --texto: #ffffff; --texto-suave: #b8b0d0; --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #2d1b4e; }
        body.tema-branco { --fundo: #f5f5f7; --fundo-card: #ffffff; --texto: #1a1a1a; --texto-suave: #555555; --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #e0e0e0; }
        body.tema-amarelo { --fundo: #1a1500; --fundo-card: #2a2000; --texto: #ffffff; --texto-suave: #d0c890; --primaria: #fbbf24; --primaria-hover: #f59e0b; --borda: #4a3a00; }

        /* ===== ESTILOS GERAIS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--fundo); color: var(--texto); transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
        
        /* ===== HEADER (IGUAL À IMAGEM) ===== */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--borda); background: var(--fundo); position: sticky; top: 0; z-index: 100; }
        .btn-header { background: transparent; border: 1px solid var(--borda); color: var(--texto); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .logo-header { color: var(--primaria); font-weight: 800; font-size: 24px; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .btn-sino { background: transparent; border: 1px solid var(--borda); color: var(--texto); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .user-avatar-header { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--borda); object-fit: cover; }

        /* ===== ABAS (IGUAL À IMAGEM) ===== */
        .abas { display: flex; padding: 15px 20px; gap: 15px; max-width: 600px; margin: 0 auto; }
        .aba { flex: 1; padding: 12px; text-align: center; border: 1px solid var(--borda); border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px; color: var(--texto-suave); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .aba.ativa { background: var(--primaria); color: #fff; border-color: var(--primaria); }

        /* ===== CONTAINER ===== */
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }

        /* ===== CRIAR POST (IGUAL À IMAGEM) ===== */
        .criar-post-card { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .criar-post-card input[type="text"] { width: 100%; background: transparent; border: none; color: var(--texto); font-size: 16px; outline: none; margin-bottom: 20px; }
        .criar-post-card input[type="text"]::placeholder { color: var(--texto-suave); }
        .criar-post-acoes { display: flex; justify-content: space-between; align-items: center; }
        .btn-foto { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--borda); color: var(--texto-suave); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .btn-foto i { font-size: 18px; }
        .btn-publicar { background: var(--primaria); color: #fff; border: none; padding: 10px 25px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; }

        /* ===== PESQUISA DE NOTÍCIAS ===== */
        .pesquisa-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .pesquisa-container input { flex: 1; background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 15px; padding: 12px 15px; color: var(--texto); font-size: 15px; outline: none; }
        .pesquisa-container input::placeholder { color: var(--texto-suave); }
        .btn-pesquisar { background: var(--primaria); color: #fff; border: none; width: 50px; border-radius: 15px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* ===== TÍTULOS DE SECÇÃO ===== */
        .titulo-seccao { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* ===== POSTS ===== */
        .post { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; margin-bottom: 15px; overflow: hidden; padding: 15px; }
        .post-header { display: flex; align-items: center; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 12px; cursor: pointer; border: 1px solid var(--borda); }
        .post-info { flex: 1; cursor: pointer; }
        .post-info h4 { font-size: 16px; font-weight: bold; }
        .post-info span { font-size: 12px; color: var(--texto-suave); }
        .btn-menu-pontos { background: none; border: none; color: var(--texto); font-size: 18px; cursor: pointer; }
        
        .post-content { margin-bottom: 15px; }
        .post-content p { margin-bottom: 10px; font-size: 15px; line-height: 1.4; }
        .post-img { width: 100%; border-radius: 15px; object-fit: cover; max-height: 400px; }

        .post-actions { display: flex; border-top: 1px solid var(--borda); padding-top: 15px; gap: 20px; }
        .action-btn { background: none; border: none; color: var(--texto-suave); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .action-btn:hover { color: var(--primaria); }

        /* ===== NAVEGAÇÃO INFERIOR ===== */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--fundo-card); border-top: 1px solid var(--borda); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--texto-suave); font-size: 11px; gap: 5px; transition: 0.2s; }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primaria); }

        /* ===== MODAIS ===== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: var(--fundo-card); padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--borda); max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 15px; text-align: center; }
        .btn-salvar { width: 100%; padding: 12px; background: var(--primaria); color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-fechar { width: 100%; padding: 12px; background: #ef4444; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-ranking { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }

        /* COMENTÁRIOS */
        .lista-comentarios { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .comentario-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--borda); font-size: 14px; }
        .btn-eliminar { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 14px; margin-left: 10px; }
        
        /* VÍDEOS E NOTÍCIAS CARD */
        .noticia-card, .video-card { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body class="tema-azul">

    <!-- HEADER -->
    <header>
        <button class="btn-header"><i class="fas fa-bars"></i></button>
        <div class="logo-header">YUNA</div>
        <div class="header-right">
            <button class="btn-sino"><i class="fas fa-bell"></i></button>
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" id="headerAvatar" class="user-avatar-header" alt="Perfil">
        </div>
    </header>

    <!-- ABAS -->
    <div class="abas">
        <div class="aba ativa" id="abaInicio" onclick="mudarAba('inicio')"><i class="fas fa-newspaper"></i> Início</div>
        <div class="aba" id="abaVideos" onclick="mudarAba('videos')"><i class="fas fa-film"></i> Vídeos</div>
    </div>

    <!-- SECÇÃO INÍCIO -->
    <div class="container" id="secaoInicio">
        
        <!-- CRIAR POST -->
        <div class="criar-post-card">
            <input type="text" id="inputTextoPost" placeholder="No que estás a pensar?">
            <input type="file" id="inputImagemPost" accept="image/*" style="display: none;" onchange="document.getElementById('nomeFoto').innerText = 'Foto Selecionada'">
            <div class="criar-post-acoes">
                <button class="btn-foto" onclick="document.getElementById('inputImagemPost').click()">
                    <i class="fas fa-camera"></i> <span id="nomeFoto">Foto</span>
                </button>
                <button class="btn-publicar" onclick="criarPost()">Publicar</button>
            </div>
        </div>

        <!-- PESQUISA DE NOTÍCIAS -->
        <div class="pesquisa-container">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar notícias...">
            <button class="btn-pesquisar" onclick="pesquisarNoticias()"><i class="fas fa-search"></i></button>
        </div>

        <!-- FEED -->
        <h3 class="titulo-seccao">📰 Publicações da Comunidade</h3>
        <div id="feedPosts"></div>
    </div>

    <!-- SECÇÃO VÍDEOS -->
    <div class="container" id="secaoVideos" style="display: none;">
        <div class="video-card" style="text-align:center;">
            <p><i class="fas fa-spinner fa-spin"></i> A carregar tendências de vídeos...</p>
        </div>
        <div id="feedVideos"></div>
    </div>

    <!-- MODAIS (COMENTÁRIOS, MENU, RANKING, PERFIL) -->
    <div class="modal" id="modalComentarios">
        <div class="modal-content">
            <h3>Comentários</h3>
            <div class="lista-comentarios" id="listaComentarios"></div>
            <input type="text" id="inputComentario" placeholder="Escreve um comentário..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid var(--borda); background:var(--fundo); color:var(--texto); outline:none;">
            <button class="btn-salvar" onclick="adicionarComentario()">Enviar</button>
            <button class="btn-fechar" onclick="document.getElementById('modalComentarios').style.display='none'">Fechar</button>
        </div>
    </div>

    <div class="modal" id="modalMenu">
        <div class="modal-content">
            <h3>Opções</h3>
            <button class="btn-ranking" onclick="verRanking()"><i class="fas fa-trophy"></i> Ver Ranking</button>
            <button class="btn-fechar" id="btnApagarPost" onclick="apagarPost()" style="display:none;"><i class="fas fa-trash"></i> Eliminar Publicação</button>
            <button class="btn-fechar" onclick="document.getElementById('modalMenu').style.display='none'" style="background:transparent; border:1px solid var(--borda); color:var(--texto);">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modalRanking">
        <div class="modal-content">
            <h3><i class="fas fa-trophy" style="color:gold;"></i> Ranking YUNA</h3>
            <div id="listaRanking" style="max-height: 200px; overflow-y: auto;"></div>
            <button class="btn-fechar" onclick="document.getElementById('modalRanking').style.display='none'">Fechar</button>
        </div>
    </div>

    <div class="modal" id="modalUserProfile">
        <div class="modal-content">
            <div style="text-align: center; margin-bottom: 15px;">
                <img id="modalUserAvatar" src="" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primaria); margin-bottom: 10px;">
                <h3 id="modalUserName" style="margin: 0;"></h3>
            </div>
            <h4 style="margin-bottom: 15px; color: var(--primaria); font-size: 16px;">Publicações:</h4>
            <div id="modalUserPosts" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn-fechar" onclick="document.getElementById('modalUserProfile').style.display='none'">Fechar</button>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="musica.html" class="nav-item"><i class="fas fa-music"></i><span>Música</span></a>
        <a href="animes.html" class="nav-item"><i class="fas fa-mask"></i><span>Animes</span></a>
        <a href="educacao.html" class="nav-item"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
        <a href="perfil.html" class="nav-item"><i class="fas fa-user"></i><span>Perfil</span></a>
    </nav>
    <!-- ===== SCRIPTS ===== -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // ⚠️ SUBSTITUI PELA TUA CONFIGURAÇÃO ⚠️
        const firebaseConfig = {
            apiKey: "A_TUA_API_KEY", 
            authDomain: "O_TEU_AUTH_DOMAIN", 
            projectId: "O_TEU_PROJECT_ID", 
            storageBucket: "O_TEU_STORAGE_BUCKET", 
            messagingSenderId: "O_TEU_MESSAGING_SENDER_ID", 
            appId: "O_TEU_APP_ID"
        };
        const IMGBB_API_KEY = "A_TUA_CHAVE_IMGBB_AQUI"; 

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let utilizadorAtual = null;
        let postAtualId = null; 

        // 1. VERIFICAR LOGIN
        auth.onAuthStateChanged(user => {
            if (user) {
                utilizadorAtual = user;
                const foto = user.photoURL || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                document.getElementById('headerAvatar').src = foto;
                
                carregarPosts();
                carregarVideos();
            } else {
                window.location.href = "login.html";
            }
        });

        // 2. CRIAR POST
        async function criarPost() {
            const texto = document.getElementById('inputTextoPost').value;
            const fileInput = document.getElementById('inputImagemPost');
            const file = fileInput.files[0];
            if (!texto && !file) return alert("Escreve algo ou escolhe uma foto!");
            let urlImagem = "";

            try {
                if (file) {
                    const formData = new FormData();
                    formData.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const data = await res.json();
                    if(data.success) urlImagem = data.data.url;
                }

                await db.collection("posts").add({
                    uid: utilizadorAtual.uid,
                    nomeUser: utilizadorAtual.displayName || "Membro YUNA",
                    fotoUser: utilizadorAtual.photoURL || "", 
                    texto: texto,
                    imagem: urlImagem,
                    likes: 0,
                    comentarios: [],
                    data: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('inputTextoPost').value = '';
                fileInput.value = '';
                document.getElementById('nomeFoto').innerText = 'Foto';
                alert("Publicado!");
            } catch (error) { alert("Erro ao publicar."); }
        }

        // 3. CARREGAR POSTS
        function carregarPosts() {
            db.collection("posts").orderBy("data", "desc").onSnapshot(snapshot => {
                const feed = document.getElementById('feedPosts');
                feed.innerHTML = '';
                if(snapshot.empty) { feed.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Ainda não há publicações.</p>'; return; }

                snapshot.forEach(doc => {
                    const post = doc.data();
                    const id = doc.id;
                    const isDono = post.uid === utilizadorAtual.uid; 
                    const fotoPost = post.fotoUser || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                    const imagemHTML = post.imagem ? `<img src="${post.imagem}" class="post-img">` : '';
                    
                    const postHTML = `
                        <div class="post">
                            <div class="post-header">
                                <img src="${fotoPost}" class="post-avatar" onclick="abrirPerfilUsuario('${post.uid}', '${post.nomeUser}', '${fotoPost}')">
                                <div class="post-info" onclick="abrirPerfilUsuario('${post.uid}', '${post.nomeUser}', '${fotoPost}')">
                                    <h4>${post.nomeUser || 'Utilizador'}</h4>
                                    <span>${new Date(post.data.toDate()).toLocaleString()}</span>
                                </div>
                                <button class="btn-menu-pontos" onclick="abrirMenu('${id}', ${isDono})"><i class="fas fa-ellipsis-v"></i></button>
                            </div>
                            <div class="post-content">
                                <p>${post.texto}</p>
                                ${imagemHTML}
                            </div>
                            <div class="post-actions">
                                <button class="action-btn"><i class="fas fa-heart"></i> ${post.likes || 0} Likes</button>
                                <button class="action-btn" onclick="abrirComentarios('${id}')"><i class="fas fa-comment"></i> ${post.comentarios ? post.comentarios.length : 0} Comentários</button>
                            </div>
                        </div>
                    `;
                    feed.innerHTML += postHTML;
                });
            });
        }

        // 4. VÍDEOS (MISTURA DE FONTES)
        async function carregarVideos() {
            const container = document.getElementById('feedVideos');
            let todosVideos = [];
            try {
                const dmRes = await fetch('https://api.dailymotion.com/videos?fields=id,title,thumbnail_480_url,url,owner.screenname&limit=4&sort=trending');
                const dmData = await dmRes.json();
                dmData.list.forEach(video => {
                    todosVideos.push({ titulo: video.title, thumb: video.thumbnail_480_url, link: video.url, canal: video['owner.screenname'] || 'Dailymotion', plataforma: 'Dailymotion', cor: '#0066ff', icone: 'fa-play' });
                });

                const youtubeExemplos = [
                    { titulo: 'Vídeo em Destaque no YouTube', thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg', link: 'https://youtube.com/watch?v=dQw4w9WgXcQ', canal: 'YouTube', plataforma: 'YouTube', cor: '#ff0000', icone: 'fa-youtube' }
                ];
                youtubeExemplos.forEach(yt => todosVideos.push(yt));

                container.innerHTML = '';
                todosVideos.sort(() => Math.random() - 0.5).forEach(video => {
                    container.innerHTML += `
                        <div class="video-card" onclick="window.open('${video.link}', '_blank')" style="cursor:pointer;">
                            <img src="${video.thumb}" style="width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
                            <div style="display:flex; gap:10px; align-items:center;">
                                <div style="width:40px; height:40px; border-radius:50%; background:${video.cor}; display:flex; align-items:center; justify-content:center; color:white;"><i class="fab ${video.icone}"></i></div>
                                <div>
                                    <div style="font-weight:bold; font-size:15px; margin-bottom:3px;">${video.titulo}</div>
                                    <div style="font-size:12px; color:var(--texto-suave);">${video.canal} • ${video.plataforma}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) { container.innerHTML = '<p style="text-align:center;">Erro ao carregar os vídeos.</p>'; }
        }

        // 5. MENU E APAGAR POST
        function abrirMenu(id, isDono) {
            postAtualId = id;
            document.getElementById('modalMenu').style.display = 'flex';
            document.getElementById('btnApagarPost').style.display = isDono ? 'block' : 'none';
        }

        async function apagarPost() {
            if (confirm("Apagar esta publicação?")) {
                await db.collection("posts").doc(postAtualId).delete();
                document.getElementById('modalMenu').style.display = 'none';
            }
        }

        // 6. COMENTÁRIOS
        function abrirComentarios(id) {
            postAtualId = id;
            document.getElementById('modalComentarios').style.display = 'flex';
            
            db.collection("posts").doc(postAtualId).onSnapshot(doc => {
                const lista = document.getElementById('listaComentarios');
                const comentarios = doc.data().comentarios || [];
                lista.innerHTML = '';

                if (comentarios.length === 0) {
                    lista.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Nenhum comentário.</p>';
                    return;
                }

                comentarios.forEach((c, index) => {
                    const btnApagar = (c.uid === utilizadorAtual.uid) ? `<button class="btn-eliminar" onclick="apagarComentario(${index})"><i class="fas fa-trash"></i></button>` : '';
                    lista.innerHTML += `<div class="comentario-item"><div><strong>${c.nome}:</strong> ${c.texto}</div> ${btnApagar}</div>`;
                });
            });
        }

        async function adicionarComentario() {
            const texto = document.getElementById('inputComentario').value;
            if (!texto) return;
            await db.collection("posts").doc(postAtualId).update({
                comentarios: firebase.firestore.FieldValue.arrayUnion({ uid: utilizadorAtual.uid, nome: utilizadorAtual.displayName || "Membro", texto: texto })
            });
            document.getElementById('inputComentario').value = '';
        }

        async function apagarComentario(index) {
            if (confirm("Apagar este comentário?")) {
                db.collection("posts").doc(postAtualId).get().then(doc => {
                    const comentarios = doc.data().comentarios;
                    comentarios.splice(index, 1);
                    db.collection("posts").doc(postAtualId).update({ comentarios: comentarios });
                });
            }
        }

        // 7. RANKING
        function verRanking() {
            document.getElementById('modalMenu').style.display = 'none';
            document.getElementById('modalRanking').style.display = 'flex';
            const lista = document.getElementById('listaRanking');
            lista.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A calcular...</p>';

            db.collection("posts").get().then(snapshot => {
                let contagem = {};
                snapshot.forEach(doc => {
                    const post = doc.data();
                    if(post.nomeUser) contagem[post.nomeUser] = (contagem[post.nomeUser] || 0) + 1;
                });

                const arrayRanking = Object.keys(contagem).map(nome => ({ nome: nome, pontos: contagem[nome] }));
                arrayRanking.sort((a, b) => b.pontos - a.pontos);

                lista.innerHTML = '';
                arrayRanking.forEach((user, index) => {
                    let medalha = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '🏅';
                    lista.innerHTML += `<div class="comentario-item"><span>${medalha} ${index+1}º ${user.nome}</span> <span>${user.pontos} posts</span></div>`;
                });
            });
        }

        // 8. PERFIL PÚBLICO (SEM E-MAIL)
        function abrirPerfilUsuario(uid, nome, foto) {
            document.getElementById('modalUserProfile').style.display = 'flex';
            document.getElementById('modalUserAvatar').src = foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            document.getElementById('modalUserName').innerText = nome || 'Utilizador';
            
            const containerPosts = document.getElementById('modalUserPosts');
            containerPosts.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A carregar...</p>';

            db.collection("posts").where("uid", "==", uid).get().then(snapshot => {
                if (snapshot.empty) {
                    containerPosts.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Este utilizador ainda não fez publicações.</p>';
                    return;
                }

                let postsDoUser = [];
                snapshot.forEach(doc => postsDoUser.push(doc.data()));
                postsDoUser.sort((a, b) => b.data.toMillis() - a.data.toMillis());

                containerPosts.innerHTML = '';
                postsDoUser.forEach(post => {
                    let imgHTML = post.imagem ? `<img src="${post.imagem}" style="width:100%; border-radius:8px; margin-top:8px; max-height:150px; object-fit:cover;">` : '';
                    containerPosts.innerHTML += `
                        <div style="background: var(--fundo); padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--borda);">
                            <p style="margin-bottom: 5px; font-size: 14px;">${post.texto}</p>
                            ${imgHTML}
                            <span style="font-size: 11px; color: var(--texto-suave); display:block; margin-top:5px;">
                                <i class="far fa-clock"></i> ${new Date(post.data.toDate()).toLocaleDateString()}
                            </span>
                        </div>
                    `;
                });
            });
        }

        // 9. MUDAR ABAS
        function mudarAba(aba) {
            document.getElementById('secaoInicio').style.display = aba === 'inicio' ? 'block' : 'none';
            document.getElementById('secaoVideos').style.display = aba === 'videos' ? 'block' : 'none';
            document.getElementById('abaInicio').classList.toggle('ativa', aba === 'inicio');
            document.getElementById('abaVideos').classList.toggle('ativa', aba === 'videos');
        }

        // 10. PESQUISAR NOTÍCIAS (Simulação)
        function pesquisarNoticias() {
            const termo = document.getElementById('inputPesquisa').value;
            if(termo) {
                alert("A pesquisar notícias sobre: " + termo);
            } else {
                alert("Escreve algo para pesquisar!");
            }
        }
    </script>
</body>
