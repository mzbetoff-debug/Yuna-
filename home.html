<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>YUNA · Início</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{background:#000;color:#e2e8f0;height:100vh;overflow:hidden;position:fixed;width:100%}

body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(236,72,153,.15),transparent 50%),radial-gradient(circle at 70% 70%,rgba(167,139,250,.15),transparent 50%);animation:girarFundo 30s linear infinite;z-index:0;pointer-events:none}
@keyframes girarFundo{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.header{position:fixed;top:0;left:0;right:0;z-index:100;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 70%,transparent 100%);pointer-events:none}
.header > *{pointer-events:auto}
.header-linha{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.menu-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(10px)}
.menu-btn:active{transform:scale(.95)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.logo-img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(236,72,153,.5)}
.logo-text h1{font-size:19px;font-weight:800;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#a78bfa);display:flex;align-items:center;justify-content:center;text-decoration:none;overflow:hidden;border:2px solid rgba(236,72,153,.4);box-shadow:0 0 15px rgba(236,72,153,.4)}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-avatar i{color:#fff;font-size:15px}

.search-bar{position:relative;width:100%}
.search-bar input{width:100%;background:rgba(20,25,40,.9);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px 12px 42px;color:#e2e8f0;font-size:14px;outline:none;backdrop-filter:blur(20px)}
.search-bar i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748b;font-size:14px}

.tela-home{position:relative;z-index:1;height:calc(100vh - 70px);overflow-y:scroll;scroll-snap-type:y proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-bottom:70px}
.tela-home::-webkit-scrollbar{display:none}

.video-slide{position:relative;height:calc(100vh - 70px);width:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}

.video-slide iframe{position:absolute;top:-60px;left:0;width:100%;height:calc(100% + 60px);border:none;z-index:0}

.video-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0e1a,#1a1f2e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}

.overlay{position:absolute;bottom:0;left:0;right:0;padding:80px 16px 40px;background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.6) 60%,transparent 100%);z-index:2;pointer-events:none}
.overlay > *{pointer-events:auto}
.canal{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:700;color:#fff}
.canal i{color:#f472b6}
.titulo-video{font-size:15px;font-weight:700;color:#fff;margin-bottom:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,.8)}

.acoes-laterais{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:18px;z-index:3}
.acao{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#fff;text-decoration:none}
.acao-btn{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,rgba(236,72,153,.3),rgba(167,139,250,.3));border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:19px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);transition:.2s}
.acao:active .acao-btn{transform:scale(.9)}
.acao-btn.like-ativo{background:linear-gradient(145deg,#f472b6,#ec4899);box-shadow:0 0 20px rgba(236,72,153,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.acao-btn.guardado-ativo{background:linear-gradient(145deg,#fbbf24,#f59e0b);box-shadow:0 0 20px rgba(251,191,36,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.acao span{font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}

.btn-nav{position:fixed;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(236,72,153,.4);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);z-index:50;transition:.2s}
.btn-nav:active{transform:scale(.9);background:rgba(236,72,153,.7)}
.btn-up{top:130px}
.btn-down{bottom:90px}

.tela-pesquisa{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#0a0e1a;overflow-y:auto;display:none}
.tela-pesquisa.aberto{display:block}
.pesquisa-header{position:sticky;top:0;z-index:10;background:rgba(10,14,26,.98);backdrop-filter:blur(20px);padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.pesquisa-back{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pesquisa-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;color:#e2e8f0;font-size:14px;outline:none}
.pesquisa-input:focus{border-color:#f472b6}
.grid-pesquisa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
.item-pesquisa{background:rgba(18,24,42,.7);border:1px solid rgba(255,255,255,.05);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.item-pesquisa:active{transform:scale(.97);border-color:rgba(236,72,153,.3)}
.item-pesquisa img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#1a1f2e}
.item-pesquisa .info{padding:10px}
.item-pesquisa .info h4{font-size:12px;font-weight:700;color:#f1f5f9;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.item-pesquisa .info p{font-size:10px;color:#94a3b8}

.loading-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;color:#94a3b8}
.spinner{width:50px;height:50px;border:4px solid rgba(167,139,250,.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.98);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:997;height:70px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;color:#64748b;font-size:10px;text-decoration:none;flex:1}
.nav-item i{font-size:20px}
.nav-item.active{color:#f472b6}
.nav-item.active i{color:#f472b6}

.menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:998;opacity:0;pointer-events:none;transition:.3s}
.menu-overlay.aberto{opacity:1;pointer-events:auto}
.menu-lateral{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85%;background:#0a0e1a;z-index:999;transform:translateX(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);box-shadow:10px 0 40px rgba(0,0,0,.5)}
.menu-lateral.aberto{transform:translateX(0)}
.menu-topo{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.menu-logo{display:flex;align-items:center;gap:10px}
.menu-logo img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.menu-logo h2{font-size:20px;font-weight:900;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.menu-fechar{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menu-lista{flex:1;overflow-y:auto;padding:16px 12px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;color:#cbd5e1;text-decoration:none;font-size:15px;font-weight:600;margin-bottom:4px;transition:.2s;cursor:pointer}
.menu-item:active{background:rgba(236,72,153,.1);color:#f472b6}
.menu-item i{width:24px;font-size:18px;color:#94a3b8;text-align:center}
.menu-rodape{padding:16px;border-top:1px solid rgba(255,255,255,.05)}
.btn-discord{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:linear-gradient(135deg,#5865f2,#4752c4);color:#fff;border-radius:12px;text-decoration:none;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(88,101,242,.4);transition:.2s}
.btn-discord i{font-size:20px}
.menu-copy{text-align:center;font-size:11px;color:#475569;margin-top:14px;line-height:1.5}
.menu-copy strong{color:#94a3b8}
.menu-copy a{color:#a78bfa;text-decoration:none}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:flex-end}
.modal.aberto{display:flex}
.modal-content{width:100%;background:#0f1420;border-radius:24px 24px 0 0;max-height:80vh;overflow-y:auto;padding:20px;border-top:1px solid rgba(255,255,255,.1);animation:subir .3s ease}
@keyframes subir{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:18px;font-weight:800;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-close{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:none;color:#94a3b8;cursor:pointer;font-size:16px}
.comentario{display:flex;gap:10px;padding:12px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05)}
.comentario-foto{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#f472b6,#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0;font-size:14px}
.comentario-info{flex:1;min-width:0}
.comentario-info h5{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:3px}
.comentario-info p{font-size:13px;color:#cbd5e1;line-height:1.4}
.input-comentario{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05)}
.input-comentario input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;color:#e2e8f0;font-size:14px;outline:none}
.input-comentario button{background:linear-gradient(135deg,#a78bfa,#8b5cf6);border:none;border-radius:12px;padding:0 16px;color:#fff;font-weight:700;cursor:pointer;font-size:14px}

.rank-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.03);border-radius:14px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05)}
.rank-pos{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;font-size:14px}
.rank-foto{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#f472b6,#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
.rank-info{flex:1;min-width:0}
.rank-info h4{font-size:14px;font-weight:700;color:#f1f5f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-info p{font-size:11px;color:#94a3b8}
.rank-pts{font-size:15px;font-weight:800;color:#f472b6}
</style>
</head>

<script>
function abrirMenu(){document.getElementById('menuLateral').classList.add('aberto');document.getElementById('menuOverlay').classList.add('aberto')}
function fecharMenu(){document.getElementById('menuLateral').classList.remove('aberto');document.getElementById('menuOverlay').classList.remove('aberto')}
function abrirRanking(){fecharMenu();document.getElementById('rankingLateral').classList.add('aberto');document.getElementById('rankingOverlay').classList.add('aberto');if(window.carregarRanking)window.carregarRanking()}
function fecharRanking(){document.getElementById('rankingLateral').classList.remove('aberto');document.getElementById('rankingOverlay').classList.remove('aberto')}
function abrirAnime(){fecharMenu();document.getElementById('animeInput').click()}
function processarAnime(e){const f=e.target.files[0];if(!f)return;alert('📸 Anime reconhecido! (Função a implementar)')}
function fecharComentarios(){document.getElementById('modalComentarios').classList.remove('aberto')}
function abrirPesquisa(){document.getElementById('telaPesquisa').classList.add('aberto');setTimeout(()=>document.getElementById('inputPesquisa').focus(),100)}
function fecharPesquisa(){document.getElementById('telaPesquisa').classList.remove('aberto')}

let touchStartY = 0;
const feedSwipe = document.getElementById('telaHome');
feedSwipe.addEventListener('touchstart', (e) => { touchStartY = e.changedTouches[0].screenY; }, { passive: true });
feedSwipe.addEventListener('touchend', (e) => {
  const touchEndY = e.changedTouches[0].screenY;
  const diff = touchStartY - touchEndY;
  if (Math.abs(diff) > 60) {
    if (diff > 0) feedSwipe.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
    else feedSwipe.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
  }
}, { passive: true });
  </script>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, query, orderBy, limit, getDocs, increment, serverTimestamp, where, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
    authDomain: "yuna-8fe24.firebaseapp.com",
    projectId: "yuna-8fe24",
    storageBucket: "yuna-8fe24.firebasestorage.app",
    messagingSenderId: "531340097112",
    appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  setPersistence(auth, browserLocalPersistence);

  let userAtual = null;
  window.fbLikeIds = [];
  window.fbGuardarIds = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('login.html'); return; }
    userAtual = user;
    const avatar = document.getElementById('userAvatar');
    if (user.photoURL) avatar.innerHTML = `<img src="${user.photoURL}" alt="">`;

    try {
      await setDoc(doc(db, 'ranking', user.uid), {
        nome: user.displayName || 'Amigo',
        foto: user.photoURL || '',
        pontos: increment(1),
        acessos: increment(1),
        ultimoAcesso: serverTimestamp()
      }, { merge: true });
    } catch(e) {}

    // 🔥 CARREGA LIKES E GUARDADOS DO USUÁRIO
    try {
      const qL = query(collection(db, 'likes'), where('uid', '==', user.uid));
      const sL = await getDocs(qL);
      sL.forEach(d => window.fbLikeIds.push(d.data().videoId));

      const qG = query(collection(db, 'guardados'), where('uid', '==', user.uid));
      const sG = await getDocs(qG);
      sG.forEach(d => window.fbGuardarIds.push(d.data().videoId));

      atualizarBotoes();
    } catch(e) { console.log(e); }
  });

  function atualizarBotoes() {
    document.querySelectorAll('.video-slide').forEach(slide => {
      const id = slide.dataset.id;
      if (!id) return;
      slide.querySelectorAll('.acao').forEach(acao => {
        const btn = acao.querySelector('.acao-btn');
        const span = acao.querySelector('span');
        const icone = acao.querySelector('.acao-btn i');
        if (!icone) return;
        if (icone.classList.contains('fa-heart')) {
          if (window.fbLikeIds.includes(id)) {
            btn.classList.add('like-ativo');
            span.textContent = 'Curtido';
          } else {
            btn.classList.remove('like-ativo');
            span.textContent = 'Curtir';
          }
        }
        if (icone.classList.contains('fa-bookmark')) {
          if (window.fbGuardarIds.includes(id)) {
            btn.classList.add('guardado-ativo');
            span.textContent = 'Guardado';
          } else {
            btn.classList.remove('guardado-ativo');
            span.textContent = 'Guardar';
          }
        }
      });
    });
  }
  window.atualizarBotoes = atualizarBotoes;

  window.carregarRanking = async function() {
    try {
      const q = query(collection(db, 'ranking'), orderBy('pontos', 'desc'), limit(50));
      const snap = await getDocs(q);
      const div = document.getElementById('rankingLista');
      if (snap.empty) { div.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px">Ninguém ainda.</p>'; return; }
      div.innerHTML = '';
      let pos = 1;
      snap.forEach(d => {
        const u = d.data();
        const bg = pos===1?'linear-gradient(135deg,#fbbf24,#f59e0b)':pos===2?'linear-gradient(135deg,#e2e8f0,#94a3b8)':pos===3?'linear-gradient(135deg,#d97706,#92400e)':'rgba(255,255,255,.05)';
        const fotoHTML = u.foto ? `<img class="rank-foto" src="${u.foto}" alt="">` : `<div class="rank-foto">${(u.nome||'?').charAt(0)}</div>`;
        const el = document.createElement('div');
        el.className = 'rank-item';
        el.innerHTML = `
          <div class="rank-pos" style="background:${bg}">${pos}</div>
          ${fotoHTML}
          <div class="rank-info">
            <h4>${u.nome || 'Anônimo'}</h4>
            <p>🎬 ${u.videos||0} · ❤️ ${u.likes||0}</p>
          </div>
          <div class="rank-pts">${u.pontos || 0}</div>
        `;
        div.appendChild(el);
        pos++;
      });
    } catch(e) {}
  };

  window.toggleLike = async (id, botaoEl, spanEl) => {
    if (!userAtual) return;
    try {
      const ref = doc(db, 'likes', userAtual.uid + '_' + id);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        await deleteDoc(ref);
        botaoEl.classList.remove('like-ativo');
        spanEl.textContent = 'Curtir';
        window.fbLikeIds = window.fbLikeIds.filter(x => x !== id);
      } else {
        await setDoc(ref, { uid: userAtual.uid, videoId: id, criadoEm: serverTimestamp() });
        botaoEl.classList.add('like-ativo');
        spanEl.textContent = 'Curtido';
        window.fbLikeIds.push(id);
      }
    } catch(e) {}
  };

  window.toggleGuardar = async (id, botaoEl, spanEl) => {
    if (!userAtual) return;
    try {
      const ref = doc(db, 'guardados', userAtual.uid + '_' + id);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        await deleteDoc(ref);
        botaoEl.classList.remove('guardado-ativo');
        spanEl.textContent = 'Guardar';
        window.fbGuardarIds = window.fbGuardarIds.filter(x => x !== id);
      } else {
        await setDoc(ref, { uid: userAtual.uid, videoId: id, criadoEm: serverTimestamp() });
        botaoEl.classList.add('guardado-ativo');
        spanEl.textContent = 'Guardado';
        window.fbGuardarIds.push(id);
      }
    } catch(e) {}
  };

  // 💬 COMENTÁRIOS
  let videoComentarioAtual = null;
  window.abrirComentarios = async (id) => {
    videoComentarioAtual = id;
    document.getElementById('modalComentarios').classList.add('aberto');
    await carregarComentarios(id);
  };

  async function carregarComentarios(id) {
    const div = document.getElementById('listaComentarios');
    div.innerHTML = '<div style="text-align:center;padding:20px;color:#64748b">Carregando...</div>';
    try {
      const q = query(collection(db, 'comentarios'), where('videoId', '==', id), where('pai', '==', null));
      const snap = await getDocs(q);
      if (snap.empty) { div.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px">Nenhum comentário ainda. Sê o primeiro!</p>'; return; }
      const lista = [];
      snap.forEach(d => lista.push({ id: d.id, ...d.data() }));
      lista.sort((a,b) => (b.criadoEm?.seconds||0) - (a.criadoEm?.seconds||0));
      div.innerHTML = '';
      for (const c of lista) {
        div.appendChild(criarElemento(c));
        const respostas = await carregarRespostas(c.id);
        respostas.forEach(r => div.appendChild(criarElemento(r, true)));
      }
    } catch(e) {
      console.log(e);
      div.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px">Erro ao carregar.</p>';
    }
  }

  async function carregarRespostas(paiId) {
    try {
      const q = query(collection(db, 'comentarios'), where('pai', '==', paiId));
      const snap = await getDocs(q);
      const lista = [];
      snap.forEach(d => lista.push({ id: d.id, ...d.data() }));
      lista.sort((a,b) => (a.criadoEm?.seconds||0) - (b.criadoEm?.seconds||0));
      return lista;
    } catch(e) { return []; }
  }

  function criarElemento(c, isResposta = false) {
    const el = document.createElement('div');
    el.className = 'comentario';
    if (isResposta) el.style.marginLeft = '40px';
    const fotoHTML = c.foto 
      ? `<img class="comentario-foto" src="${c.foto}" alt="">` 
      : `<div class="comentario-foto">${(c.nome||'?').charAt(0)}</div>`;
    const ehMeu = userAtual && c.uid === userAtual.uid;
    el.innerHTML = `
      ${fotoHTML}
      <div class="comentario-info">
        <h5>${c.nome || 'Anônimo'}</h5>
        <p>${c.texto}</p>
        <div style="display:flex;gap:14px;margin-top:6px">
          <span onclick="responderComentario('${c.id}', '${(c.nome||'').replace(/'/g, "\\'")}')" style="font-size:11px;color:#a78bfa;cursor:pointer">↩️ Responder</span>
          ${ehMeu ? `<span onclick="eliminarComentario('${c.id}')" style="font-size:11px;color:#f472b6;cursor:pointer">🗑️ Eliminar</span>` : ''}
        </div>
      </div>
    `;
    return el;
  }

  window.responderComentario = async (paiId, nomePai) => {
    const texto = prompt(`Responder a ${nomePai}:`);
    if (!texto || !texto.trim() || !userAtual) return;
    try {
      await addDoc(collection(db, 'comentarios'), {
        videoId: videoComentarioAtual,
        uid: userAtual.uid,
        nome: userAtual.displayName || 'Anônimo',
        foto: userAtual.photoURL || '',
        texto: texto.trim(),
        pai: paiId,
        criadoEm: serverTimestamp()
      });
      await carregarComentarios(videoComentarioAtual);
    } catch(e) { alert('Erro: ' + e.message); }
  };

  window.eliminarComentario = async (id) => {
    if (!confirm('Eliminar este comentário?')) return;
    try {
      await deleteDoc(doc(db, 'comentarios', id));
      await carregarComentarios(videoComentarioAtual);
    } catch(e) { alert('Erro: ' + e.message); }
  };

  window.enviarComentario = async () => {
    if (!userAtual || !videoComentarioAtual) return;
    const input = document.getElementById('inputComentario');
    const texto = input.value.trim();
    if (!texto) return;
    try {
      await addDoc(collection(db, 'comentarios'), {
        videoId: videoComentarioAtual,
        uid: userAtual.uid,
        nome: userAtual.displayName || 'Anônimo',
        foto: userAtual.photoURL || '',
        texto,
        pai: null,
        criadoEm: serverTimestamp()
      });
      input.value = '';
      await carregarComentarios(videoComentarioAtual);
    } catch(e) { alert('Erro: ' + e.message); }
  };
  </script>
  <script>
const IA_BASE = 'https://archive.org';
let carregando = false;
let proximoPage = 1;

function mostrarSkeleton(tela) {
  const el = document.getElementById(tela);
  const sk = document.createElement('div');
  sk.className = 'loading-slide';
  sk.innerHTML = '<div class="spinner"></div><span>Carregando vídeos...</span>';
  el.appendChild(sk);
}
function removerSkeleton() {
  document.querySelectorAll('.loading-slide').forEach(s => s.remove());
}

async function buscarVideosIA(query = '', page = 1, destino = 'telaHome') {
  if (carregando) return;
  carregando = true;
  mostrarSkeleton(destino);
  try {
    const termo = query || 'classic movies';
    const url = `${IA_BASE}/advancedsearch.php?q=${encodeURIComponent(termo + ' AND mediatype:(movies OR video)')}&fl[]=identifier&fl[]=title&fl[]=year&fl[]=downloads&rows=15&page=${page}&output=json&sort[]=downloads+desc`;
    const r = await fetch(url);
    const d = await r.json();
    removerSkeleton();
    if (!d.response || !d.response.docs) { carregando = false; return; }
    const docs = d.response.docs;
    if (docs.length === 0) { carregando = false; return; }
    
    const el = document.getElementById(destino);
    if (destino === 'telaHome') {
      docs.slice(0, 8).forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = 'video-slide';
        slide.dataset.id = item.identifier;
        slide.innerHTML = `
          <div class="video-placeholder" id="ph-${item.identifier}">
            <div class="spinner"></div>
            <span style="color:#94a3b8;font-size:12px;margin-top:12px">Vídeo ${index + 1}</span>
          </div>
          <div class="acoes-laterais">
            <div class="acao" onclick="event.stopPropagation(); window.toggleLike('${item.identifier}', this.querySelector('.acao-btn'), this.querySelector('span'))">
              <div class="acao-btn"><i class="fas fa-heart"></i></div>
              <span>Curtir</span>
            </div>
            <div class="acao" onclick="event.stopPropagation(); window.abrirComentarios('${item.identifier}')">
              <div class="acao-btn"><i class="fas fa-comment"></i></div>
              <span>Comentar</span>
            </div>
            <div class="acao" onclick="event.stopPropagation(); window.toggleGuardar('${item.identifier}', this.querySelector('.acao-btn'), this.querySelector('span'))">
              <div class="acao-btn"><i class="fas fa-bookmark"></i></div>
              <span>Guardar</span>
            </div>
          </div>
          <div class="overlay">
            <div class="canal"><i class="fas fa-film"></i> ${item.year || 'Arquivo'}</div>
            <div class="titulo-video">${item.title || 'Vídeo'}</div>
          </div>
        `;
        el.appendChild(slide);
      });
      ativarLazyLoading();
      if (window.atualizarBotoes) setTimeout(window.atualizarBotoes, 500);
    } else {
      docs.forEach(item => {
        const elItem = document.createElement('div');
        elItem.className = 'item-pesquisa';
        elItem.onclick = () => abrirVideoPesquisa(item.identifier, item.title);
        elItem.innerHTML = `
          <img src="https://archive.org/services/img/${item.identifier}" onerror="this.style.background='#1a1f2e'">
          <div class="info">
            <h4>${item.title || 'Vídeo'}</h4>
            <p>${item.year || '—'}</p>
          </div>
        `;
        el.appendChild(elItem);
      });
    }
    proximoPage = page + 1;
    carregando = false;
  } catch(e) {
    console.log(e);
    removerSkeleton();
    carregando = false;
  }
}

function ativarLazyLoading() {
  const slides = document.querySelectorAll('.video-slide');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const slide = entry.target;
      const id = slide.dataset.id;
      const placeholder = document.getElementById(`ph-${id}`);
      
      if (entry.isIntersecting) {
        if (placeholder && !slide.querySelector('iframe')) {
          const iframe = document.createElement('iframe');
          iframe.src = `https://archive.org/embed/${id}`;
          iframe.allowFullscreen = true;
          slide.insertBefore(iframe, slide.firstChild);
          placeholder.remove();
        }
      } else {
        const iframe = slide.querySelector('iframe');
        if (iframe) {
          iframe.remove();
          if (!document.getElementById(`ph-${id}`)) {
            const ph = document.createElement('div');
            ph.className = 'video-placeholder';
            ph.id = `ph-${id}`;
            ph.innerHTML = '<div class="spinner"></div>';
            slide.insertBefore(ph, slide.firstChild);
          }
        }
      }
    });
  }, {
    root: document.getElementById('telaHome'),
    rootMargin: '100% 0px',
    threshold: 0
  });
  slides.forEach(slide => observer.observe(slide));
}

function fazerPesquisa() {
  const q = document.getElementById('inputPesquisa').value.trim();
  if (!q) return;
  document.getElementById('gridPesquisa').innerHTML = '';
  buscarVideosIA(q, 1, 'gridPesquisa');
}

function abrirVideoPesquisa(id, titulo) {
  fecharPesquisa();
  const home = document.getElementById('telaHome');
  home.innerHTML = '';
  const slide = document.createElement('div');
  slide.className = 'video-slide';
  slide.dataset.id = id;
  slide.innerHTML = `
    <iframe src="https://archive.org/embed/${id}" allowfullscreen></iframe>
    <div class="acoes-laterais">
      <div class="acao" onclick="event.stopPropagation(); window.toggleLike('${id}', this.querySelector('.acao-btn'), this.querySelector('span'))">
        <div class="acao-btn"><i class="fas fa-heart"></i></div>
        <span>Curtir</span>
      </div>
      <div class="acao" onclick="event.stopPropagation(); window.abrirComentarios('${id}')">
        <div class="acao-btn"><i class="fas fa-comment"></i></div>
        <span>Comentar</span>
      </div>
      <div class="acao" onclick="event.stopPropagation(); window.toggleGuardar('${id}', this.querySelector('.acao-btn'), this.querySelector('span'))">
        <div class="acao-btn"><i class="fas fa-bookmark"></i></div>
        <span>Guardar</span>
      </div>
    </div>
    <div class="overlay">
      <div class="canal"><i class="fas fa-film"></i> Internet Archive</div>
      <div class="titulo-video">${titulo || 'Vídeo'}</div>
    </div>
  `;
  home.appendChild(slide);
  if (window.atualizarBotoes) setTimeout(window.atualizarBotoes, 300);
  home.scrollTo({ top: 0, behavior: 'smooth' });
}

const homeEl = document.getElementById('telaHome');
homeEl.addEventListener('scroll', () => {
  if (homeEl.scrollTop + homeEl.clientHeight >= homeEl.scrollHeight - 800) {
    buscarVideosIA('', proximoPage, 'telaHome');
  }
});

buscarVideosIA('', 1, 'telaHome');
setTimeout(() => buscarVideosIA('', 2, 'telaHome'), 3000);
</script>
