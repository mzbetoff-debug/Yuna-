<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>YUNA · Início</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="/Yuna-/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* 🎨 TEMAS */
:root { --bg: #0a0e1a; --card-bg: rgba(18,24,42,.7); --text-main: #f1f5f9; --text-sub: #94a3b8; --accent: #f472b6; --accent-gradient: linear-gradient(135deg,#f472b6,#a78bfa); --nav-bg: rgba(10,14,26,.98); --border: rgba(255,255,255,.06); }
body.theme-branco { --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --accent: #8b5cf6; --accent-gradient: linear-gradient(135deg,#8b5cf6,#ec4899); --nav-bg: #ffffff; --border: rgba(0,0,0,.1); }
body.theme-azul { --bg: #0f172a; --card-bg: rgba(30,41,59,.8); --text-main: #f8fafc; --text-sub: #94a3b8; --accent: #38bdf8; --accent-gradient: linear-gradient(135deg,#38bdf8,#0ea5e9); --nav-bg: #0f172a; --border: rgba(56,189,248,.2); }
body.theme-amarelo { --bg: #000000; --card-bg: rgba(20,20,20,.9); --text-main: #fef08a; --text-sub: #ca8a04; --accent: #facc15; --accent-gradient: linear-gradient(135deg,#facc15,#eab308); --nav-bg: #000000; --border: rgba(250,204,21,.2); }

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition: background 0.3s, color 0.3s;}
html,body{background:var(--bg);color:var(--text-main);min-height:100vh;scroll-behavior:smooth;}
body{padding-bottom:80px}

/* HEADER */
.header{position:sticky;top:0;z-index:100;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.menu-btn{width:40px;height:40px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-main);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logo-text{font-size:20px;font-weight:900;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:12px}
.notif-btn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--card-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-main)}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--border);text-decoration:none;color:#fff}
.user-avatar img{width:100%;height:100%;object-fit:cover}

/* ABAS */
.tabs-info{display:flex;gap:8px;padding:16px;overflow-x:auto;border-bottom:1px solid var(--border)}
.tab-info{flex:1;text-align:center;padding:10px 16px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-sub);font-size:13px;font-weight:700;cursor:pointer}
.tab-info.active{background:var(--accent-gradient);color:#fff;border:none}

/* MURAL E NOTÍCIAS */
.novo-post{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px}
.novo-post textarea{width:100%;height:60px;background:transparent;border:none;color:var(--text-main);font-size:15px;resize:none;outline:none}
.novo-post textarea::placeholder{color:var(--text-sub)}
.preview-img{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px;display:none}
.novo-post .footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.btn-foto{background:transparent;border:1px solid var(--border);color:var(--text-main);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-publicar{background:var(--accent-gradient);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer}

.search-info{display:flex;gap:8px;padding:0 16px 16px}
.search-info input{flex:1;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);outline:none}
.search-info button{padding:0 20px;border-radius:12px;border:none;background:var(--accent-gradient);color:#fff;font-weight:bold;cursor:pointer}

.feed{padding:0 16px}
.post{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.post-foto{width:40px;height:40px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;overflow:hidden;flex-shrink:0}
.post-foto img{width:100%;height:100%;object-fit:cover}
.post-info h4{font-size:14px;font-weight:700;color:var(--text-main)}
.post-info p{font-size:11px;color:var(--text-sub)}
.post-conteudo{font-size:14px;line-height:1.5;color:var(--text-main);margin-bottom:12px;white-space:pre-wrap}
.post-img{width:100%;border-radius:12px;margin-bottom:12px;max-height:400px;object-fit:cover}
.post-acoes{display:flex;gap:16px;font-size:12px;color:var(--text-sub);border-top:1px solid var(--border);padding-top:10px;align-items:center;}
.post-acoes span, .post-acoes a {cursor:pointer;display:flex;align-items:center;gap:5px;text-decoration:none;color:var(--text-sub);}
.post-acoes a:hover {color:var(--accent);}
.btn-mais-info{width:calc(100% - 32px);margin:0 16px 20px;padding:12px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;color:var(--accent);font-weight:bold;cursor:pointer}

/* VÍDEOS SHORTS */
.tela-videos{height:calc(100vh - 130px);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.tela-videos::-webkit-scrollbar{display:none}
.video-slide{position:relative;height:calc(100vh - 130px);width:100%;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center}
.video-slide iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;pointer-events:auto;}
.acoes-laterais{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:20px;z-index:10}
.acao{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#fff}
.acao-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.2);transition:0.2s;}
.acao-btn.like-ativo{background:var(--accent-gradient);border:none}
.acao span{font-size:11px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.overlay-video{position:absolute;bottom:0;left:0;right:70px;padding:20px 16px 40px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,transparent 100%);z-index:5;pointer-events:none}
.overlay-video h4{font-size:15px;font-weight:bold;color:#fff;margin-bottom:4px}
.overlay-video p{font-size:13px;color:#eee;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* MODAIS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:flex-end}
.modal.aberto{display:flex}
.modal-content{width:100%;background:var(--bg);border-radius:24px 24px 0 0;max-height:85vh;overflow-y:auto;padding:20px;border-top:1px solid var(--border)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-close{background:var(--card-bg);border:none;color:var(--text-main);width:32px;height:32px;border-radius:50%;cursor:pointer}
.comentario{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.comentario-foto{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;flex-shrink:0}
.comentario-info h5{font-size:13px;font-weight:bold;color:var(--text-main);margin-bottom:3px}
.comentario-info p{font-size:13px;color:var(--text-sub);line-height:1.4}
.input-comentario{display:flex;gap:8px;margin-top:16px}
.input-comentario input{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:12px 16px;color:var(--text-main);outline:none}
.input-comentario button{background:var(--accent-gradient);border:none;border-radius:50%;width:44px;height:44px;color:#fff;font-size:16px;cursor:pointer}
.perfil-modal{text-align:center;padding:20px}
.perfil-modal img{width:80px;height:80px;border-radius:50%;margin-bottom:10px;object-fit:cover}

/* MENUS */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:997}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-sub);font-size:10px;text-decoration:none;flex:1}
.nav-item i{font-size:20px}
.nav-item.active{color:var(--accent)}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:998;opacity:0;pointer-events:none;transition:.3s}
.menu-overlay.aberto{opacity:1;pointer-events:auto}
.menu-lateral{position:fixed;top:0;left:0;bottom:0;width:290px;background:var(--bg);z-index:999;transform:translateX(-100%);transition:.35s;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.menu-lateral.aberto{transform:translateX(0)}
.menu-topo{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.menu-lista{flex:1;padding:16px 12px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--text-main);text-decoration:none;font-size:15px;font-weight:600;cursor:pointer}
.menu-item i{width:24px;text-align:center;color:var(--text-sub)}
.temas-grid{display:flex;gap:12px;padding:10px 16px;justify-content:space-around}
.tema-btn{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.tema-btn.padrao{background:linear-gradient(135deg,#f472b6,#a78bfa)}
.tema-btn.branco{background:#fff;border-color:#cbd5e1}
.tema-btn.azul{background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
.tema-btn.amarelo{background:linear-gradient(135deg,#facc15,#eab308)}
.tema-btn.ativo{border-color:var(--text-main);transform:scale(1.1)}
.btn-topo{position:fixed;bottom:90px;right:16px;width:46px;height:46px;border-radius:50%;background:var(--accent-gradient);color:#fff;border:none;display:none;align-items:center;justify-content:center;font-size:18px;z-index:990;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.btn-topo.mostrar{display:flex}
</style>
</head>
<body class="theme-padrao">

<header class="header">
  <button class="menu-btn" onclick="abrirMenu()"><i class="fas fa-bars"></i></button>
  <div class="logo-text">YUNA</div>
  <div class="header-right">
    <div class="notif-btn" onclick="abrirNotificacoes()"><i class="fas fa-bell"></i></div>
    <a class="user-avatar" href="perfil.html" id="userAvatar"><i class="fas fa-user"></i></a>
  </div>
</header>

<div class="tabs-info">
  <div class="tab-info active" onclick="mudarAba('feed')">📰 Início</div>
  <div class="tab-info" onclick="mudarAba('videos')">🎬 Vídeos</div>
</div>

<div id="aba-feed">
  <div class="novo-post">
    <textarea id="textoPost" placeholder="No que estás a pensar?" maxlength="280"></textarea>
    <img id="previewImagem" class="preview-img">
    <div class="footer">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn-foto" onclick="document.getElementById('inputFotoPost').click()"><i class="fas fa-camera"></i></button>
        <span style="color:var(--text-sub);font-size:12px">Foto</span>
      </div>
      <button class="btn-publicar" onclick="criarPost()">Publicar</button>
    </div>
  </div>

  <div class="search-info">
    <input type="text" id="inputPesquisaInfo" placeholder="Pesquisar notícias..." onkeypress="if(event.key==='Enter') pesquisarInfo()">
    <button onclick="pesquisarInfo()"><i class="fas fa-search"></i></button>
  </div>

  <div class="feed" id="feedPosts"></div>
  <div class="feed" id="feedInfo"></div>
  <button class="btn-mais-info" id="btnMaisInfo" onclick="carregarMaisInfo()">Ver mais notícias 🌍</button>
</div>

<div id="aba-videos" style="display:none;">
  <div class="tela-videos" id="telaVideos"></div>
</div>

<button class="btn-topo" id="btnTopo" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>
<input type="file" id="inputFotoPost" accept="image/*" style="display:none" onchange="previewFoto(this)">

<div class="modal" id="modalPerfil" onclick="if(event.target===this)this.classList.remove('aberto')">
  <div class="modal-content"><div class="modal-header"><h3>Perfil</h3><button class="modal-close" onclick="document.getElementById('modalPerfil').classList.remove('aberto')"><i class="fas fa-times"></i></button></div><div class="perfil-modal" id="perfilConteudo"></div></div>
</div>
<div class="modal" id="modalComentariosPost" onclick="if(event.target===this)this.classList.remove('aberto')">
  <div class="modal-content"><div class="modal-header"><h3>Comentários</h3><button class="modal-close" onclick="document.getElementById('modalComentariosPost').classList.remove('aberto')"><i class="fas fa-times"></i></button></div><div id="listaComentariosPost"></div><div class="input-comentario"><input type="text" id="inputComentarioPost" placeholder="Comentar..."><button onclick="enviarComentarioPost()"><i class="fas fa-paper-plane"></i></button></div></div>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" href="home.html"><i class="fas fa-home"></i><span>Início</span></a>
  <a class="nav-item" href="musica.html"><i class="fas fa-music"></i><span>Música</span></a>
  <a class="nav-item" href="animes.html"><i class="fas fa-dragon"></i><span>Animes</span></a>
  <a class="nav-item" href="educacao.html"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
  <a class="nav-item" href="perfil.html"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<aside class="menu-lateral" id="menuLateral">
  <div class="menu-topo"><div class="logo-text">YUNA</div><button class="menu-btn" onclick="fecharMenu()"><i class="fas fa-times"></i></button></div>
  <div style="padding:10px 16px 0;font-size:12px;color:var(--text-sub);font-weight:bold">COR DO APP:</div>
  <div class="temas-grid">
    <div class="tema-btn padrao ativo" onclick="mudarTema('padrao', this)"></div>
    <div class="tema-btn branco" onclick="mudarTema('branco', this)"></div>
    <div class="tema-btn azul" onclick="mudarTema('azul', this)"></div>
    <div class="tema-btn amarelo" onclick="mudarTema('amarelo', this)"></div>
  </div>
  <nav class="menu-lista">
    <a class="menu-item" href="home.html"><i class="fas fa-home"></i> Início</a>
    <a class="menu-item" href="musica.html"><i class="fas fa-music"></i> Música</a>
    <a class="menu-item" href="educacao.html"><i class="fas fa-book"></i> Livros</a>
    <a class="menu-item" href="perfil.html"><i class="fas fa-user"></i> Perfil</a>
  </nav>
</aside>
<script>
function mudarTema(tema, el) { document.body.className = 'theme-' + tema; localStorage.setItem('yuna_theme', tema); document.querySelectorAll('.tema-btn').forEach(b => b.classList.remove('ativo')); el.classList.add('ativo'); }
const temaSalvo = localStorage.getItem('yuna_theme'); if(temaSalvo) document.body.className = 'theme-' + temaSalvo;
function abrirMenu(){document.getElementById('menuLateral').classList.add('aberto');document.getElementById('menuOverlay').classList.add('aberto')}
function fecharMenu(){document.getElementById('menuLateral').classList.remove('aberto');document.getElementById('menuOverlay').classList.remove('aberto')}

function mudarAba(aba) {
  document.getElementById('aba-feed').style.display = aba === 'feed' ? 'block' : 'none';
  document.getElementById('aba-videos').style.display = aba === 'videos' ? 'block' : 'none';
  document.querySelectorAll('.tab-info').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  if(aba === 'feed' && window.carregarInfoInicial) carregarInfoInicial();
  if(aba === 'videos' && window.iniciarVideos) iniciarVideos();
}

function previewFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewImagem').src = e.target.result;
      document.getElementById('previewImagem').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}
window.addEventListener('scroll', () => {
  const btn = document.getElementById('btnTopo');
  if (window.scrollY > 300) btn.classList.add('mostrar'); else btn.classList.remove('mostrar');
});
function abrirNotificacoes() { alert("🔔 Nenhuma notificação nova no momento!"); }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs, serverTimestamp, where, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
    authDomain: "yuna-8fe24.firebaseapp.com",
    projectId: "yuna-8fe24",
    storageBucket: "yuna-8fe24.firebasestorage.app",
    messagingSenderId: "531340097112",
    appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  setPersistence(auth, browserLocalPersistence);

  const IMGBB_KEY = "52ddf1c2a5509391a0edcaadd1d02009";
  let userAtual = null;
  let postComentarioAtual = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('login.html'); return; }
    userAtual = user;
    const avatar = document.getElementById('userAvatar');
    if (user.photoURL) avatar.innerHTML = `<img src="${user.photoURL}">`;
    carregarPosts();
  });

  async function uploadImgBB(file) {
    const formData = new FormData();
    formData.append('image', file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
    const data = await res.json();
    return data.data.url;
  }

  window.criarPost = async () => {
    if (!userAtual) return;
    const texto = document.getElementById('textoPost').value.trim();
    const fileInput = document.getElementById('inputFotoPost');
    const btn = document.querySelector('.btn-publicar');
    if (!texto && !fileInput.files[0]) return;
    
    btn.textContent = 'A publicar...'; btn.disabled = true;
    try {
      let imgUrl = '';
      if (fileInput.files[0]) imgUrl = await uploadImgBB(fileInput.files[0]);
      await addDoc(collection(db, 'publicacoes'), {
        uid: userAtual.uid, nome: userAtual.displayName || 'Anônimo',
        foto: userAtual.photoURL || '', texto: texto, imagem: imgUrl, criadoEm: serverTimestamp()
      });
      document.getElementById('textoPost').value = '';
      fileInput.value = ''; document.getElementById('previewImagem').style.display = 'none';
      carregarPosts();
    } catch(e) { alert('Erro ao publicar: ' + e.message); }
    btn.textContent = 'Publicar'; btn.disabled = false;
  };

  async function carregarPosts() {
    const feed = document.getElementById('feedPosts');
    try {
      const q = query(collection(db, 'publicacoes'), orderBy('criadoEm', 'desc'), limit(10));
      const snap = await getDocs(q);
      feed.innerHTML = '';
      if(!snap.empty) {
          const title = document.createElement('div');
          title.style.cssText = 'margin:16px 0 10px;font-weight:bold;font-size:14px;color:var(--text-sub);border-bottom:1px solid var(--border);padding-bottom:8px';
          title.textContent = '📝 Publicações da Comunidade';
          feed.appendChild(title);
      }
      
      snap.forEach(d => {
        const p = d.data();
        const fotoHTML = p.foto ? `<img src="${p.foto}">` : (p.nome||'?').charAt(0);
        const dataFormatada = p.criadoEm ? new Date(p.criadoEm.seconds * 1000).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : 'Agora';
        
        const btnBaixarFoto = p.imagem ? `<a href="${p.imagem}" download="yuna_foto_${d.id}.jpg" style="margin-left:auto;color:var(--accent)"><i class="fas fa-download"></i> Baixar Foto</a>` : '';

        const post = document.createElement('div');
        post.className = 'post';
        post.innerHTML = `
          <div class="post-header" onclick="verPerfil('${p.uid}')">
            <div class="post-foto">${fotoHTML}</div>
            <div class="post-info"><h4>${p.nome}</h4><p>${dataFormatada}</p></div>
          </div>
          <div class="post-conteudo">${p.texto}</div>
          ${p.imagem ? `<img src="${p.imagem}" class="post-img">` : ''}
          <div class="post-acoes">
            <span onclick="abrirComentariosPost('${d.id}')"><i class="fas fa-comment"></i> Comentar</span>
            ${btnBaixarFoto}
          </div>
        `;
        feed.appendChild(post);
      });
    } catch(e) { console.log(e); }
  }

  window.verPerfil = async (uid) => {
    const modal = document.getElementById('modalPerfil');
    const div = document.getElementById('perfilConteudo');
    div.innerHTML = '<div class="spinner"></div>'; modal.classList.add('aberto');
    try {
      const docSnap = await getDoc(doc(db, 'ranking', uid));
      if (docSnap.exists()) {
        const u = docSnap.data();
        const foto = u.foto ? `<img src="${u.foto}">` : `<div style="width:80px;height:80px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;margin:0 auto 10px">${(u.nome||'?').charAt(0)}</div>`;
        div.innerHTML = `${foto}<h2>${u.nome}</h2><p>🏆 ${u.pontos || 0} pontos</p>`;
      } else { div.innerHTML = '<p style="color:var(--text-sub)">Perfil não encontrado.</p>'; }
    } catch(e) { div.innerHTML = '<p style="color:var(--text-sub)">Erro.</p>'; }
  };

  window.abrirComentariosPost = async (postId) => {
    postComentarioAtual = postId;
    document.getElementById('modalComentariosPost').classList.add('aberto');
    await carregarComentariosPost(postId);
  };

  async function carregarComentariosPost(postId) {
    const div = document.getElementById('listaComentariosPost');
    div.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sub)">Carregando...</div>';
    try {
      const q = query(collection(db, 'comentarios_posts'), where('postId', '==', postId));
      const snap = await getDocs(q);
      if (snap.empty) { div.innerHTML = '<p style="text-align:center;color:var(--text-sub)">Nenhum comentário.</p>'; return; }
      
      const lista = [];
      snap.forEach(d => lista.push({ id: d.id, ...d.data() }));
      lista.sort((a,b) => (a.criadoEm?.seconds||0) - (b.criadoEm?.seconds||0));
      div.innerHTML = '';
      
      lista.forEach(c => {
        const foto = c.foto ? `<img src="${c.foto}">` : (c.nome||'?').charAt(0);
        const el = document.createElement('div');
        el.className = 'comentario';
        el.innerHTML = `<div class="comentario-foto" onclick="verPerfil('${c.uid}')">${foto}</div><div class="comentario-info"><h5 onclick="verPerfil('${c.uid}')">${c.nome}</h5><p>${c.texto}</p></div>`;
        div.appendChild(el);
      });
    } catch(e) { div.innerHTML = '<p style="color:var(--text-sub)">Erro.</p>'; }
  }

  window.enviarComentarioPost = async () => {
    if (!userAtual || !postComentarioAtual) return;
    const input = document.getElementById('inputComentarioPost');
    const texto = input.value.trim(); if (!texto) return;
    try {
      await addDoc(collection(db, 'comentarios_posts'), {
        postId: postComentarioAtual, uid: userAtual.uid,
        nome: userAtual.displayName || 'Anônimo', foto: userAtual.photoURL || '',
        texto, criadoEm: serverTimestamp()
      });
      input.value = ''; carregarComentariosPost(postComentarioAtual);
    } catch(e) { alert('Erro: ' + e.message); }
  };
</script>
<script>
  // ========== VÍDEOS (SHORTS) ==========
  const YT_KEY = 'AIzaSyCpUuhzryLomoGzJ3lVIA7TTjJF5KfVd7s';
  let videosCarregados = false;

  window.iniciarVideos = async () => {
    if (videosCarregados) return;
    videosCarregados = true;
    const el = document.getElementById('telaVideos');
    el.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#fff"><div class="spinner"></div></div>';

    try {
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=humor%20%23shorts&type=video&videoDuration=short&maxResults=10&key=${YT_KEY}`;
      const r = await fetch(url);
      const d = await r.json();
      
      if (!d.items) { el.innerHTML = '<p style="color:#fff;text-align:center;padding:20px">Erro ao carregar vídeos.</p>'; return; }
      
      el.innerHTML = '';
      
      d.items.forEach(item => {
        if(!item.id.videoId) return;
        const vId = item.id.videoId;
        
        const slide = document.createElement('div');
        slide.className = 'video-slide';
        slide.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${vId}?autoplay=1&mute=1&controls=1&modestbranding=1&playsinline=1&rel=0&loop=1&playlist=${vId}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          
          <div class="acoes-laterais">
            <div class="acao" onclick="toggleLike('${vId}', this)">
              <div class="acao-btn"><i class="far fa-heart"></i></div><span>Curtir</span>
            </div>
            <div class="acao">
              <div class="acao-btn"><i class="fas fa-comment"></i></div><span>Comentar</span>
            </div>
            <div class="acao" onclick="baixarMidia('${vId}')">
              <div class="acao-btn"><i class="fas fa-download"></i></div><span>Baixar</span>
            </div>
          </div>
          <div class="overlay-video">
            <h4>@${item.snippet.channelTitle}</h4>
            <p>${item.snippet.title}</p>
          </div>
        `;
        el.appendChild(slide);
      });
    } catch(e) { console.log(e); }
  };

  window.toggleLike = (vId, el) => {
    const btn = el.querySelector('.acao-btn');
    const icone = el.querySelector('i');
    btn.classList.toggle('like-ativo');
    if(btn.classList.contains('like-ativo')) { icone.className = 'fas fa-heart'; } 
    else { icone.className = 'far fa-heart'; }
  };

  // ========== DOWNLOAD ==========
  const SERVIDORES_DOWNLOAD = [
    'https://pipedapi.adminforge.de', 'https://pipedapi.kavin.rocks',
    'https://api.piped.yt', 'https://pipedapi.projectsegfau.lt', 'https://pipedapi.nosebs.ru'
  ];

  window.baixarMidia = async (vId) => {
    const btn = event.currentTarget;
    const textoOriginal = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ...';
    btn.disabled = true;

    let linkDownload = '';

    for (let server of SERVIDORES_DOWNLOAD) {
      try {
        const res = await fetch(`${server}/streams/${vId}`);
        if (!res.ok) continue;
        const data = await res.json();
        
        if (data.videoStreams) {
          const mp4s = data.videoStreams.filter(v => v.mimeType.includes('mp4') && v.videoOnly === false);
          if (mp4s.length > 0) { linkDownload = mp4s[0].url; break; }
        }
      } catch (e) { console.log(`Servidor ${server} falhou.`); }
    }

    btn.innerHTML = textoOriginal;
    btn.disabled = false;

    if (linkDownload) {
      const a = document.createElement('a');
      a.href = linkDownload;
      a.target = '_blank';
      a.download = `yuna_${vId}.mp4`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      alert('❌ O YouTube bloqueou os servidores agora. Tenta novamente mais tarde.');
    }
  };

  // ========== NOTÍCIAS (WIKIPEDIA) ==========
  let termoPesquisaAtual = '';

  window.carregarInfoInicial = () => {
    if (document.getElementById('feedInfo').innerHTML !== '') return;
    carregarMaisInfo();
  };

  window.pesquisarInfo = () => {
    termoPesquisaAtual = document.getElementById('inputPesquisaInfo').value.trim();
    document.getElementById('feedInfo').innerHTML = ''; 
    carregarMaisInfo(); 
  };

  window.carregarMaisInfo = async () => {
    const feed = document.getElementById('feedInfo');
    const btn = document.getElementById('btnMaisInfo');
    btn.style.display = 'none';
    
    try {
      let url = '';
      if (termoPesquisaAtual) {
        url = `https://pt.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(termoPesquisaAtual)}&gsrlimit=5&prop=extracts|pageimages&exintro=&explaintext=&pithumbsize=500&format=json&origin=*`;
      } else {
        url = `https://pt.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&prop=extracts|pageimages&exintro=&explaintext=&pithumbsize=500&grnlimit=5&format=json&origin=*`;
      }

      const response = await fetch(url);
      const data = await response.json();

      if (data.query && data.query.pages) {
        const pages = Object.values(data.query.pages);
        
        if(!document.getElementById('titulo-noticias')) {
            const t = document.createElement('div');
            t.id = 'titulo-noticias';
            t.style.cssText = 'margin:16px 0 10px;font-weight:bold;font-size:14px;color:var(--text-sub);border-bottom:1px solid var(--border);padding-bottom:8px';
            t.textContent = termoPesquisaAtual ? '🌍 Resultados da Busca' : '🌍 Notícias e Informações';
            feed.appendChild(t);
        }

        pages.forEach(p => {
          if (!p.extract) return;
          const infoCard = document.createElement('div');
          infoCard.className = 'post';
          infoCard.innerHTML = `
            <div class="post-header">
              <div class="post-foto" style="background:#3b82f6;color:#fff"><i class="fas fa-globe"></i></div>
              <div class="post-info"><h4>Sabias que?</h4><p>${termoPesquisaAtual ? 'Busca' : 'Mundo'}</p></div>
            </div>
            ${p.thumbnail ? `<img src="${p.thumbnail.source}" class="post-img">` : ''}
            <div class="post-conteudo" style="font-weight:bold;font-size:16px;margin-bottom:8px">${p.title}</div>
            <div class="post-conteudo" style="font-size:13px;color:var(--text-sub)">${p.extract}</div>
            <div class="post-acoes">
              <a href="https://pt.wikipedia.org/?curid=${p.pageid}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:bold">Ler mais →</a>
            </div>
          `;
          feed.appendChild(infoCard);
        });
      }
      btn.style.display = 'block';
      btn.textContent = termoPesquisaAtual ? 'Ver mais resultados...' : 'Ver mais notícias 🌍';
    } catch(e) { btn.textContent = 'Erro. Tentar novamente'; btn.style.display = 'block'; }
  };
</script>
