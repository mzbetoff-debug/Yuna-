<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNA - Início</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== TEMAS ===== */
        :root { --fundo: #0a1428; --fundo-card: #0f1f3d; --texto: #ffffff; --texto-suave: #a0b8d8; --primaria: #3b82f6; --primaria-hover: #2563eb; --borda: #1e3a6f; }
        body.tema-azul { --fundo: #0a1428; --fundo-card: #0f1f3d; --texto: #ffffff; --texto-suave: #a0b8d8; --primaria: #3b82f6; --primaria-hover: #2563eb; --borda: #1e3a6f; }
        body.tema-roxo { --fundo: #0f0a1f; --fundo-card: #1a1033; --texto: #ffffff; --texto-suave: #b8b0d0; --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #2d1b4e; }
        body.tema-branco { --fundo: #f5f5f7; --fundo-card: #ffffff; --texto: #1a1a1a; --texto-suave: #555555; --primaria: #8b5cf6; --primaria-hover: #7c3aed; --borda: #e0e0e0; }
        body.tema-amarelo { --fundo: #1a1500; --fundo-card: #2a2000; --texto: #ffffff; --texto-suave: #d0c890; --primaria: #fbbf24; --primaria-hover: #f59e0b; --borda: #4a3a00; }

        /* ===== ESTILOS GERAIS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--fundo); color: var(--texto); transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
        
        /* ===== HEADER ===== */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--borda); background: var(--fundo); position: sticky; top: 0; z-index: 100; }
        .btn-header { background: transparent; border: 1px solid var(--borda); color: var(--texto); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .logo-header { color: var(--primaria); font-weight: 800; font-size: 24px; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        
        /* SINO DE NOTIFICAÇÃO */
        .btn-sino-container { position: relative; }
        .btn-sino { background: transparent; border: 1px solid var(--borda); color: var(--texto); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .notif-dot { position: absolute; top: 5px; right: 5px; width: 12px; height: 12px; background: #ef4444; border-radius: 50%; display: none; border: 2px solid var(--fundo); }
        .user-avatar-header { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--borda); object-fit: cover; }

        /* ===== ABAS ===== */
        .abas { display: flex; padding: 15px 20px; gap: 15px; max-width: 600px; margin: 0 auto; }
        .aba { flex: 1; padding: 12px; text-align: center; border: 1px solid var(--borda); border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px; color: var(--texto-suave); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .aba.ativa { background: var(--primaria); color: #fff; border-color: var(--primaria); }

        /* ===== CONTAINER ===== */
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }

        /* ===== CRIAR POST ===== */
        .criar-post-card { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .criar-post-card input[type="text"] { width: 100%; background: transparent; border: none; color: var(--texto); font-size: 16px; outline: none; margin-bottom: 20px; }
        .criar-post-acoes { display: flex; justify-content: space-between; align-items: center; }
        .btn-foto { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--borda); color: var(--texto-suave); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .btn-publicar { background: var(--primaria); color: #fff; border: none; padding: 10px 25px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; }

        /* ===== PESQUISA ===== */
        .pesquisa-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .pesquisa-container input { flex: 1; background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 15px; padding: 12px 15px; color: var(--texto); font-size: 15px; outline: none; }
        .btn-pesquisar { background: var(--primaria); color: #fff; border: none; width: 50px; border-radius: 15px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* ===== NOTÍCIAS ===== */
        .titulo-seccao { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .noticias-scroll { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; margin-bottom: 20px; scrollbar-width: none; }
        .noticias-scroll::-webkit-scrollbar { display: none; }
        .noticia-card { min-width: 260px; background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .noticia-card h4 { font-size: 14px; margin-bottom: 8px; }
        .noticia-card p { font-size: 12px; color: var(--texto-suave); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .noticia-card a { color: var(--primaria); font-size: 12px; text-decoration: none; font-weight: bold; }
        .badge-fonte { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; color: #fff; margin-bottom: 8px; width: fit-content; }

        /* ===== POSTS ===== */
        .post { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; margin-bottom: 15px; overflow: hidden; padding: 15px; }
        .post-header { display: flex; align-items: center; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 12px; cursor: pointer; border: 1px solid var(--borda); }
        .post-info { flex: 1; cursor: pointer; }
        .post-info h4 { font-size: 16px; font-weight: bold; }
        .post-info span { font-size: 12px; color: var(--texto-suave); }
        .btn-menu-pontos { background: none; border: none; color: var(--texto); font-size: 18px; cursor: pointer; }
        .post-content { margin-bottom: 15px; }
        .post-content p { margin-bottom: 10px; font-size: 15px; line-height: 1.4; }
        .post-img { width: 100%; border-radius: 15px; object-fit: cover; max-height: 400px; }
        .post-actions { display: flex; border-top: 1px solid var(--borda); padding-top: 15px; gap: 20px; }
        .action-btn { background: none; border: none; color: var(--texto-suave); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .action-btn.liked { color: #ef4444; }

        /* ===== VÍDEOS ===== */
        .video-feed { display: flex; flex-direction: column; gap: 15px; }
        .video-card { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 15px; overflow: hidden; cursor: pointer; }
        .video-thumb { width: 100%; height: 200px; object-fit: cover; }
        .video-info { padding: 15px; display: flex; align-items: center; gap: 10px; }
        .video-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
        .video-title { font-size: 14px; font-weight: bold; margin-bottom: 3px; }
        .video-channel { font-size: 12px; color: var(--texto-suave); }

        /* ===== NAVEGAÇÃO ===== */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--fundo-card); border-top: 1px solid var(--borda); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--texto-suave); font-size: 11px; gap: 5px; }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primaria); }

        /* ===== MODAIS ===== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: #0f1f3d; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--borda); max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #fff; }
        .modal-content h3 { margin-bottom: 15px; text-align: center; font-size: 20px; }
        
        .btn-salvar { width: 100%; padding: 12px; background: var(--primaria); color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 16px; }
        .btn-fechar { width: 100%; padding: 12px; background: #ef4444; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 16px; }
        .btn-ranking { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 10px; font-weight: bold; font-size: 16px; }
        .btn-chat { width: 100%; padding: 12px; background: #10b981; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 10px; font-weight: bold; font-size: 16px; }

        /* COMENTÁRIOS E RESPOSTAS */
        .lista-comentarios { max-height: 300px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .comentario-item { display: flex; flex-direction: column; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 14px; }
        .comentario-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .comentario-item strong { color: var(--primaria); }
        .btn-eliminar { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 14px; padding: 5px; }
        .btn-responder { background: none; border: none; color: var(--texto-suave); font-size: 12px; cursor: pointer; text-align: left; margin-top: 5px; text-decoration: underline; }
        .respostas-container { margin-top: 10px; margin-left: 15px; padding-left: 10px; border-left: 2px solid var(--borda); display: flex; flex-direction: column; gap: 8px; }
        .resposta-item { font-size: 13px; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; }
        #inputComentario { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--borda); background: #0a1428; color: #fff; outline: none; font-size: 15px; }
        .barra-resposta { display: none; background: rgba(59, 130, 246, 0.2); border: 1px solid var(--primaria); padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; justify-content: space-between; align-items: center; font-size: 13px; }
        .barra-resposta span { color: var(--primaria); font-weight: bold; }
        .cancelar-resposta { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; font-weight: bold; }

        /* NOTIFICAÇÕES E CORES */
        .notif-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; border-left: 4px solid var(--primaria); }
        .notif-item span { font-weight: bold; color: var(--primaria); }
        .cores-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; background: #0a1428; padding: 15px; border-radius: 10px; border: 1px solid var(--borda); }
        .cor-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .cor-btn[data-tema="roxo"] { background: #8b5cf6; }
        .cor-btn[data-tema="branco"] { background: #ffffff; border-color: #ccc; }
        .cor-btn[data-tema="azul"] { background: #3b82f6; }
        .cor-btn[data-tema="amarelo"] { background: #fbbf24; }
        .cor-btn.ativo { border-color: #fff; transform: scale(1.15); }
    </style>
</head>
<body class="tema-azul">

    <header>
        <button class="btn-header"><i class="fas fa-bars"></i></button>
        <div class="logo-header">YUNA</div>
        <div class="header-right">
            <div class="btn-sino-container">
                <button class="btn-sino" onclick="abrirNotificacoes()"><i class="fas fa-bell"></i></button>
                <div class="notif-dot" id="notifDot"></div>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" id="headerAvatar" class="user-avatar-header" alt="Perfil">
        </div>
    </header>

    <div class="abas">
        <div class="aba ativa" id="abaInicio" onclick="mudarAba('inicio')"><i class="fas fa-newspaper"></i> Início</div>
        <div class="aba" id="abaVideos" onclick="mudarAba('videos')"><i class="fas fa-film"></i> Vídeos</div>
    </div>

    <div class="container" id="secaoInicio">
        <h3 class="titulo-seccao">🗞️ Notícias e Informações</h3>
        <div class="noticias-scroll" id="noticiasContainer">
            <div class="noticia-card"><p><i class="fas fa-spinner fa-spin"></i> A carregar notícias...</p></div>
        </div>

        <div class="criar-post-card">
            <input type="text" id="inputTextoPost" placeholder="No que estás a pensar?">
            <input type="file" id="inputImagemPost" accept="image/*" style="display: none;" onchange="document.getElementById('nomeFoto').innerText = 'Foto Selecionada'">
            <div class="criar-post-acoes">
                <button class="btn-foto" onclick="document.getElementById('inputImagemPost').click()">
                    <i class="fas fa-camera"></i> <span id="nomeFoto">Foto</span>
                </button>
                <button class="btn-publicar" onclick="criarPost()">Publicar</button>
            </div>
        </div>

        <div class="pesquisa-container">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar notícias...">
            <button class="btn-pesquisar" onclick="pesquisarNoticias()"><i class="fas fa-search"></i></button>
        </div>
        
        <div id="resultadosNoticias"></div>

        <h3 class="titulo-seccao">📰 Publicações da Comunidade</h3>
        <div id="feedPosts"><p style="text-align:center; color:var(--texto-suave);">A carregar feed...</p></div>
    </div>

    <div class="container" id="secaoVideos" style="display: none;">
        <h3 class="titulo-seccao">🔥 Virais e Tendências</h3>
        <div class="video-feed" id="feedVideos">
            <div class="video-card" style="text-align:center; padding: 20px;">
                <p><i class="fas fa-spinner fa-spin"></i> A carregar vídeos...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="modalComentarios">
        <div class="modal-content">
            <h3>Comentários</h3>
            <div class="lista-comentarios" id="listaComentarios"></div>
            <div class="barra-resposta" id="barraResposta">
                <div>A responder a <span id="nomeResposta"></span></div>
                <button class="cancelar-resposta" onclick="cancelarResposta()">X</button>
            </div>
            <input type="text" id="inputComentario" placeholder="Escreve um comentário...">
            <button class="btn-salvar" onclick="adicionarComentario()">Enviar</button>
            <button class="btn-fechar" onclick="document.getElementById('modalComentarios').style.display='none'">Fechar</button>
        </div>
    </div>

    <div class="modal" id="modalNotificacoes">
        <div class="modal-content">
            <h3>Notificações</h3>
            <div id="listaNotificacoes" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn-fechar" onclick="document.getElementById('modalNotificacoes').style.display='none'">Fechar</button>
        </div>
    </div>

    <div class="modal" id="modalMenu">
        <div class="modal-content">
            <h3>Opções</h3>
            <div class="cores-container">
                <button class="cor-btn ativo" data-tema="azul"></button>
                <button class="cor-btn" data-tema="roxo"></button>
                <button class="cor-btn" data-tema="amarelo"></button>
                <button class="cor-btn" data-tema="branco"></button>
            </div>
            <button class="btn-ranking" onclick="verRanking()"><i class="fas fa-trophy"></i> Ver Ranking</button>
            <button class="btn-chat" onclick="abrirChat()"><i class="fas fa-comments"></i> Abrir Chat</button>
            <button class="btn-fechar" id="btnApagarPost" onclick="apagarPost()" style="display:none; background:#ef4444;"><i class="fas fa-trash"></i> Eliminar Publicação</button>
            <button class="btn-fechar" onclick="document.getElementById('modalMenu').style.display='none'" style="background:transparent; border:1px solid var(--borda); color:var(--texto);">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modalRanking">
        <div class="modal-content">
            <h3><i class="fas fa-trophy" style="color:gold;"></i> Ranking YUNA</h3>
            <div id="listaRanking" style="max-height: 200px; overflow-y: auto;"></div>
            <button class="btn-fechar" onclick="document.getElementById('modalRanking').style.display='none'">Fechar</button>
        </div>
    </div>

    <div class="modal" id="modalUserProfile">
        <div class="modal-content">
            <div style="text-align: center; margin-bottom: 15px;">
                <img id="modalUserAvatar" src="" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primaria); margin-bottom: 10px;">
                <h3 id="modalUserName" style="margin: 0;"></h3>
            </div>
            <h4 style="margin-bottom: 15px; color: var(--primaria); font-size: 16px;">Publicações:</h4>
            <div id="modalUserPosts" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn-fechar" onclick="document.getElementById('modalUserProfile').style.display='none'">Fechar</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="musica.html" class="nav-item"><i class="fas fa-music"></i><span>Música</span></a>
        <a href="animes.html" class="nav-item"><i class="fas fa-mask"></i><span>Animes</span></a>
        <a href="educacao.html" class="nav-item"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>
        <a href="perfil.html" class="nav-item"><i class="fas fa-user"></i><span>Perfil</span></a>
    </nav>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, arrayUnion, getDoc, getDocs, where, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
        authDomain: "yuna-8fe24.firebaseapp.com",
        projectId: "yuna-8fe24",
        storageBucket: "yuna-8fe24.firebasestorage.app",
        messagingSenderId: "531340097112",
        appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
    };
    const IMGBB_KEY = "52ddf1c2a5509391a0edcaadd1d02009";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let utilizadorAtual = null;
    let postAtualId = null; 
    let respondendoA = null;

    const TEMAS = ['azul', 'roxo', 'amarelo', 'branco'];
    function aplicarTema(tema) {
        TEMAS.forEach(t => document.body.classList.remove('tema-' + t));
        document.body.classList.add('tema-' + tema);
        localStorage.setItem('yuna-tema', tema);
        document.querySelectorAll('.cor-btn').forEach(btn => btn.classList.toggle('ativo', btn.dataset.tema === tema));
    }
    aplicarTema(localStorage.getItem('yuna-tema') || 'azul');
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.cor-btn').forEach(btn => btn.addEventListener('click', () => aplicarTema(btn.dataset.tema)));
    });

    setPersistence(auth, browserLocalPersistence).then(() => {
        onAuthStateChanged(auth, (user) => {
            if (user) {
                utilizadorAtual = user;
                const foto = user.photoURL || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                document.getElementById('headerAvatar').src = foto;
                
                carregarPosts();
                carregarNoticias(); 
                carregarVideos();   
                verificarNotificacoes(); 
            } else {
                window.location.href = "login.html";
            }
        });
    });

    window.mudarAba = function(aba) {
        document.getElementById('secaoInicio').style.display = aba === 'inicio' ? 'block' : 'none';
        document.getElementById('secaoVideos').style.display = aba === 'videos' ? 'block' : 'none';
        document.getElementById('abaInicio').classList.toggle('ativa', aba === 'inicio');
        document.getElementById('abaVideos').classList.toggle('ativa', aba === 'videos');
    };

    async function carregarNoticias() {
        const container = document.getElementById('noticiasContainer');
        let noticias = [];
        try {
            const wikiRes = await fetch('https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&generator=random&grnnamespace=0&grnlimit=2');
            const wikiData = await wikiRes.json();
            if (wikiData.query && wikiData.query.pages) {
                Object.values(wikiData.query.pages).forEach(p => {
                    noticias.push({ titulo: p.title, texto: p.extract ? p.extract.substring(0, 90) + '...' : 'Sem descrição.', link: `https://pt.wikipedia.org/?curid=${p.pageid}`, fonte: 'Wikipedia', cor: '#333' });
                });
            }
            const hnRes = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
            const hnIds = await hnRes.json();
            for (let i = 0; i < 2; i++) {
                const itemRes = await fetch(`https://hacker-news.firebaseio.com/v0/item/${hnIds[i]}.json`);
                const item = await itemRes.json();
                if (item.title) noticias.push({ titulo: item.title, texto: 'Notícia de tecnologia e inovação.', link: item.url || `https://news.ycombinator.com/item?id=${hnIds[i]}`, fonte: 'Tech', cor: '#ff6600' });
            }
            const spaceRes = await fetch('https://api.spaceflightnewsapi.net/v4/articles/?limit=2');
            const spaceData = await spaceRes.json();
            spaceData.results.forEach(artigo => {
                noticias.push({ titulo: artigo.title, texto: artigo.summary.substring(0, 90) + '...', link: artigo.url, fonte: 'Ciência', cor: '#0b3d91' });
            });

            container.innerHTML = '';
            noticias.sort(() => Math.random() - 0.5).forEach(n => {
                container.innerHTML += `
                    <div class="noticia-card">
                        <div><span class="badge-fonte" style="background:${n.cor};">${n.fonte}</span><h4>${n.titulo}</h4><p>${n.texto}</p></div>
                        <a href="${n.link}" target="_blank">Ler mais <i class="fas fa-external-link-alt"></i></a>
                    </div>
                `;
            });
        } catch (e) { container.innerHTML = '<div class="noticia-card"><p>Não foi possível carregar as notícias.</p></div>'; }
    }

    async function carregarVideos() {
        const container = document.getElementById('feedVideos');
        let todosVideos = [];
        try {
            const dmRes = await fetch('https://api.dailymotion.com/videos?fields=id,title,thumbnail_480_url,url,owner.screenname&limit=4&sort=trending');
            const dmData = await dmRes.json();
            dmData.list.forEach(video => {
                todosVideos.push({ titulo: video.title, thumb: video.thumbnail_480_url, link: video.url, canal: video['owner.screenname'] || 'Dailymotion', plataforma: 'Dailymotion', cor: '#0066ff', icone: 'fa-play' });
            });
            todosVideos.push({ titulo: 'Vídeo em Destaque no YouTube', thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg', link: 'https://youtube.com/watch?v=dQw4w9WgXcQ', canal: 'YouTube', plataforma: 'YouTube', cor: '#ff0000', icone: 'fa-youtube' });

            container.innerHTML = '';
            todosVideos.sort(() => Math.random() - 0.5).forEach(video => {
                container.innerHTML += `
                    <div class="video-card" onclick="window.open('${video.link}', '_blank')">
                        <img src="${video.thumb}" class="video-thumb">
                        <div class="video-info"><div class="video-icon" style="background:${video.cor};"><i class="fab ${video.icone}"></i></div><div><div class="video-title">${video.titulo}</div><div class="video-channel">${video.canal} • ${video.plataforma}</div></div></div>
                    </div>
                `;
            });
        } catch (e) { container.innerHTML = '<p style="text-align:center;">Erro ao carregar os vídeos.</p>'; }
    }
window.criarPost = async function() {
    const texto = document.getElementById('inputTextoPost').value;
    const fileInput = document.getElementById('inputImagemPost');
    const file = fileInput.files[0];
    if (!texto && !file) return alert("Escreve algo ou escolhe uma foto!");
    let urlImagem = "";

    try {
        if (file) {
            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
            const data = await res.json();
            if(data.success) urlImagem = data.data.url;
        }

        await addDoc(collection(db, "posts"), {
            uid: utilizadorAtual.uid, nomeUser: utilizadorAtual.displayName || "Membro YUNA", fotoUser: utilizadorAtual.photoURL || "", 
            texto: texto, imagem: urlImagem, likes: 0, comentarios: [], data: serverTimestamp()
        });
        document.getElementById('inputTextoPost').value = ''; fileInput.value = ''; document.getElementById('nomeFoto').innerText = 'Foto';
        alert("Publicado com sucesso!");
    } catch (error) { alert("Erro ao publicar."); }
}

function carregarPosts() {
    const q = query(collection(db, "posts"), orderBy("data", "desc"));
    onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feedPosts');
        feed.innerHTML = '';
        if(snapshot.empty) { feed.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Ainda não há publicações.</p>'; return; }

        snapshot.forEach((doc) => {
            const post = doc.data();
            const id = doc.id;
            const isDono = post.uid === utilizadorAtual.uid; 
            const fotoPost = post.fotoUser || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            const imagemHTML = post.imagem ? `<img src="${post.imagem}" class="post-img">` : '';
            const dataFormatada = post.data ? new Date(post.data.toDate()).toLocaleString() : 'Agora';

            feed.innerHTML += `
                <div class="post">
                    <div class="post-header">
                        <img src="${fotoPost}" class="post-avatar" onclick="abrirPerfilUsuario('${post.uid}', '${post.nomeUser}', '${fotoPost}')">
                        <div class="post-info" onclick="abrirPerfilUsuario('${post.uid}', '${post.nomeUser}', '${fotoPost}')"><h4>${post.nomeUser || 'Utilizador'}</h4><span>${dataFormatada}</span></div>
                        <button class="btn-menu-pontos" onclick="abrirMenu('${id}', ${isDono})"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                    <div class="post-content"><p>${post.texto}</p>${imagemHTML}</div>
                    <div class="post-actions">
                        <button class="action-btn" id="btn-like-${id}" onclick="darLike('${id}')"><i class="fas fa-heart"></i> <span id="like-count-${id}">${post.likes || 0}</span> Likes</button>
                        <button class="action-btn" onclick="abrirComentarios('${id}')"><i class="fas fa-comment"></i> ${post.comentarios ? post.comentarios.length : 0} Comentários</button>
                    </div>
                </div>
            `;
        });
    });
}

window.darLike = async function(id) {
    await updateDoc(doc(db, "posts", id), { likes: increment(1) });
    document.getElementById(`btn-like-${id}`).classList.add('liked');
}

window.abrirComentarios = function(id) {
    postAtualId = id; cancelarResposta(); document.getElementById('modalComentarios').style.display = 'flex';
    onSnapshot(doc(db, "posts", postAtualId), (docSnap) => {
        const lista = document.getElementById('listaComentarios');
        const comentarios = docSnap.data().comentarios || [];
        lista.innerHTML = '';
        if (comentarios.length === 0) { lista.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Nenhum comentário.</p>'; return; }

        comentarios.forEach((c, index) => {
            const commentId = c.id || index; 
            const btnApagar = (c.uid === utilizadorAtual.uid) ? `<button class="btn-eliminar" onclick="apagarComentario(${index})"><i class="fas fa-trash"></i></button>` : '';
            let respostasHTML = '';
            if (c.respostas && c.respostas.length > 0) {
                respostasHTML = `<div class="respostas-container">`;
                c.respostas.forEach(r => respostasHTML += `<div class="resposta-item"><strong>${r.nome}:</strong> ${r.texto}</div>`);
                respostasHTML += `</div>`;
            }
            lista.innerHTML += `
                <div class="comentario-item">
                    <div class="comentario-header"><div><strong>${c.nome}:</strong> ${c.texto}</div>${btnApagar}</div>
                    <button class="btn-responder" onclick="prepararResposta('${commentId}', '${c.nome}')"><i class="fas fa-reply"></i> Responder</button>
                    ${respostasHTML}
                </div>
            `;
        });
    });
}

window.prepararResposta = function(commentId, nome) {
    respondendoA = { id: commentId, nome: nome };
    document.getElementById('barraResposta').style.display = 'flex';
    document.getElementById('nomeResposta').innerText = nome;
    document.getElementById('inputComentario').focus();
}

window.cancelarResposta = function() {
    respondendoA = null; document.getElementById('barraResposta').style.display = 'none'; document.getElementById('inputComentario').value = '';
}

window.adicionarComentario = async function() {
    const texto = document.getElementById('inputComentario').value;
    if (!texto) return;

    const postRef = doc(db, "posts", postAtualId);
    const docSnap = await getDoc(postRef);
    let comentarios = docSnap.data().comentarios || [];

    if (respondendoA) {
        const index = comentarios.findIndex(c => c.id == respondendoA.id || comentarios.indexOf(c) == respondendoA.id);
        if (index !== -1) {
            if (!comentarios[index].respostas) comentarios[index].respostas = [];
            comentarios[index].respostas.push({ uid: utilizadorAtual.uid, nome: utilizadorAtual.displayName || "Membro", texto: texto });
            await updateDoc(postRef, { comentarios: comentarios });
            if (comentarios[index].uid !== utilizadorAtual.uid) {
                await addDoc(collection(db, "notificacoes"), { userId: comentarios[index].uid, deQuem: utilizadorAtual.displayName || "Alguém", texto: `respondeu ao teu comentário: "${texto}"`, lida: false, data: serverTimestamp() });
            }
        }
        cancelarResposta();
    } else {
        const novoComentario = { id: Date.now().toString(), uid: utilizadorAtual.uid, nome: utilizadorAtual.displayName || "Membro", texto: texto, respostas: [] };
        await updateDoc(postRef, { comentarios: arrayUnion(novoComentario) });
        if (docSnap.data().uid !== utilizadorAtual.uid) {
            await addDoc(collection(db, "notificacoes"), { userId: docSnap.data().uid, deQuem: utilizadorAtual.displayName || "Alguém", texto: `comentou na tua publicação: "${texto}"`, lida: false, data: serverTimestamp() });
        }
    }
    document.getElementById('inputComentario').value = '';
}

window.apagarComentario = async function(index) {
    if (confirm("Apagar este comentário?")) {
        const docSnap = await getDoc(doc(db, "posts", postAtualId));
        const comentarios = docSnap.data().comentarios;
        comentarios.splice(index, 1);
        await updateDoc(doc(db, "posts", postAtualId), { comentarios: comentarios });
    }
}        function verificarNotificacoes() {
            const q = query(collection(db, "notificacoes"), where("userId", "==", utilizadorAtual.uid), where("lida", "==", false));
            onSnapshot(q, (snapshot) => {
                document.getElementById('notifDot').style.display = !snapshot.empty ? 'block' : 'none';
            });
        }

        window.abrirNotificacoes = async function() {
            document.getElementById('notifDot').style.display = 'none';
            document.getElementById('modalNotificacoes').style.display = 'flex';
            const lista = document.getElementById('listaNotificacoes');
            lista.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A carregar...</p>';

            const q = query(collection(db, "notificacoes"), where("userId", "==", utilizadorAtual.uid), orderBy("data", "desc"));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) { lista.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Não tens notificações.</p>'; return; }

            lista.innerHTML = '';
            querySnapshot.forEach(async (documento) => {
                const n = documento.data();
                lista.innerHTML += `<div class="notif-item"><span>${n.deQuem}</span> ${n.texto}</div>`;
                if (n.lida === false) await updateDoc(doc(db, "notificacoes", documento.id), { lida: true });
            });
        }

        window.abrirMenu = function(id, isDono) {
            postAtualId = id; document.getElementById('modalMenu').style.display = 'flex'; document.getElementById('btnApagarPost').style.display = isDono ? 'block' : 'none';
        }

        window.apagarPost = async function() {
            if (confirm("Apagar esta publicação?")) { await deleteDoc(doc(db, "posts", postAtualId)); document.getElementById('modalMenu').style.display = 'none'; }
        }

        window.abrirChat = function() { document.getElementById('modalMenu').style.display = 'none'; alert("🚀 O Chat da YUNA estará disponível muito em breve!"); }

        window.verRanking = async function() {
            document.getElementById('modalMenu').style.display = 'none'; document.getElementById('modalRanking').style.display = 'flex';
            const lista = document.getElementById('listaRanking'); lista.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A calcular...</p>';
            const querySnapshot = await getDocs(collection(db, "posts"));
            let contagem = {};
            querySnapshot.forEach((doc) => { const post = doc.data(); if(post.nomeUser) contagem[post.nomeUser] = (contagem[post.nomeUser] || 0) + 1; });
            const arrayRanking = Object.keys(contagem).map(nome => ({ nome: nome, pontos: contagem[nome] }));
            arrayRanking.sort((a, b) => b.pontos - a.pontos);
            lista.innerHTML = '';
            arrayRanking.forEach((user, index) => {
                let medalha = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '🏅';
                lista.innerHTML += `<div class="comentario-item"><span>${medalha} ${index+1}º ${user.nome}</span> <span>${user.pontos} posts</span></div>`;
            });
        }

        window.abrirPerfilUsuario = async function(uid, nome, foto) {
            document.getElementById('modalUserProfile').style.display = 'flex';
            document.getElementById('modalUserAvatar').src = foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            document.getElementById('modalUserName').innerText = nome || 'Utilizador';
            const containerPosts = document.getElementById('modalUserPosts');
            containerPosts.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A carregar...</p>';
            const q = query(collection(db, "posts"), where("uid", "==", uid));
            const querySnapshot = await getDocs(q);
            if (querySnapshot.empty) { containerPosts.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Este utilizador ainda não fez publicações.</p>'; return; }
            let postsDoUser = []; querySnapshot.forEach((doc) => postsDoUser.push(doc.data()));
            postsDoUser.sort((a, b) => b.data.toMillis() - a.data.toMillis());
            containerPosts.innerHTML = '';
            postsDoUser.forEach(post => {
                let imgHTML = post.imagem ? `<img src="${post.imagem}" style="width:100%; border-radius:8px; margin-top:8px; max-height:150px; object-fit:cover;">` : '';
                containerPosts.innerHTML += `
                    <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--borda);">
                        <p style="margin-bottom: 5px; font-size: 14px;">${post.texto}</p>${imgHTML}
                        <span style="font-size: 11px; color: var(--texto-suave); display:block; margin-top:5px;"><i class="far fa-clock"></i> ${new Date(post.data.toDate()).toLocaleDateString()}</span>
                    </div>
                `;
            });
        }

        window.pesquisarNoticias = async function() {
            const termo = document.getElementById('inputPesquisa').value;
            const container = document.getElementById('resultadosNoticias');
            if(!termo) { container.innerHTML = ''; return; }
            container.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A procurar...</p>';
            try {
                const res = await fetch(`https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&generator=search&gsrsearch=${encodeURIComponent(termo)}&gsrlimit=3`);
                const data = await res.json();
                if(data.query && data.query.pages) {
                    container.innerHTML = '';
                    Object.values(data.query.pages).forEach(p => {
                        let texto = p.extract ? p.extract.substring(0, 100) + '...' : 'Sem descrição.';
                        container.innerHTML += `
                            <div class="noticia-card" style="min-width:100%; margin-bottom:10px;">
                                <h4>${p.title}</h4><p>${texto}</p>
                                <a href="https://pt.wikipedia.org/?curid=${p.pageid}" target="_blank" style="color:var(--primaria); text-decoration:none; font-weight:bold;">Ler na Wikipedia <i class="fas fa-external-link-alt"></i></a>
                            </div>
                        `;
                    });
                } else { container.innerHTML = '<p style="text-align:center; color:var(--texto-suave);">Nenhuma notícia encontrada.</p>'; }
            } catch(e) { container.innerHTML = '<p style="text-align:center; color:red;">Erro ao pesquisar notícias.</p>'; }
        }
    </script>
