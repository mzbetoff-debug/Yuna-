<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNA - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0a1428; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #0f1f3d; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #1e3a6f; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #3b82f6; margin-bottom: 25px; font-size: 32px; font-weight: 800; letter-spacing: 1px; }
        
        /* CAMPOS DE TEXTO */
        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #1e3a6f; background: #0a1428; color: #fff; box-sizing: border-box; outline: none; font-size: 15px; }
        
        /* BOTÕES AZUIS */
        .btn-principal { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        .btn-principal:hover { background: #2563eb; }

        /* BOTÃO DO GOOGLE */
        .btn-google { width: 100%; padding: 12px; background: #ffffff; color: #333; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 15px; }
        .btn-google:hover { background: #f1f1f1; }
        .btn-google img { width: 20px; height: 20px; }

        /* LINKS DE MUDANÇA DE ECRÃ (LOGIN / CRIAR CONTA) */
        .link-mudar { font-size: 14px; color: #a0b8d8; cursor: pointer; margin-top: 10px; display: inline-block; }
        .link-mudar:hover { color: #fff; text-decoration: underline; }
        .link-mudar span { color: #3b82f6; font-weight: bold; }
        
        #mensagem { margin-top: 15px; font-size: 14px; color: #ef4444; font-weight: bold; }

        /* ESCONDER O ECRÃ DE REGISTO INICIALMENTE */
        #ecraRegisto { display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>YUNA</h1>

        <!-- ECRÃ 1: FAZER LOGIN -->
        <div id="ecraLogin">
            <input type="email" id="login-email" placeholder="O teu e-mail">
            <input type="password" id="login-senha" placeholder="A tua palavra-passe">
            <button class="btn-principal" onclick="entrar()">Entrar</button>

            <button class="btn-google" onclick="entrarComGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar com Google
            </button>

            <div id="msg-login" style="color: #ef4444; font-size: 14px; margin-bottom: 10px;"></div>

            <div class="link-mudar" onclick="mostrarRegisto()">Ainda não tens conta? <span>Cria uma aqui</span></div>
        </div>

        <!-- ECRÃ 2: CRIAR CONTA -->
        <div id="ecraRegisto">
            <input type="text" id="reg-nome" placeholder="O teu nome ou apelido">
            <input type="email" id="reg-email" placeholder="Escolhe um e-mail">
            <input type="password" id="reg-senha" placeholder="Cria uma palavra-passe">
            
            <button class="btn-principal" onclick="registar()">Criar a minha conta</button>
            
            <div id="msg-registo" style="color: #ef4444; font-size: 14px; margin-bottom: 10px;"></div>

            <div class="link-mudar" onclick="mostrarLogin()">Já tens conta? <span>Entra aqui</span></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ AS TUAS CHAVES DO FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
            authDomain: "yuna-8fe24.firebaseapp.com",
            projectId: "yuna-8fe24",
            storageBucket: "yuna-8fe24.firebasestorage.app",
            messagingSenderId: "531340097112",
            appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Manter sessão no telemóvel
        setPersistence(auth, browserLocalPersistence).then(() => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.href = "home.html";
                }
            });
        });

        // 🔄 FUNÇÕES PARA TROCAR DE ECRÃ
        window.mostrarRegisto = function() {
            document.getElementById('ecraLogin').style.display = 'none';
            document.getElementById('ecraRegisto').style.display = 'block';
        }

        window.mostrarLogin = function() {
            document.getElementById('ecraRegisto').style.display = 'none';
            document.getElementById('ecraLogin').style.display = 'block';
        }

        // 1. FUNÇÃO ENTRAR (ECRÃ DE LOGIN)
        window.entrar = function() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            const msg = document.getElementById('msg-login');

            if(!email || !senha) { msg.innerText = "Preenche o e-mail e a palavra-passe."; return; }
            msg.style.color = "#3b82f6";
            msg.innerText = "A entrar...";

            signInWithEmailAndPassword(auth, email, senha)
                .then(() => { window.location.href = "home.html"; })
                .catch((error) => { 
                    msg.style.color = "#ef4444";
                    msg.innerText = "E-mail ou palavra-passe incorretos."; 
                });
        }

        // 2. FUNÇÃO REGISTAR (ECRÃ DE CRIAR CONTA)
        window.registar = function() {
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const senha = document.getElementById('reg-senha').value;
            const msg = document.getElementById('msg-registo');

            if(!nome || !email || !senha) { msg.innerText = "Preenche todos os campos acima."; return; }
            msg.style.color = "#3b82f6";
            msg.innerText = "A criar a tua conta...";

            createUserWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    // Guardar o Nome no perfil da pessoa
                    return updateProfile(userCredential.user, { displayName: nome });
                })
                .then(() => {
                    alert("Conta criada com sucesso!");
                    window.location.href = "home.html";
                })
                .catch((error) => { 
                    msg.style.color = "#ef4444";
                    if (error.code === 'auth/email-already-in-use') {
                        msg.innerText = "Este e-mail já está a ser usado.";
                    } else if (error.code === 'auth/weak-password') {
                        msg.innerText = "A senha deve ter pelo menos 6 caracteres.";
                    } else {
                        msg.innerText = "Erro: " + error.message; 
                    }
                });
        }

        // 3. FUNÇÃO ENTRAR COM GOOGLE
        window.entrarComGoogle = function() {
            const provider = new GoogleAuthProvider();
            const msg = document.getElementById('msg-login');
            msg.style.color = "#3b82f6"; 
            msg.innerText = "A ligar ao Google...";

            signInWithPopup(auth, provider)
                .then(() => { window.location.href = "home.html"; })
                .catch((error) => {
                    console.error(error);
                    msg.style.color = "#ef4444";
                    msg.innerText = "Erro ao ligar ao Google.";
                });
        }
    </script>
</body>
</html>
