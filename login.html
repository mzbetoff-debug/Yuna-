<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUNA - Atualização V1</title>
  <!-- Fonte e Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0B0914;
      /* Efeito de estrelas e gradiente de fundo */
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(228, 77, 140, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(75, 93, 240, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(159, 77, 228, 0.1) 0%, transparent 60%);
      background-attachment: fixed;
      color: #ffffff;
      padding: 20px;
    }

    /* Pequenos pontos brancos para simular estrelas */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(1px 1px at 10% 10%, white, transparent),
        radial-gradient(1px 1px at 30% 40%, white, transparent),
        radial-gradient(1px 1px at 70% 20%, white, transparent),
        radial-gradient(1.5px 1.5px at 80% 60%, white, transparent),
        radial-gradient(1px 1px at 40% 80%, white, transparent),
        radial-gradient(1px 1px at 60% 90%, white, transparent);
      background-size: 200px 200px;
      opacity: 0.3;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Logo YUNA */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #F14B8B, #9B51E0);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(228, 77, 140, 0.4);
    }

    .logo-icon i {
      font-size: 28px;
      color: white;
    }

    .logo-text {
      text-align: left;
    }

    .logo-text h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(to right, #9B51E0, #4B5DF0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .logo-text span {
      font-size: 11px;
      letter-spacing: 3px;
      color: #A0A0B0;
      text-transform: uppercase;
    }

    /* Descrição */
    .description {
      font-size: 15px;
      color: #D1D1D6;
      line-height: 1.5;
      margin-bottom: 30px;
      padding: 0 10px;
    }

    /* Área do Contador */
    .countdown-wrapper {
      width: 100%;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 15px;
      backdrop-filter: blur(10px);
    }

    .countdown-title {
      font-size: 13px;
      color: #A0A0B0;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 12px;
      min-width: 70px;
      border: 1px solid rgba(159, 77, 228, 0.3);
      box-shadow: inset 0 0 10px rgba(159, 77, 228, 0.1);
    }

    .time-box span {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .time-box small {
      font-size: 11px;
      color: #A0A0B0;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Botões */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-bottom: 20px;
      text-decoration: none;
    }

    .btn:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .btn-discord {
      background: #4B5DF0;
      box-shadow: 0 8px 20px rgba(75, 93, 240, 0.3);
    }

    /* Redes Sociais */
    .socials {
      display: flex;
      gap: 12px;
      margin-top: 5px;
      margin-bottom: 30px;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A0A0B0;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .social-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transform: translateY(-2px);
    }

    /* Footer */
    .footer {
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .footer i {
      color: #E44D8C;
      font-size: 10px;
    }

    /* Efeito concluído */
    .finished .time-box {
      border-color: #16a34a;
      box-shadow: inset 0 0 15px rgba(22, 163, 74, 0.2);
    }
    .finished .time-box span {
      color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-icon">
        <i class="fa-regular fa-compass"></i>
      </div>
      <div class="logo-text">
        <h1>YUNA</h1>
        <span>SEU UNIVERSO</span>
      </div>
    </div>

    <!-- Texto de descrição -->
    <p class="description">
      Explore filmes, séries, músicas, animes e educação em um só lugar. Descubra, aprenda e conecte-se com o que você ama. 🚀
    </p>

    <!-- Contador Regressivo -->
    <div class="countdown-wrapper" id="countdown-container">
      <div class="countdown-title">A nova atualização da V1 chega em:</div>
      <div class="countdown-timer">
        <div class="time-box"><span id="days">00</span><small>Dias</small></div>
        <div class="time-box"><span id="hours">00</span><small>Horas</small></div>
        <div class="time-box"><span id="minutes">00</span><small>Min</small></div>
        <div class="time-box"><span id="seconds">00</span><small>Seg</small></div>
      </div>
    </div>

    <!-- Botão Discord (Principal) -->
    <a href="https://discord.gg/vSuvKTJxS" target="_blank" class="btn btn-discord">
      <i class="fa-brands fa-discord"></i> Entrar no Discord
    </a>

    <!-- Ícones Sociais -->
    <div class="socials">
      <a href="https://discord.gg/vSuvKTJxS" target="_blank" class="social-icon"><i class="fa-brands fa-discord"></i></a>
      <a href="#" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
      <a href="#" class="social-icon"><i class="fa-brands fa-whatsapp"></i></a>
      <a href="#" class="social-icon"><i class="fa-brands fa-github"></i></a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <i class="fa-solid fa-heart"></i> YUNA © 2025 · Versão 1.0
    </div>

  </div>

  <script>
    (function () {
      const SETE_DIAS_MS = 7 * 24 * 60 * 60 * 1000; // 7 dias em milissegundos
      const CHAVE = "yuna_v1_countdown";
      
      // Pega a data final salva ou define uma nova (agora + 7 dias)
      let dataFinal = Number(localStorage.getItem(CHAVE));
      if (!dataFinal || isNaN(dataFinal)) {
        dataFinal = Date.now() + SETE_DIAS_MS;
        localStorage.setItem(CHAVE, String(dataFinal));
      }

      const elDias = document.getElementById("days");
      const elHoras = document.getElementById("hours");
      const elMinutos = document.getElementById("minutes");
      const elSegundos = document.getElementById("seconds");
      const container = document.getElementById("countdown-container");

      let intervalo = null;

      function atualizarContagem() {
        const restante = dataFinal - Date.now();

        // Se o tempo acabar
        if (restante <= 0) {
          container.classList.add("finished");
          container.querySelector('.countdown-title').innerHTML = "<strong>Atualização Disponível!</strong>";
          elDias.textContent = "00";
          elHoras.textContent = "00";
          elMinutos.textContent = "00";
          elSegundos.textContent = "00";
          clearInterval(intervalo);
          return;
        }

        const dias = Math.floor(restante / (24 * 60 * 60 * 1000));
        const horas = Math.floor((restante % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
        const minutos = Math.floor((restante % (60 * 60 * 1000)) / (60 * 1000));
        const segundos = Math.floor((restante % (60 * 1000)) / 1000);

        // Formata com zero à esquerda
        elDias.textContent = String(dias).padStart(2, '0');
        elHoras.textContent = String(horas).padStart(2, '0');
        elMinutos.textContent = String(minutos).padStart(2, '0');
        elSegundos.textContent = String(segundos).padStart(2, '0');
      }

      // Inicia
      atualizarContagem();
      intervalo = setInterval(atualizarContagem, 1000);
    })();
  </script>

</body>
</html>
