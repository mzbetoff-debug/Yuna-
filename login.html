<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNA - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0a1428; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #0f1f3d; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #1e3a6f; text-align: center; }
        h1 { color: #3b82f6; margin-bottom: 20px; font-size: 32px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #1e3a6f; background: #0a1428; color: #fff; box-sizing: border-box; outline: none; }
        
        /* BOTÕES */
        button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .btn-registo { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
        
        /* BOTÃO DO GOOGLE */
        .btn-google { background: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-google:hover { background: #f1f1f1; }
        .btn-google img { width: 20px; height: 20px; }

        /* DIVISOR "OU" */
        .divisor { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #a0b8d8; font-size: 14px; }
        .divisor::before, .divisor::after { content: ''; flex: 1; border-bottom: 1px solid #1e3a6f; }
        .divisor::before { margin-right: 10px; }
        .divisor::after { margin-left: 10px; }

        #mensagem { margin-top: 15px; font-size: 14px; color: #ef4444; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>YUNA</h1>
        
        <!-- FORMULÁRIO TRADICIONAL -->
        <input type="email" id="email" placeholder="O teu e-mail">
        <input type="password" id="password" placeholder="A tua palavra-passe">
        <button onclick="entrar()">Entrar</button>
        <button class="btn-registo" onclick="registar()">Criar Conta</button>

        <!-- DIVISOR -->
        <div class="divisor">OU</div>

        <!-- BOTÃO DO GOOGLE -->
        <button class="btn-google" onclick="entrarComGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Continuar com Google
        </button>

        <div id="mensagem"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // Adicionado o GoogleAuthProvider e signInWithPopup
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ AS TUAS CHAVES DO FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
            authDomain: "yuna-8fe24.firebaseapp.com",
            projectId: "yuna-8fe24",
            storageBucket: "yuna-8fe24.firebasestorage.app",
            messagingSenderId: "531340097112",
            appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Forçar a persistência da sessão no telemóvel
        setPersistence(auth, browserLocalPersistence).then(() => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.href = "home.html";
                }
            });
        });

        // Função de Entrar Tradicional
        window.entrar = function() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            const msg = document.getElementById('mensagem');

            if(!email || !senha) { msg.innerText = "Preenche o e-mail e a palavra-passe."; return; }
            msg.innerText = "A entrar...";

            signInWithEmailAndPassword(auth, email, senha)
                .then(() => {
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    msg.innerText = "Erro: E-mail ou palavra-passe incorretos.";
                });
        }

        // Função de Registar Tradicional
        window.registar = function() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            const msg = document.getElementById('mensagem');

            if(!email || !senha) { msg.innerText = "Preenche o e-mail e a palavra-passe."; return; }
            msg.innerText = "A criar conta...";

            createUserWithEmailAndPassword(auth, email, senha)
                .then(() => {
                    alert("Conta criada com sucesso!");
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    msg.innerText = "Erro: " + error.message;
                });
        }

        // 🔥 FUNÇÃO DE ENTRAR COM O GOOGLE
        window.entrarComGoogle = function() {
            const provider = new GoogleAuthProvider();
            const msg = document.getElementById('mensagem');
            msg.innerText = "A ligar ao Google...";

            signInWithPopup(auth, provider)
                .then((result) => {
                    // O utilizador entrou com sucesso!
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    console.error(error);
                    msg.innerText = "Erro ao entrar com Google.";
                });
        }
    </script>
</body>
</html>
