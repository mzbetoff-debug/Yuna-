<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>YUNA · Entrar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{background:#0a0e1a;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
body{background:linear-gradient(135deg,#0a0e1a 0%,#1a1f35 100%);display:flex;justify-content:center;align-items:center;padding:20px;min-height:100vh}
.login-card{width:100%;max-width:420px;background:rgba(18,24,42,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:28px;padding:36px 28px 32px;box-shadow:0 30px 60px rgba(0,0,0,.7);position:relative;overflow:hidden;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-card::before{content:'';position:absolute;top:-40%;right:-20%;width:280px;height:280px;background:radial-gradient(circle,rgba(236,72,153,.25),transparent 70%);filter:blur(50px);pointer-events:none}
.login-card::after{content:'';position:absolute;bottom:-40%;left:-20%;width:280px;height:280px;background:radial-gradient(circle,rgba(139,92,246,.25),transparent 70%);filter:blur(50px);pointer-events:none}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;position:relative;z-index:2}
.login-logo i{font-size:32px;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.login-title{text-align:center;font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:6px;position:relative;z-index:2}
.login-sub{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:28px;position:relative;z-index:2}
.input-group{position:relative;margin-bottom:14px;z-index:2}
.input-group i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#64748b;font-size:15px}
.input-group input{width:100%;padding:14px 16px 14px 44px;background:rgba(0,0,0,.3);border:1px solid #334155;border-radius:14px;color:#e2e8f0;font-size:14px;outline:none;transition:.3s}
.input-group input:focus{border-color:#a78bfa;background:rgba(0,0,0,.45)}
.input-group input::placeholder{color:#64748b}
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,#ec4899,#8b5cf6);border:none;color:#fff;border-radius:14px;font-weight:600;font-size:15px;cursor:pointer;transition:.2s;box-shadow:0 4px 15px rgba(236,72,153,.3);margin-top:6px;z-index:2;position:relative}
.btn-primary:active{transform:scale(.97)}
.divider{display:flex;align-items:center;gap:12px;color:#64748b;font-size:12px;margin:22px 0 18px;position:relative;z-index:2}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#293241}
.social-btn{width:100%;padding:14px;background:rgba(255,255,255,.04);border:1px solid #334155;border-radius:14px;color:#e2e8f0;font-weight:500;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s;margin-bottom:10px;position:relative;z-index:2}
.social-btn:active{background:rgba(255,255,255,.08);transform:scale(.98)}
.social-btn img{width:20px;height:20px}
.social-btn .fa-google{color:#ea4335}
.social-btn .fa-facebook{color:#1877f2}
.social-btn .fa-github{color:#f1f5f9}
.login-footer{text-align:center;color:#94a3b8;font-size:13px;margin-top:20px;position:relative;z-index:2}
.login-footer a{color:#a78bfa;text-decoration:none;font-weight:600;cursor:pointer}
.error-msg{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:14px;display:none;position:relative;z-index:2}
.error-msg.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.profile-view{display:none;text-align:center;position:relative;z-index:2}
.profile-view.show{display:block;animation:fadeIn .4s ease}
.profile-avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#8b5cf6);padding:3px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.profile-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.profile-name{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.profile-email{font-size:13px;color:#94a3b8;margin-bottom:24px}
.profile-stats{display:flex;justify-content:space-around;background:rgba(0,0,0,.3);border-radius:16px;padding:16px;margin-bottom:20px}
.stat-item{text-align:center}
.stat-value{font-size:20px;font-weight:800;background:linear-gradient(135deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:#94a3b8;margin-top:2px}
.btn-logout{width:100%;padding:14px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn-logout:active{background:rgba(239,68,68,.25);transform:scale(.98)}
.loading{display:none;text-align:center;padding:40px 0;position:relative;z-index:2}
.loading.show{display:block}
.spinner{width:44px;height:44px;border:3px solid rgba(167,139,250,.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#94a3b8;font-size:13px}
</style>
</head>
<body>

<div class="login-card">

  <div id="viewLoggedOut">
    <div class="login-logo">
      <i class="fas fa-compass"></i>
      <h1>YUNA</h1>
    </div>
    <div class="login-title">Bem-vindo de volta</div>
    <div class="login-sub">Entre para continuar sua jornada</div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="input-group">
      <i class="fas fa-envelope"></i>
      <input type="email" id="emailInput" placeholder="Email">
    </div>
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input type="password" id="passwordInput" placeholder="Senha">
    </div>
    <button class="btn-primary" id="emailLoginBtn">
      <i class="fas fa-sign-in-alt"></i> Entrar
    </button>
    <div class="divider">ou continue com</div>
    <button class="social-btn" id="googleLoginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continuar com Google
    </button>
    <button class="social-btn" onclick="alert('🔵 Login com Facebook em breve!')">
      <i class="fab fa-facebook"></i> Continuar com Facebook
    </button>
    <button class="social-btn" onclick="alert('⚫ Login com GitHub em breve!')">
      <i class="fab fa-github"></i> Continuar com GitHub
    </button>
    <div class="login-footer">
      Não tem conta? <a onclick="alert('📝 Cadastro em breve!')">Criar conta</a>
    </div>
  </div>

  <div class="loading" id="loadingView">
    <div class="spinner"></div>
    <p>Entrando...</p>
  </div>

  <div class="profile-view" id="viewLoggedIn">
    <div class="profile-avatar">
      <img id="userPhoto" src="https://via.placeholder.com/90" alt="Avatar">
    </div>
    <div class="profile-name" id="userName">Usuário</div>
    <div class="profile-email" id="userEmail">email@exemplo.com</div>
    <div class="profile-stats">
      <div class="stat-item"><div class="stat-value">128</div><div class="stat-label">Favoritos</div></div>
      <div class="stat-item"><div class="stat-value">42</div><div class="stat-label">Assistidos</div></div>
      <div class="stat-item"><div class="stat-value">15</div><div class="stat-label">Listas</div></div>
    </div>
    <button class="btn-primary" onclick="window.location.href='index.html'">
      <i class="fas fa-home"></i> Ir para o YUNA
    </button>
    <button class="btn-logout" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> Sair da conta
    </button>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider, 
    onAuthStateChanged,
    signOut,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWVJ_KoMFsi2Gb08",
    authDomain: "yuna-8fe24.firebaseapp.com",
    projectId: "yuna-8fe24",
    storageBucket: "yuna-8fe24.firebasestorage.app",
    messagingSenderId: "531340097112",
    appId: "1:531340097112:web:a5f077f9c0f81b36953c2d",
    measurementId: "G-C5F1CXB0SC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const viewLoggedOut = document.getElementById('viewLoggedOut');
  const viewLoggedIn = document.getElementById('viewLoggedIn');
  const loadingView = document.getElementById('loadingView');
  const errorMsg = document.getElementById('errorMsg');

  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const emailLoginBtn = document.getElementById('emailLoginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), 5000);
  }

  function showLoading() {
    viewLoggedOut.style.display = 'none';
    viewLoggedIn.classList.remove('show');
    loadingView.classList.add('show');
  }

  function hideLoading() {
    loadingView.classList.remove('show');
  }

  googleLoginBtn.addEventListener('click', () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        console.log('✅ Login Google:', result.user.displayName);
      })
      .catch((error) => {
        console.error('Erro Google:', error.code);
        if (error.code === 'auth/unauthorized-domain') {
          showError('⚠️ Domínio não autorizado no Firebase.');
        } else if (error.code === 'auth/popup-closed-by-user') {
          showError('Login cancelado.');
        } else if (error.code === 'auth/popup-blocked') {
          showError('Popup bloqueado. Permita popups.');
        } else {
          showError('Erro ao entrar: ' + error.message);
        }
      });
  });

  emailLoginBtn.addEventListener('click', () => {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();

    if (!email || !password) {
      showError('Preencha email e senha.');
      return;
    }

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        console.log('✅ Login email:', userCredential.user.email);
      })
      .catch((error) => {
        console.error('Erro email:', error.code);
        if (error.code === 'auth/user-not-found') {
          showError('Usuário não encontrado.');
        } else if (error.code === 'auth/wrong-password') {
          showError('Senha incorreta.');
        } else if (error.code === 'auth/invalid-email') {
          showError('Email inválido.');
        } else if (error.code === 'auth/operation-not-allowed') {
          showError('Login por email não está ativado no Firebase.');
        } else if (error.code === 'auth/invalid-credential') {
          showError('Email ou senha incorretos.');
        } else {
          showError('Erro: ' + error.message);
        }
      });
  });

  logoutBtn.addEventListener('click', () => {
    if (confirm('Deseja realmente sair?')) {
      signOut(auth)
        .then(() => console.log('👋 Logout'))
        .catch((err) => console.error('Erro logout:', err));
    }
  });

  onAuthStateChanged(auth, (user) => {
    hideLoading();
    
    if (user) {
      viewLoggedOut.style.display = 'none';
      viewLoggedIn.classList.add('show');
      
      document.getElementById('userPhoto').src = user.photoURL || 'https://via.placeholder.com/90';
      document.getElementById('userName').textContent = user.displayName || 'Usuário';
      document.getElementById('userEmail').textContent = user.email || '';
      
      console.log('👤 Usuário logado:', user.displayName);
    } else {
      viewLoggedOut.style.display = 'block';
      viewLoggedIn.classList.remove('show');
      
      console.log('🔓 Nenhum usuário logado');
    }
  });
</script>

</body>
  </html>
