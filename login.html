<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>YUNA · Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* ===== RESET E FUNDO ESTRELADO ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body { 
        background-color: #0d0914; 
        /* Efeito de estrelas e brilho roxo no fundo */
        background-image: 
            radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 10% 10%, rgba(255,255,255,0.2) 1px, transparent 1px),
            radial-gradient(circle at 80% 20%, rgba(255,255,255,0.2) 1px, transparent 1px),
            radial-gradient(circle at 40% 70%, rgba(255,255,255,0.1) 1px, transparent 1px),
            radial-gradient(circle at 90% 80%, rgba(255,255,255,0.2) 1px, transparent 1px),
            radial-gradient(circle at 20% 90%, rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 100% 100%, 100px 100px, 150px 150px, 120px 120px, 180px 180px, 200px 200px;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
    }

    /* ===== LOGOTIPO ===== */
    .logo-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }
    
    .logo-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #f472b6, #8b5cf6);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
        color: #fff;
        box-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
        transform: rotate(-5deg);
    }

    .logo-text {
        display: flex;
        flex-direction: column;
    }

    .logo-text h1 {
        font-size: 42px;
        font-weight: 900;
        color: #6b8cff; /* Azul claro do logotipo */
        margin: 0;
        letter-spacing: 2px;
        line-height: 1;
    }

    .logo-text span {
        font-size: 11px;
        color: #a0a0a0;
        letter-spacing: 3px;
        font-weight: 600;
        margin-top: 5px;
    }

    /* ===== TEXTO DE APRESENTAÇÃO ===== */
    .welcome-text {
        text-align: center;
        font-size: 16px;
        color: #d1d5db;
        line-height: 1.6;
        margin-bottom: 40px;
        max-width: 350px;
    }

    /* ===== BOTÕES PRINCIPAIS ===== */
    .btn-principal {
        width: 100%;
        max-width: 350px;
        padding: 18px;
        border-radius: 25px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #fff;
        margin-bottom: 15px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-principal:active {
        transform: scale(0.95);
    }

    /* Botão de Aventura (Rosa/Roxo) */
    .btn-aventura {
        background: linear-gradient(90deg, #f472b6, #a78bfa);
        box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
    }

    /* Botão do Discord (Azul) */
    .btn-discord {
        background: #5865F2;
        box-shadow: 0 0 20px rgba(88, 101, 242, 0.3);
    }

    /* Texto do "ou" */
    .divisor {
        color: #6b7280;
        font-size: 14px;
        margin: 10px 0 20px 0;
        font-style: italic;
    }

    /* ===== ÍCONES SOCIAIS ===== */
    .social-icons {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        margin-bottom: 40px;
    }

    .social-btn {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #9ca3af;
        text-decoration: none;
        transition: 0.2s;
    }

    .social-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
    }

    /* ===== FOOTER ===== */
    .footer {
        position: absolute;
        bottom: 30px;
        font-size: 12px;
        color: #6b7280;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .footer i {
        color: #f472b6;
    }

    /* ===== FORMULÁRIO DE LOGIN (ESCAMOTEADO POR DEFEITO) ===== */
    .login-form {
        display: none; /* Escondido até clicar no botão de aventura */
        width: 100%;
        max-width: 350px;
        flex-direction: column;
        gap: 15px;
        margin-top: 20px;
    }

    .login-form input {
        width: 100%;
        padding: 15px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: 16px;
        outline: none;
    }

    .login-form input::placeholder {
        color: #9ca3af;
    }

    .btn-entrar {
        background: #f472b6;
        color: #fff;
        padding: 15px;
        border-radius: 15px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-google {
        background: #fff;
        color: #333;
        padding: 15px;
        border-radius: 15px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
    }
    
    .btn-google img { width: 20px; }

    .btn-voltar {
        background: transparent;
        border: none;
        color: #9ca3af;
        margin-top: 15px;
        cursor: pointer;
        text-decoration: underline;
    }
</style>
</head>
<body>

    <!-- LOGOTIPO -->
    <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-compass"></i></div>
        <div class="logo-text">
            <h1>YUNA</h1>
            <span>SEU UNIVERSO</span>
        </div>
    </div>

    <!-- TEXTO INICIAL -->
    <div class="welcome-text" id="telaInicial">
        Explore filmes, séries, músicas, animes e<br>educação em um só lugar.<br>
        Descubra, aprenda e conecte-se com o que<br>você ama. 🚀
    </div>

    <!-- BOTÕES INICIAIS -->
    <div id="botoesIniciais" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <button class="btn-principal btn-aventura" onclick="mostrarFormulario()">
            <i class="fas fa-play-circle"></i> Começar sua aventura
        </button>
        
        <div class="divisor">ou entre na comunidade</div>
        
        <button class="btn-principal btn-discord" onclick="alert('Link do Discord em breve!')">
            <i class="fab fa-discord"></i> Entrar no Discord
        </button>
    </div>

    <!-- FORMULÁRIO DE LOGIN (APARECE AO CLICAR EM AVENTURA) -->
    <div class="login-form" id="formLogin">
        <input type="email" id="email" placeholder="O teu e-mail">
        <input type="password" id="password" placeholder="A tua palavra-passe">
        <div id="mensagemErro" style="color: #ef4444; font-size: 14px; text-align: center; display: none;"></div>
        
        <button class="btn-entrar" onclick="entrarComEmail()">Entrar</button>
        
        <button class="btn-google" onclick="entrarComGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Continuar com Google
        </button>
        
        <button class="btn-voltar" onclick="voltarInicio()">Voltar</button>
    </div>

    <!-- ÍCONES SOCIAIS -->
    <div class="social-icons">
        <a href="#" class="social-btn"><i class="fab fa-discord"></i></a>
        <a href="#" class="social-btn"><i class="fab fa-youtube"></i></a>
        <a href="#" class="social-btn"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="social-btn"><i class="fab fa-github"></i></a>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <i class="fas fa-heart"></i> YUNA © 2026 · Versão 1.0
    </div>

    <!-- FIREBASE V8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // A TUA CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
            authDomain: "yuna-8fe24.firebaseapp.com",
            projectId: "yuna-8fe24",
            storageBucket: "yuna-8fe24.firebasestorage.app",
            messagingSenderId: "531340097112",
            appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();

        // Manter sessão
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // Se o utilizador já estiver logado, vai direto para o home
                    window.location.href = "home.html";
                }
            });
        });

        // Lógica de mostrar/esconder o formulário
        function mostrarFormulario() {
            document.getElementById('telaInicial').style.display = 'none';
            document.getElementById('botoesIniciais').style.display = 'none';
            document.getElementById('formLogin').style.display = 'flex';
        }

        function voltarInicio() {
            document.getElementById('telaInicial').style.display = 'block';
            document.getElementById('botoesIniciais').style.display = 'flex';
            document.getElementById('formLogin').style.display = 'none';
            document.getElementById('mensagemErro').style.display = 'none';
        }

        // 1. LOGIN COM E-MAIL
        function entrarComEmail() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            const msgErro = document.getElementById('mensagemErro');

            if (!email || !senha) {
                msgErro.innerText = "Preenche o e-mail e a palavra-passe.";
                msgErro.style.display = 'block';
                return;
            }

            msgErro.style.display = 'none';

            auth.signInWithEmailAndPassword(email, senha)
                .then(() => {
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    msgErro.innerText = "Erro: E-mail ou palavra-passe incorretos.";
                    msgErro.style.display = 'block';
                });
        }

        // 2. LOGIN COM GOOGLE
        function entrarComGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            const msgErro = document.getElementById('mensagemErro');
            
            msgErro.style.color = "#3b82f6";
            msgErro.innerText = "A ligar ao Google...";
            msgErro.style.display = 'block';

            auth.signInWithPopup(provider)
                .then(() => {
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    console.error(error);
                    msgErro.style.color = "#ef4444";
                    msgErro.innerText = "Erro ao ligar ao Google.";
                });
        }
    </script>
</body>
</html>
