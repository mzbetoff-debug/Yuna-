<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNA - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0a1428; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #0f1f3d; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #1e3a6f; text-align: center; }
        h1 { color: #3b82f6; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #1e3a6f; background: #0a1428; color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        button:hover { background: #2563eb; }
        .btn-registo { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
        #mensagem { margin-top: 15px; font-size: 14px; color: #ef4444; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>YUNA</h1>
        <input type="email" id="email" placeholder="O teu e-mail">
        <input type="password" id="password" placeholder="A tua palavra-passe">
        <button onclick="entrar()">Entrar</button>
        <button class="btn-registo" onclick="registar()">Criar Conta</button>
        <div id="mensagem"></div>
    </div>

    <!-- FIREBASE VERSÃO 8 (A MESMA DO HOME.HTML) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // ⚠️ AS TUAS CHAVES DO FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyA7KUJeJDrU8fIbJnZCWYJ_KoMfsi2Gb08",
            authDomain: "yuna-8fe24.firebaseapp.com",
            projectId: "yuna-8fe24",
            storageBucket: "yuna-8fe24.firebasestorage.app",
            messagingSenderId: "531340097112",
            appId: "1:531340097112:web:a5f077f9c0f81b36953c2d"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();

        // 🔥 FORÇAR O TELEMÓVEL A LEMBRAR-SE DO LOGIN
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
            
            // Se o utilizador já estiver logado, manda-o logo para o home
            auth.onAuthStateChanged(user => {
                if (user) {
                    window.location.href = "home.html";
                }
            });

        }).catch(error => console.error("Erro na persistência:", error));

        // FUNÇÃO DE ENTRAR
        function entrar() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            const msg = document.getElementById('mensagem');

            if(!email || !senha) { msg.innerText = "Preenche o e-mail e a palavra-passe."; return; }
            msg.innerText = "A entrar...";

            auth.signInWithEmailAndPassword(email, senha)
                .then(() => {
                    // Login com sucesso! Vai para o home.
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    msg.innerText = "Erro: E-mail ou palavra-passe incorretos.";
                    console.error(error);
                });
        }

        // FUNÇÃO DE REGISTAR
        function registar() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            const msg = document.getElementById('mensagem');

            if(!email || !senha) { msg.innerText = "Preenche o e-mail e a palavra-passe."; return; }
            msg.innerText = "A criar conta...";

            auth.createUserWithEmailAndPassword(email, senha)
                .then(() => {
                    alert("Conta criada com sucesso!");
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    msg.innerText = "Erro: " + error.message;
                    console.error(error);
                });
        }
    </script>
</body>
</html>
