<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>YUNA · Animes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --bg: #0a0e1a; --card-bg: rgba(18,24,42,.7); --text-main: #f1f5f9; --text-sub: #94a3b8; --accent: #f472b6; --accent-gradient: linear-gradient(135deg,#f472b6,#a78bfa); --nav-bg: rgba(10,14,26,.98); --border: rgba(255,255,255,.06); }
body.theme-branco { --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --accent: #8b5cf6; --accent-gradient: linear-gradient(135deg,#8b5cf6,#ec4899); --nav-bg: #ffffff; --border: rgba(0,0,0,.1); }
body.theme-azul { --bg: #0f172a; --card-bg: rgba(30,41,59,.8); --text-main: #f8fafc; --text-sub: #94a3b8; --accent: #38bdf8; --accent-gradient: linear-gradient(135deg,#38bdf8,#0ea5e9); --nav-bg: #0f172a; --border: rgba(56,189,248,.2); }
body.theme-amarelo { --bg: #000000; --card-bg: rgba(20,20,20,.9); --text-main: #fef08a; --text-sub: #ca8a04; --accent: #facc15; --accent-gradient: linear-gradient(135deg,#facc15,#eab308); --nav-bg: #000000; --border: rgba(250,204,21,.2); }

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition: background 0.3s, color 0.3s, border-color 0.3s;}
html,body{background:var(--bg);color:var(--text-main);min-height:100vh;scroll-behavior:smooth;}
body{padding-bottom:80px}

.header{position:sticky;top:0;z-index:100;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.menu-btn{width:40px;height:40px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-main);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logo-text{font-size:20px;font-weight:900;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:12px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--border);text-decoration:none;color:#fff}
.user-avatar img{width:100%;height:100%;object-fit:cover}

.tabs-info{display:flex;gap:8px;padding:16px;overflow-x:auto;border-bottom:1px solid var(--border)}
.tab-info{flex:1;text-align:center;padding:10px 16px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);color:var(--text-sub);font-size:13px;font-weight:700;cursor:pointer}
.tab-info.active{background:var(--accent-gradient);color:#fff;border:none}

.rec-box{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:20px;margin:16px;text-align:center}
.rec-box h2{font-size:18px;margin-bottom:10px;color:var(--accent)}
.rec-box p{font-size:13px;color:var(--text-sub);margin-bottom:15px}
.upload-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent-gradient);color:#fff;padding:12px 24px;border-radius:25px;font-weight:bold;cursor:pointer;border:none;font-size:15px}
.preview-img-rec{width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin-top:15px;display:none}
.resultado-rec{margin-top:20px;text-align:left}
.rec-item{background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;margin-bottom:10px;border-left:4px solid var(--accent)}
.rec-item h4{font-size:15px;margin-bottom:5px}
.rec-item p{font-size:12px;color:var(--text-sub);margin-bottom:3px}

.search-container{display:flex;gap:8px;padding:0 16px 16px}
.search-container input{flex:1;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);outline:none}
.search-container button{padding:0 20px;border-radius:12px;border:none;background:var(--accent-gradient);color:#fff;font-weight:bold;cursor:pointer}

.feed{padding:0 16px}
.anime-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:16px;display:flex;gap:12px;cursor:pointer}
.anime-card img{width:100px;height:140px;object-fit:cover;border-radius:10px;flex-shrink:0}
.anime-info{flex:1}
.anime-info h4{font-size:15px;margin-bottom:5px}
.anime-info p{font-size:12px;color:var(--text-sub);margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.anime-info .score{font-weight:bold;color:#fbbf24;font-size:13px}
.anime-info .episodios{font-size:12px;color:var(--text-sub)}

.btn-carregar-mais{width:calc(100% - 32px); margin: 0 16px 20px; padding: 15px; background:var(--card-bg); border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; display: none;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:flex-end}
.modal.aberto{display:flex}
.modal-content{width:100%;background:var(--bg);border-radius:24px 24px 0 0;max-height:85vh;overflow-y:auto;padding:20px;border-top:1px solid var(--border)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-close{background:var(--card-bg);border:none;color:var(--text-main);width:32px;height:32px;border-radius:50%;cursor:pointer}

.trailer-container{position:relative;width:100%;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;margin-bottom:15px;background:#000}
.trailer-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

.comentario{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);flex-direction:column}
.comentario-header{display:flex;gap:10px;align-items:center}
.comentario-foto{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;flex-shrink:0;overflow:hidden}
.comentario-foto img{width:100%;height:100%;object-fit:cover}
.comentario-info h5{font-size:13px;font-weight:bold;color:var(--text-main);margin-bottom:2px}
.comentario-info p{font-size:13px;color:var(--text-sub);line-height:1.4}
.sentimento-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold;margin-left:5px}
.sent-positivo{background:rgba(16,185,129,.2);color:#10b981}
.sent-negativo{background:rgba(239,68,68,.2);color:#ef4444}

.input-comentario{display:flex;gap:8px;margin-top:16px;flex-direction:column}
.input-comentario-linha{display:flex;gap:8px;align-items:center}
.input-comentario input{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:12px 16px;color:var(--text-main);outline:none}
.input-comentario button{background:var(--accent-gradient);border:none;border-radius:50%;width:44px;height:44px;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
.sentimento-seletor{display:flex;gap:10px;margin-bottom:10px}
.sent-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);cursor:pointer;font-weight:bold;font-size:13px;text-align:center}
.sent-btn.ativo-positivo{background:#10b981;color:#fff;border-color:#10b981}
.sent-btn.ativo-negativo{background:#ef4444;color:#fff;border-color:#ef4444}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:997}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-sub);font-size:10px;text-decoration:none;flex:1}
.nav-item i{font-size:20px}
.nav-item.active{color:var(--accent)}
</style>
</head>
<body class="theme-padrao">

<header class="header">
  <button class="menu-btn" onclick="window.location.href='home.html'"><i class="fas fa-bars"></i></button>
  <div class="logo-text">YUNA ANIMES</div>
  <div class="header-right">
    <a class="user-avatar" href="perfil.html" id="userAvatar"><i class="fas fa-user"></i></a>
  </div>
</header>

<div class="tabs-info">
  <div class="tab-info active" id="tabReconhecer" onclick="mudarAba('reconhecer')">📸 Reconhecer Anime</div>
  <div class="tab-info" id="tabCatalogo" onclick="mudarAba('catalogo')">📚 Catálogo</div>
</div>

<div id="aba-reconhecer">
  <div class="rec-box">
    <h2><i class="fas fa-robot"></i> Reconhecimento do anime</h2>
    <p>Envie uma imagem e a YUNA dirá o anime correspondente.
<center><h3>⚠️</h3>
<h4>atenção ao enviar imagens da internet podem aver falhas o recomendado que seja do episódio </h4></center>
</p>
    <input type="file" id="inputImagemAnime" accept="image/*" style="display:none" onchange="processarImagemAnime(this)">
    <button class="upload-btn" onclick="document.getElementById('inputImagemAnime').click()">
      <i class="fas fa-cloud-upload-alt"></i> Escolher Imagem
    </button>
    <img id="previewRec" class="preview-img-rec">
    <div id="resultadoReconhecimento" class="resultado-rec"></div>
  </div>
</div>

<div id="aba-catalogo" style="display:none;">
  <div class="search-container">
    <input type="text" id="inputPesquisaAnime" placeholder="Pesquisar anime..." onkeypress="if(event.key==='Enter') pesquisarAnime()">
    <button onclick="pesquisarAnime()"><i class="fas fa-search"></i></button>
  </div>
  <div class="feed" id="listaAnimes"></div>
  <button class="btn-carregar-mais" id="btnCarregarMais" onclick="carregarMaisAnimes()">Carregar Mais Animes</button>
</div>

<div class="modal" id="modalAnime" onclick="if(event.target===this)this.classList.remove('aberto')">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalAnimeTitulo">Anime</h3>
      <button class="modal-close" onclick="document.getElementById('modalAnime').classList.remove('aberto')"><i class="fas fa-times"></i></button>
    </div>
    <div id="modalAnimeDetalhes" style="margin-bottom:20px;"></div>
    
    <h4 style="margin-bottom:10px; color:var(--accent);"><i class="fas fa-comments"></i> Comentários</h4>
    <div id="listaComentariosAnime"></div>
    
    <div class="input-comentario">
      <div class="sentimento-seletor">
        <button class="sent-btn" id="btnSentPos" onclick="selecionarSentimento('positivo')">👍 Positivo</button>
        <button class="sent-btn" id="btnSentNeg" onclick="selecionarSentimento('negativo')">👎 Negativo</button>
      </div>
      <div class="input-comentario-linha">
        <input type="text" id="inputComentarioAnime" placeholder="Escreve o teu comentário...">
        <button onclick="enviarComentarioAnime()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">

  <a class="nav-item active" href="animes.html"><i class="fas fa-dragon"></i><span>Animes</span></a>
  <a class="nav-item" href="educacao.html"><i class="fas fa-graduation-cap"></i><span>Educação</span></a>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
  // ================= SISTEMA DE TEMAS =================
  (function() {
    const temaSalvo = localStorage.getItem('yuna_theme') || 'padrao';
    document.body.className = 'theme-' + temaSalvo;
  })();

  let paginaAtual = 0;
  let aCarregar = false;

  function mudarAba(aba) {
    document.getElementById('aba-reconhecer').style.display = aba === 'reconhecer' ? 'block' : 'none';
    document.getElementById('aba-catalogo').style.display = aba === 'catalogo' ? 'block' : 'none';
    document.getElementById('tabReconhecer').classList.toggle('active', aba === 'reconhecer');
    document.getElementById('tabCatalogo').classList.toggle('active', aba === 'catalogo');
    
    if(aba === 'catalogo') {
      const lista = document.getElementById('listaAnimes');
      if (lista.innerHTML === '') {
        paginaAtual = 0;
        carregarAnimesAPI();
      }
    }
  }

  // ==========================================
  // CATÁLOGO COM A API KITSU
  // ==========================================
  async function carregarAnimesAPI() {
    if (aCarregar) return;
    aCarregar = true;
    
    const lista = document.getElementById('listaAnimes');
    const btnMais = document.getElementById('btnCarregarMais');
    btnMais.style.display = 'none';

    if (paginaAtual === 0) {
      lista.innerHTML = '<p style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> A ligar à API...</p>';
    } else {
      btnMais.innerText = 'A carregar mais...';
    }

    const offset = paginaAtual * 20;

    try {
      const res = await fetch(`https://kitsu.io/api/edge/anime?page[limit]=20&page[offset]=${offset}&sort=-averageRating`);
      const data = await res.json();
      
      if (paginaAtual === 0) lista.innerHTML = '';

      if (data.data && data.data.length > 0) {
        data.data.forEach(anime => {
          const attrs = anime.attributes;
          const titulo = attrs.titles.en || attrs.titles.en_jp || attrs.canonicalTitle;
          const imagem = attrs.posterImage ? attrs.posterImage.medium : 'https://via.placeholder.com/100x140?text=Sem+Foto';
          const eps = attrs.episodeCount || '?';
          const score = attrs.averageRating ? (parseFloat(attrs.averageRating) / 10).toFixed(1) : 'N/A';
          
          lista.innerHTML += `
            <div class="anime-card" onclick="abrirDetalhesAPI('${anime.id}')">
              <img src="${imagem}" alt="${titulo}">
              <div class="anime-info">
                <h4>${titulo}</h4>
                <p class="episodios">${eps} eps</p>
                <p class="score"><i class="fas fa-star"></i> ${score}</p>
              </div>
            </div>
          `;
        });

        btnMais.style.display = 'block';
        btnMais.innerText = 'Carregar Mais Animes';
      }
    } catch(e) {
      if (paginaAtual === 0) lista.innerHTML = '<p style="text-align:center; color:#ef4444; padding:20px;">Erro ao ligar à API.</p>';
    } finally {
      aCarregar = false;
    }
  }

  window.carregarMaisAnimes = function() {
    paginaAtual++;
    carregarAnimesAPI();
  };

  // ==========================================
  // PESQUISA NA API
  // ==========================================
  window.pesquisarAnime = async function() {
    const termo = document.getElementById('inputPesquisaAnime').value.trim();
    if (!termo) {
      paginaAtual = 0;
      return carregarAnimesAPI();
    }
    
    const lista = document.getElementById('listaAnimes');
    const btnMais = document.getElementById('btnCarregarMais');
    btnMais.style.display = 'none';
    lista.innerHTML = '<p style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> A procurar...</p>';
    
    try {
      const res = await fetch(`https://kitsu.io/api/edge/anime?filter[text]=${encodeURIComponent(termo)}&page[limit]=20`);
      const data = await res.json();
      lista.innerHTML = '';
      
      if (data.data && data.data.length > 0) {
        data.data.forEach(anime => {
          const attrs = anime.attributes;
          const titulo = attrs.titles.en || attrs.titles.en_jp || attrs.canonicalTitle;
          const imagem = attrs.posterImage ? attrs.posterImage.medium : 'https://via.placeholder.com/100x140?text=Sem+Foto';
          const eps = attrs.episodeCount || '?';
          const score = attrs.averageRating ? (parseFloat(attrs.averageRating) / 10).toFixed(1) : 'N/A';
          
          lista.innerHTML += `
            <div class="anime-card" onclick="abrirDetalhesAPI('${anime.id}')">
              <img src="${imagem}" alt="${titulo}">
              <div class="anime-info">
                <h4>${titulo}</h4>
                <p class="episodios">${eps} eps</p>
                <p class="score"><i class="fas fa-star"></i> ${score}</p>
              </div>
            </div>
          `;
        });
      } else {
        lista.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-sub);">Nenhum anime encontrado.</p>';
      }
    } catch(e) {
      lista.innerHTML = '<p style="text-align:center; color:#ef4444; padding:20px;">Erro na pesquisa.</p>';
    }
  };

  // ==========================================
  // DETALHES E TRAILER
  // ==========================================
  window.abrirDetalhesAPI = async function(id) {
    const detalhes = document.getElementById('modalAnimeDetalhes');
    detalhes.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A carregar detalhes...</p>';
    document.getElementById('modalAnime').classList.add('aberto');
    
    try {
      const res = await fetch(`https://kitsu.io/api/edge/anime/${id}`);
      const data = await res.json();
      const attrs = data.data.attributes;
      
      const titulo = attrs.titles.en || attrs.titles.en_jp || attrs.canonicalTitle;
      document.getElementById('modalAnimeTitulo').innerText = titulo;
      
      const imagem = attrs.coverImage ? attrs.coverImage.large : attrs.posterImage.large;
      
      let trailerHTML = '';
      if (attrs.youtubeVideoId) {
        trailerHTML = `
          <div class="trailer-container">
            <iframe src="https://www.youtube.com/embed/${attrs.youtubeVideoId}" allowfullscreen></iframe>
          </div>
        `;
      }

      detalhes.innerHTML = `
        ${trailerHTML}
        <img src="${imagem}" style="width:100%; max-height:250px; object-fit:cover; border-radius:12px; margin-bottom:10px;">
        <p style="font-size:13px; color:var(--text-sub); line-height: 1.5;">${attrs.synopsis || 'Sem sinopse.'}</p>
        <p style="margin-top:10px; font-size:13px;"><strong>Episódios:</strong> ${attrs.episodeCount || '?'} | <strong>Score:</strong> ${attrs.averageRating ? (parseFloat(attrs.averageRating) / 10).toFixed(1) : 'N/A'}</p>
      `;
      
      carregarComentariosAnime(id);
    } catch(e) {
      detalhes.innerHTML = `<p style="text-align:center; color:#ef4444;">Erro ao carregar os detalhes.</p>`;
    }
  };

  // ==========================================
  // RECONHECIMENTO DE IMAGEM COM AUTO-CROP MELHORADO
  // ==========================================
  async function comprimirImagem(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => resolve(new File([blob], "temp.jpg", { type: "image/jpeg" })), 'image/jpeg', 0.8);
        };
      };
    });
  }

  async function recortarBordasPretas(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const maxScan = 400;
        const scale = Math.min(maxScan / img.width, maxScan / img.height, 1);
        const scanWidth = Math.floor(img.width * scale);
        const scanHeight = Math.floor(img.height * scale);
        
        const canvas = document.createElement('canvas');
        canvas.width = scanWidth;
        canvas.height = scanHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, scanWidth, scanHeight);
        
        const data = ctx.getImageData(0, 0, scanWidth, scanHeight).data;
        const threshold = 60; // AUMENTADO para apanhar cinzentos escuros (ex: #333333)
        
        let top = 0, left = 0, right = scanWidth - 1, bottom = scanHeight - 1;
        
        function rowIsBlack(y) {
          for (let x = 0; x < scanWidth; x++) {
            const i = (y * scanWidth + x) * 4;
            if (data[i] >= threshold || data[i+1] >= threshold || data[i+2] >= threshold) return false;
          }
          return true;
        }
        function colIsBlack(x) {
          for (let y = 0; y < scanHeight; y++) {
            const i = (y * scanWidth + x) * 4;
            if (data[i] >= threshold || data[i+1] >= threshold || data[i+2] >= threshold) return false;
          }
          return true;
        }

        while (top < bottom && rowIsBlack(top)) top++;
        while (bottom > top && rowIsBlack(bottom)) bottom--;
        while (left < right && colIsBlack(left)) left++;
        while (right > left && colIsBlack(right)) right--;
        
        const origTop = Math.floor(top / scale);
        const origBottom = Math.ceil(bottom / scale);
        const origLeft = Math.floor(left / scale);
        const origRight = Math.ceil(right / scale);
        
        if (origRight <= origLeft || origBottom <= origTop) {
          resolve(file); return;
        }
        
        const croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = origRight - origLeft;
        croppedCanvas.height = origBottom - origTop;
        croppedCanvas.getContext('2d').drawImage(img, origLeft, origTop, croppedCanvas.width, croppedCanvas.height, 0, 0, croppedCanvas.width, croppedCanvas.height);

        croppedCanvas.toBlob((blob) => resolve(new File([blob], "cropped.jpg", { type: "image/jpeg" })), 'image/jpeg', 0.9);
      };
    });
  }

  window.processarImagemAnime = async function(input) {
    if (!input.files || !input.files[0]) return;
    
    const preview = document.getElementById('previewRec');
    preview.style.display = 'block';
    
    const resBox = document.getElementById('resultadoReconhecimento');
    resBox.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A cortar bordas e a otimizar...</p>';

    try {
      // 1. Corta as bordas (agora mais agressivo)
      const fileSemBordas = await recortarBordasPretas(input.files[0]);
      
      // Mostra a imagem cortada no ecrã
      preview.src = URL.createObjectURL(fileSemBordas);
      
      // 2. Comprime
      const fileComprimido = await comprimirImagem(fileSemBordas);
      
      resBox.innerHTML = '<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> A analisar com a IA...</p>';

      // 3. Envia
      const formData = new FormData();
      formData.append('image', fileComprimido);
      
      const response = await fetch('https://api.trace.moe/search?anilistInfo=true', { method: 'POST', body: formData });
      const data = await response.json();
      
      if (data.result && data.result.length > 0) {
        const melhor = data.result[0];
        
        let titulo = 'Anime';
        if (melhor.anilist) {
            titulo = melhor.anilist.title.english || melhor.anilist.title.romaji || melhor.anilist.title.native;
        }
        
        resBox.innerHTML = `
          <div class="rec-item" style="border-left-color: #10b981;">
            <h4><i class="fas fa-check-circle" style="color:#10b981;"></i> Anime Reconhecido!</h4>
            <p><strong>Obra:</strong> ${titulo}</p>
            <p style="font-size:11px; margin-top:5px;">Precisão da IA: ${(melhor.similarity * 100).toFixed(1)}%</p>
          </div>
        `;
        
        document.getElementById('inputPesquisaAnime').value = titulo;
        mudarAba('catalogo');
        pesquisarAnime();
        
      } else {
        resBox.innerHTML = '<p style="text-align:center; color:#ef4444;">Não foi possível reconhecer a imagem.</p>';
      }
    } catch (error) {
      console.error(error);
      resBox.innerHTML = '<p style="text-align:center; color:#ef4444;">Erro ao processar a imagem.</p>';
    }
  };

  if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let utilizadorAtual = null;
  let animeIdAtual = null;
  let sentimentoSelecionado = null;

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
      auth.onAuthStateChanged((user) => {
          if (user) {
              utilizadorAtual = user;
              document.getElementById('userAvatar').innerHTML = `<img src="${user.photoURL || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">`;
          } else {
              window.location.href = "login.html";
          }
      });
  });

  window.selecionarSentimento = function(tipo) {
    sentimentoSelecionado = tipo;
    document.getElementById('btnSentPos').classList.remove('ativo-positivo');
    document.getElementById('btnSentNeg').classList.remove('ativo-negativo');
    if(tipo === 'positivo') document.getElementById('btnSentPos').classList.add('ativo-positivo');
    if(tipo === 'negativo') document.getElementById('btnSentNeg').classList.add('ativo-negativo');
  };

  function carregarComentariosAnime(id) {
    animeIdAtual = id;
    const lista = document.getElementById('listaComentariosAnime');
    lista.innerHTML = '<p style="text-align:center; color:var(--text-sub);"><i class="fas fa-spinner fa-spin"></i> A carregar comentários...</p>';

    db.collection("comentarios_animes").doc(id).onSnapshot((doc) => {
      const data = doc.exists ? doc.data() : { comentarios: [] };
      const comentarios = data.comentarios || [];
      lista.innerHTML = '';

      if (comentarios.length === 0) {
        lista.innerHTML = '<p style="text-align:center; color:var(--text-sub);">Nenhum comentário ainda. Sê o primeiro!</p>';
        return;
      }

      comentarios.forEach(c => {
        const badge = c.sentimento === 'positivo' 
          ? '<span class="sentimento-badge sent-positivo">👍 Positivo</span>' 
          : '<span class="sentimento-badge sent-negativo">👎 Negativo</span>';
        
        lista.innerHTML += `
          <div class="comentario">
            <div class="comentario-header">
              <img src="${c.fotoUser || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="comentario-foto">
              <div class="comentario-info">
                <h5>${c.nome} ${badge}</h5>
                <p>${c.texto}</p>
              </div>
            </div>
          </div>
        `;
      });
    });
  }

  window.enviarComentarioAnime = async function() {
    const input = document.getElementById('inputComentarioAnime');
    const texto = input.value.trim();
    if (!texto) return alert("Escreve um comentário!");
    if (!sentimentoSelecionado) return alert("Escolhe Positivo 👍 ou Negativo 👎!");

    input.value = '';
    const novoComentario = {
      uid: utilizadorAtual.uid,
      nome: utilizadorAtual.displayName || "Membro",
      fotoUser: utilizadorAtual.photoURL || "",
      texto: texto,
      sentimento: sentimentoSelecionado,
      data: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("comentarios_animes").doc(animeIdAtual).set({
        comentarios: firebase.firestore.FieldValue.arrayUnion(novoComentario)
      }, { merge: true });
      
      sentimentoSelecionado = null;
      document.getElementById('btnSentPos').classList.remove('ativo-positivo');
      document.getElementById('btnSentNeg').classList.remove('ativo-negativo');
    } catch (error) {
      console.error(error);
    }
  };

  window.addEventListener('DOMContentLoaded', () => {
      carregarAnimesAPI();
  });
</script>
